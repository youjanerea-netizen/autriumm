 des lignes forme le bloc. Oublier l'indentation est une erreur de syntaxe."}]},{"id":"py-bases","title":"Valeurs et print","summary":"Variables, types simples, et affichage.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"prenom = \"Awa\"\nage = 20\nprint(\"Bonjour\", prenom)\nprint(age + 1)"},{"type":"ul","items":["Pas de mot-clé pour déclarer : le premier `=` crée le nom.","Texte entre quotes, nombres sans quotes, booléens `True` et `False` avec une majuscule.","`print` affiche. Plusieurs arguments sont séparés par un espace.","f-string : `print(f\"{prenom} a {age} ans\")`.","`type(prenom)` et `int(\"3\")` convertit un texte en nombre. `input()` lit une ligne, toujours en texte."]}],"exercises":[{"type":"write","id":"py-bases-w","prompt":"Crée ville = \"Dakar\" et habitants = 1000, puis affiche une f-string qui contient les deux.","lang":"python","starter":"# ville et habitants\n","solution":"ville = \"Dakar\"\nhabitants = 1000\nprint(f\"{ville} : {habitants}\")","expected":"Dakar : 1000","mustInclude":["ville","habitants","print"]}]},{"id":"py-conditions","title":"Conditions","summary":"if, elif, else.","minutes":7,"blocks":[{"type":"code","lang":"python","code":"note = 12\nif note >= 16:\n    print(\"très bien\")\nelif note >= 10:\n    print(\"admis\")\nelse:\n    print(\"à reprendre\")"},{"type":"p","text":"Le `:` ouvre le bloc, les lignes suivantes sont indentées. `elif` enchaîne un cas. Les comparaisons ressemblent à celles des maths, et `==` teste l'égalité. `and`, `or`, `not` combinent."}],"exercises":[{"type":"write","id":"py-conditions-w","prompt":"Si temperature > 25, affiche chaud, sinon affiche doux. temperature vaut 27.","lang":"python","starter":"temperature = 27\n","solution":"temperature = 27\nif temperature > 25:\n    print(\"chaud\")\nelse:\n    print(\"doux\")","expected":"chaud","mustInclude":["if","else","print"]}]},{"id":"py-boucles","title":"Boucles","summary":"for, range, while.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"for i in range(3):\n    print(i)\n\nlangues = [\"HTML\", \"CSS\"]\nfor langue in langues:\n    print(langue)"},{"type":"p","text":"`range(3)` produit 0, 1, 2. `range(1, 4)` produit 1, 2, 3. `while` répète tant que la condition est vraie : pense à modifier la variable, sinon la boucle ne s'arrête pas."}],"exercises":[{"type":"write","id":"py-boucles-w","prompt":"Affiche les nombres de 1 à 3 inclus, un par ligne, avec for et range.","lang":"python","starter":"","solution":"for nombre in range(1, 4):\n    print(nombre)","expected":"1\n2\n3","mustInclude":["for","range","print"]}]},{"id":"py-fonctions","title":"Fonctions","summary":"def, paramètres, return.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"def aire(largeur, hauteur):\n    return largeur * hauteur\n\nprint(aire(4, 3))"},{"type":"p","text":"`def` nomme la fonction. `return` renvoie une valeur. Sans return, la fonction renvoie `None`. Appeler la fonction ne la définit pas : les deux lignes ont des rôles différents."}],"exercises":[{"type":"write","id":"py-fonctions-w","prompt":"Définis saluer(prenom) qui retourne la chaîne Bonjour suivie d'un espace et du prénom. Affiche saluer(\"Awa\").","lang":"python","starter":"","solution":"def saluer(prenom):\n    return \"Bonjour \" + prenom\n\nprint(saluer(\"Awa\"))","expected":"Bonjour Awa","mustInclude":["def","return","print"]}]},{"id":"py-listes","title":"Listes et dictionnaires","summary":"Crochets, append, et paires clé-valeur.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"notes = [12, 15]\nnotes.append(18)\nprint(notes[0])\nprint(len(notes))\n\nlivre = {\"titre\": \"Beloved\", \"prix\": 16}\nprint(livre[\"titre\"])"},{"type":"p","text":"L'indice 0 est le premier élément. Un dictionnaire associe une clé à une valeur, comme une fiche. `len` donne le nombre d'éléments. Ces structures servent dès qu'un programme garde plus d'un nombre."}],"exercises":[{"type":"write","id":"py-listes-w","prompt":"Crée une liste de deux titres, ajoute-en un troisième avec append, et affiche la longueur.","lang":"python","starter":"","solution":"titres = [\"Beloved\", \"Sula\"]\ntitres.append(\"Jazz\")\nprint(len(titres))","expected":"3","mustInclude":["append","print","len"]}]},{"id":"py-fichiers","title":"Fichiers et programmes","summary":"Lire un texte, écrire un script qui a un début et une fin.","minutes":8,"blocks":[{"type":"p","text":"Un programme un peu utile lit ou écrit des fichiers. `with open(\"notes.txt\", encoding=\"utf-8\") as fichier:` ferme le fichier même en cas d'erreur. `fichier.read()` renvoie le texte. Pour écrire : `open(\"sortie.txt\", \"w\", encoding=\"utf-8\")`."},{"type":"code","lang":"python","code":"with open(\"notes.txt\", encoding=\"utf-8\") as fichier:\n    texte = fichier.read()\nprint(texte)"},{"type":"p","text":"Avant d'écrire le fichier, écris en français ce que le programme doit faire, en trois lignes. Ensuite seulement le code. C'est valable pour tous les langages de ce cours : une tâche claire tient dans un petit programme. Une tâche floue en produit un long."}],"exercises":[{"type":"write","id":"py-fichiers-w","prompt":"Écris le with open qui lit notes.txt en UTF-8 dans la variable texte, puis print(texte). Tu n'as pas le fichier ici : la forme du code suffit.","lang":"python","starter":"","solution":"with open(\"notes.txt\", encoding=\"utf-8\") as fichier:\n    texte = fichier.read()\nprint(texte)","mustInclude":["open","utf-8","read"]}]}]}]},{"id":"php","title":"PHP","kicker":"Le serveur","summary":"Produire une page, lire un formulaire, parler à une base sans l'exposer.","chapters":[{"id":"php-1","title":"PHP","lessons":[{"id":"php-serveur","title":"Côté serveur","summary":"Ce que le visiteur ne voit pas calculer.","minutes":7,"blocks":[{"type":"p","text":"Le navigateur reçoit du HTML. PHP travaille avant, sur le serveur : il peut décider du HTML à envoyer, lire un formulaire, ouvrir une session, parler à une base. Le visiteur ne reçoit en général pas le fichier `.php`, il reçoit le résultat."},{"type":"ul","items":["Un fichier PHP commence par `\u003c?php` et se termine souvent par `?>` (omis en fin de fichier pur).","Il faut un serveur qui comprend PHP. Ouvrir le fichier en double clic montre le code, pas la page.","Tout ce qui est secret (mot de passe de base, clé) reste sur le serveur, jamais dans JavaScript ni dans le HTML."]},{"type":"note","text":"Comme pour Python, tu t'entraînes ici à écrire. PHP ne s'exécute pas dans l'aperçu."}],"exercises":[{"type":"quiz","id":"php-serveur-q","prompt":"Où s'exécute PHP ?","choices":["Dans le CSS","Sur le serveur, avant d'envoyer la page","Uniquement dans la console du visiteur","Dans l'attribut alt"],"answer":1,"explain":"PHP produit souvent le HTML que le navigateur affichera. Le calcul a déjà eu lieu."}]},{"id":"php-bases","title":"echo, variables, chaînes","summary":"Les premiers signes du langage.","minutes":8,"blocks":[{"type":"code","lang":"php","code":"\u003c?php\n$prenom = \"Awa\";\n$age = 20;\necho \"Bonjour \" . $prenom;\necho \"\u003cp>Âge : \" . $age . \"\u003c/p>\";"},{"type":"ul","items":["Toute variable commence par `$`.","`echo` envoie du texte vers la page. Le point `.` concatène.","Une instruction se termine par `;`.","Les chaînes doubles interprètent `$prenom`. Les chaînes simples non. En cas de doute, concatène.","`// commentaire` ou `/* bloc */`."]},{"type":"caution","text":"Echo d'un texte venu du visiteur directement dans le HTML peut créer une faille XSS. On échappe d'abord avec `htmlspecialchars`."}],"exercises":[{"type":"write","id":"php-bases-w","prompt":"Déclare $titre = \"Atrium\" et echo un h1 qui contient cette variable, en concaténant.","lang":"php","starter":"\u003c?php\n","solution":"\u003c?php\n$titre = \"Atrium\";\necho \"\u003ch1>\" . $titre . \"\u003c/h1>\";","expected":"\u003ch1>Atrium\u003c/h1>","mustInclude":["$titre","echo"]}]},{"id":"php-conditions","title":"Conditions et listes","summary":"if, tableaux, foreach.","minutes":8,"blocks":[{"type":"code","lang":"php","code":"\u003c?php\n$langues = [\"HTML\", \"CSS\", \"PHP\"];\nforeach ($langues as $langue) {\n    echo \"\u003cli>\" . htmlspecialchars($langue) . \"\u003c/li>\";\n}"},{"type":"p","text":"`if ($age >= 18) { ... } else { ... }` ressemble à JavaScript, avec le dollar et des accolades. `foreach` parcourt un tableau. `[]` crée un tableau. `count($langues)` donne la longueur."}],"exercises":[{"type":"write","id":"php-conditions-w","prompt":"Si $note >= 10, echo admis, sinon echo refusé. $note vaut 12.","lang":"php","starter":"\u003c?php\n$note = 12;\n","solution":"\u003c?php\n$note = 12;\nif ($note >= 10) {\n    echo \"admis\";\n} else {\n    echo \"refusé\";\n}","expected":"admis","mustInclude":["if","else","echo"]}]},{"id":"php-formulaires","title":"Lire un formulaire","summary":"$_POST, et pourquoi le HTML ne suffit pas.","minutes":10,"blocks":[{"type":"p","text":"Quand un formulaire `method=\"post\"` est envoyé vers un script PHP, les champs `name` arrivent dans le tableau `$_POST`. `$_GET` correspond à method get et à l'adresse."},{"type":"code","lang":"php","code":"\u003c?php\n$email = $_POST[\"email\"] ?? \"\";\n$email = trim($email);\nif ($email === \"\") {\n    echo \"E-mail manquant\";\n} else {\n    echo \"Reçu\";\n}"},{"type":"ul","items":["Le `name` HTML et la clé PHP doivent être les mêmes.","`??` fournit une valeur si la clé n'existe pas.","Revérifie sur le serveur : required dans le HTML peut être contourné.","N'affiche pas l'e-mail brut dans la page sans `htmlspecialchars`.","Un mot de passe ne se stocke pas tel quel : on enregistre une empreinte (`password_hash`) et on vérifie avec `password_verify`."]}],"exercises":[{"type":"write","id":"php-formulaires-w","prompt":"Lis $_POST[\"pseudo\"], utilise ?? \"\", passe-le dans trim, et si la chaîne est vide echo « Pseudo manquant », sinon echo « Bonjour ».","lang":"php","starter":"\u003c?php\n","solution":"\u003c?php\n$pseudo = trim($_POST[\"pseudo\"] ?? \"\");\nif ($pseudo === \"\") {\n    echo \"Pseudo manquant\";\n} else {\n    echo \"Bonjour\";\n}","mustInclude":["$_POST","trim","echo"]}]},{"id":"php-donnees","title":"Sessions et base","summary":"Se souvenir d'une personne, sans coller SQL et variables.","minutes":9,"blocks":[{"type":"p","text":"HTTP oublie le visiteur entre deux requêtes. `session_start()` puis `$_SESSION[\"user_id\"]` gardent un identifiant côté serveur, relié à un cookie de session. Ce n'est pas un mot de passe stocké dans le cookie."},{"type":"p","text":"Pour enregistrer vraiment, PHP parle à une base avec SQL. On n'assemble jamais une requête en collant une variable :"},{"type":"code","lang":"php","code":"\u003c?php\n// À ne pas faire : \"SELECT * FROM users WHERE email = '$email'\"\n// À faire : une requête préparée, la valeur envoyée à part.\n$stmt = $pdo->prepare(\"SELECT id FROM users WHERE email = ?\");\n$stmt->execute([$email]);"},{"type":"caution","text":"Coller `$email` dans le SQL permet une injection : la personne peut fermer la chaîne et ajouter une commande. La requête préparée sépare le texte SQL des valeurs."}],"exercises":[{"type":"quiz","id":"php-donnees-q","prompt":"Pourquoi éviter SELECT ... WHERE email = '$email' ?","choices":["Parce que les dollars sont interdits en SQL","Parce qu'une valeur peut modifier la requête","Parce que POST n'existe pas","Parce que htmlspecialchars remplace SQL"],"answer":1,"explain":"C'est l'injection SQL. Les requêtes préparées envoient la valeur à côté de la phrase SQL, pas dedans."}]}]}]},{"id":"sql","title":"SQL","kicker":"Les données","summary":"Lire, filtrer et modifier des tables, puis les relier.","chapters":[{"id":"sql-1","title":"SQL","lessons":[{"id":"sql-tables","title":"Tables, lignes, colonnes","summary":"Ce qu'une base range, avant d'écrire une requête.","minutes":7,"blocks":[{"type":"p","text":"Une base de données relationnelle range des tables. Une table a des colonnes (titre, auteur, prix) et des lignes (un livre par ligne). SQL est le langage pour interroger et modifier ces tables. Il ne dessine pas la page : un autre programme (PHP, Python, JavaScript serveur) envoie le SQL et reçoit les lignes."},{"type":"ul","items":["Une colonne a un rôle stable. On ne met pas le prix dans la colonne du titre.","Chaque ligne devrait se distinguer, souvent par un `id` numérique.","On n'écrit pas deux fois la même information si on peut l'éviter : le lecteur d'un emprunt référence `livre_id`, il ne recopie pas tout le livre."]},{"type":"note","text":"Le bac à sable exécute une requête à la fois sur les tables de l'exercice : SELECT, INSERT, UPDATE, DELETE, et un INNER JOIN simple. Pas de CREATE TABLE ici."}],"exercises":[{"type":"quiz","id":"sql-tables-q","prompt":"Dans une table de livres, une ligne représente plutôt…","choices":["Toute la bibliothèque","Un livre","Une colonne","Le fichier CSS"],"answer":1,"explain":"Chaque ligne est un enregistrement. Les colonnes sont les champs de cet enregistrement."}]},{"id":"sql-select","title":"Lire avec SELECT","summary":"Choisir des colonnes et lire des lignes.","minutes":9,"blocks":[{"type":"code","lang":"sql","code":"SELECT titre, auteur\nFROM livres;"},{"type":"p","text":"`SELECT *` prend toutes les colonnes. Nommer les colonnes est plus clair. `FROM` dit la table. L'ordre des colonnes dans SELECT est l'ordre du résultat, pas l'ordre de la table. `ORDER BY prix DESC` trie, du plus grand au plus petit. `ASC` est le sens par défaut."},{"type":"table","caption":"livres, au départ de chaque exercice","headers":["id","titre","auteur","prix"],"rows":[["1","L'étranger","Camus","9"],["2","Poésies","Césaire","14"],["3","Une si longue lettre","Bâ","11"],["4","Beloved","Morrison","16"]]}],"exercises":[{"type":"sql","id":"sql-select-ex","prompt":"Affiche le titre et le prix de tous les livres, du plus cher au moins cher.","starter":"SELECT titre\nFROM livres;","solution":"SELECT titre, prix\nFROM livres\nORDER BY prix DESC;","seeds":[{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"Deux colonnes, titre puis prix, Beloved en premier."}]},{"id":"sql-filtrer","title":"Filtrer avec WHERE","summary":"Ne garder que les lignes qui t'intéressent.","minutes":8,"blocks":[{"type":"code","lang":"sql","code":"SELECT titre, prix\nFROM livres\nWHERE prix \u003c 12 AND auteur = 'Camus';"},{"type":"p","text":"Le texte se met entre quotes simples. Le nombre non. `=`, `\u003c`, `>`, `\u003c=`, `>=`, `\u003c>` comparent. `AND` exige les deux conditions. `OR` en demanderait une seule. WHERE se place après FROM et avant ORDER BY."}],"exercises":[{"type":"sql","id":"sql-filtrer-ex","prompt":"Titres des livres dont le prix est strictement inférieur à 12.","starter":"SELECT titre\nFROM livres;","solution":"SELECT titre\nFROM livres\nWHERE prix \u003c 12;","seeds":[{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"L'étranger et Une si longue lettre."}]},{"id":"sql-modifier","title":"Ajouter, modifier, supprimer","summary":"INSERT, UPDATE, DELETE — et le WHERE qui protège.","minutes":10,"blocks":[{"type":"code","lang":"sql","code":"INSERT INTO livres (id, titre, auteur, prix)\nVALUES (5, 'Sula', 'Morrison', 13);\n\nUPDATE livres\nSET prix = 15\nWHERE id = 2;\n\nDELETE FROM livres\nWHERE id = 5;"},{"type":"caution","text":"UPDATE ou DELETE sans WHERE modifie ou vide toute la table. Relis la condition avant de lancer ça sur une vraie base. Ici, chaque exécution repart des données de départ."}],"exercises":[{"type":"sql","id":"sql-modifier-ex","prompt":"Passe le prix de Beloved (id 4) à 18. Ne change pas les autres lignes.","starter":"UPDATE livres\nSET prix = 18;","solution":"UPDATE livres\nSET prix = 18\nWHERE id = 4;","seeds":[{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"Une seule ligne change : Beloved vaut 18."},{"type":"quiz","id":"sql-modifier-q","prompt":"Que fait DELETE FROM livres; sans WHERE ?","choices":["Supprime la colonne prix","Supprime toutes les lignes","Supprime la base entière quoi qu'il arrive","N'a aucun effet"],"answer":1,"explain":"Sans filtre, toutes les lignes de la table partent. La structure de la table, elle, reste."}]},{"id":"sql-joindre","title":"Relier deux tables","summary":"INNER JOIN quand une ligne en désigne une autre.","minutes":10,"blocks":[{"type":"p","text":"emprunts ne recopie pas le titre du livre : il garde `livre_id`. Pour voir le titre et le lecteur ensemble, on joint."},{"type":"code","lang":"sql","code":"SELECT livres.titre, emprunts.lecteur\nFROM livres\nINNER JOIN emprunts ON livres.id = emprunts.livre_id;"},{"type":"p","text":"INNER JOIN ne garde que les lignes qui trouvent une correspondance. Un livre jamais emprunté n'apparaît pas. Quand un nom de colonne existe des deux côtés (`id`), on le préfixe : `livres.id`. Les jointures sont la raison de séparer les tables plutôt que tout empiler dans une seule."}],"exercises":[{"type":"sql","id":"sql-joindre-ex","prompt":"Affiche le lecteur et le titre du livre emprunté, pour chaque emprunt.","starter":"SELECT lecteur\nFROM emprunts;","solution":"SELECT emprunts.lecteur, livres.titre\nFROM emprunts\nINNER JOIN livres ON emprunts.livre_id = livres.id;","seeds":[{"name":"emprunts","columns":["id","livre_id","lecteur"],"rows":[[1,1,"Awa"],[2,4,"Jonas"],[3,1,"Léa"]]},{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"Awa et Léa avec L'étranger, Jonas avec Beloved."}]}]}]},{"id":"pratique","title":"Pratique","kicker":"Outils et mise en ligne","summary":"Méthode, sécurité minimale, et ce que veut dire publier une page.","chapters":[{"id":"prat-1","title":"Travailler","lessons":[{"id":"prat-outils","title":"Fichiers, éditeur, navigateur","summary":"Le minimum pour travailler sans te perdre.","minutes":8,"blocks":[{"type":"ul","items":["Un dossier de projet : `index.html`, `style.css`, `site.js`, un dossier `images`. Des noms courts, sans espaces.","Un éditeur (VS Code, Zed, ou un autre) colore le code et montre les erreurs de frappe.","Le navigateur affiche la page. Les outils de développement (inspecter) montrent le HTML réel, le CSS appliqué, et la console.","Recharge la page après une modification. Si un fichier ne change pas, c'est souvent un cache ou un mauvais chemin dans `href` ou `src`.","Git, plus tard, photographie l'historique : un commit est une sauvegarde commentée. Tu n'en as pas besoin pour la première page. Tu en auras besoin dès que tu as peur de casser quelque chose."]},{"type":"p","text":"Les commentaires (`\u003c!-- -->`, `/* */`, `//`) expliquent une décision étrange. Ils ne répètent pas ce que la ligne dit déjà."}],"exercises":[{"type":"quiz","id":"prat-outils-q","prompt":"Le CSS ne semble pas s'appliquer. Quoi vérifier en premier ?","choices":["La couleur du bureau","Le chemin dans link href, et que le fichier est bien enregistré","Le DOCTYPE, qui bloque le CSS","Le alt des images"],"answer":1,"explain":"Un href faux ou un fichier non enregistré explique la plupart des « mon CSS ne marche pas » du début."}]},{"id":"prat-qualite","title":"Avancer par petits pas","summary":"Une méthode plus utile qu'un framework.","minutes":6,"blocks":[{"type":"ol","items":["Écris en une phrase ce que la page doit faire.","Pose le HTML sans style. Le plan se lit-il ?","Ajoute le CSS d'une zone, recharge, puis la suivante.","Ajoute un seul comportement JavaScript, teste le clic, puis le suivant.","Nomme d'après le rôle : `.carte`, `.prix`, pas `.bleu` ni `.truc`.","Quand ça casse, retire la dernière modification au lieu d'en empiler une autre."]},{"type":"note","text":"Relire son code à voix haute, ligne à ligne, trouve autant d'erreurs qu'un outil. Surtout une balise non fermée, une accolade, une quote."}],"exercises":[{"type":"quiz","id":"prat-qualite-q","prompt":"Tu ajoutes dix règles CSS d'un coup et la page « casse ». Que faire ?","choices":["Tout réécrire dans un autre langage","Revenir à la dernière version qui marchait et réintroduire peu à peu","Mettre !important partout","Supprimer le DOCTYPE"],"answer":1,"explain":"Un petit pas se défait. Un gros tas de changements cache la ligne fautive."}]},{"id":"prat-securite","title":"Sécurité, le minimum","summary":"Ne pas faire confiance au navigateur.","minutes":9,"blocks":[{"type":"ul","items":["La validation HTML aide la personne. Le serveur revérifie, toujours.","Les mots de passe se stockent sous forme d'empreinte, jamais en clair, jamais dans un fichier JS.","XSS : un texte de visiteur inséré comme HTML peut devenir une balise. Affiche-le comme texte.","Injection SQL : une valeur collée dans une requête peut la réécrire. Requêtes préparées.","Fichiers téléversés : limite la taille, le type, et ne les exécute pas comme du code.","HTTPS chiffre l'échange entre le navigateur et le serveur. Un formulaire de connexion sans HTTPS montre le mot de passe sur le réseau.","`target=\"_blank\"` s'accompagne de `rel=\"noopener noreferrer\"`."]},{"type":"p","text":"Tu n'as pas à devenir spécialiste pour appliquer ces réflexes. Ils empêchent les erreurs qui font mal dès la première inscription."}],"exercises":[{"type":"quiz","id":"prat-securite-q","prompt":"Un champ required suffit-il à garantir un e-mail valide côté serveur ?","choices":["Oui, le navigateur l'impose à tous","Non, la requête peut être envoyée autrement","Oui, si la page est en HTML5","Non, seulement parce que POST efface le champ"],"answer":1,"explain":"N'importe qui peut envoyer une requête sans passer par ton formulaire. Le serveur revérifie."}]},{"id":"prat-ligne","title":"Mettre en ligne","summary":"Du fichier sur ton ordinateur à une adresse.","minutes":8,"blocks":[{"type":"p","text":"Tant que tes fichiers sont sur ta machine, toi seul les ouvres. Les mettre en ligne, c'est les copier sur un ordinateur qui répond à une adresse. Pour un site de pages HTML, CSS et JavaScript, un hébergement statique suffit : il sert les fichiers tels quels."},{"type":"ul","items":["PHP a besoin d'un hébergement qui exécute PHP, pas d'un simple dépôt de fichiers.","Une base SQL est un service à part, avec un identifiant que tu ne publies pas dans le code front.","Un nom de domaine pointe vers l'hébergement grâce au DNS. Le domaine n'est pas le site : c'est l'adresse.","Vérifie les chemins relatifs une fois en ligne. `images/a.webp` doit exister au même endroit relatif que sur ta machine.","Regarde la page sur un téléphone après la mise en ligne, pas seulement dans la fenêtre large de l'éditeur."]},{"type":"note","text":"Tu peux déjà finir le parcours dans l'atelier : une page complète, lisible, avec formulaire qui ne prétend pas encore enregistrer. Brancher un vrai serveur sera une étape suivante, pas un mystère nouveau."}],"exercises":[{"type":"web","id":"prat-ligne-web","prompt":"Compose dans l'atelier de l'exercice une carte de visite : un header avec ton nom en h1, un paragraphe, une liste de trois liens ou compétences, et un fond de page lisible en CSS. C'est ta page à mettre en ligne le jour où tu voudras.","files":["html","css"],"starter":{"html":"\u003cheader>\n  \u003ch1>\u003c/h1>\n\u003c/header>\n\u003cmain>\n\u003c/main>","css":"body { margin: 0; font-family: Georgia, serif; }","js":""},"solution":{"html":"\u003cheader>\n  \u003ch1>Awa Ndiaye\u003c/h1>\n\u003c/header>\n\u003cmain>\n  \u003cp>J'apprends à construire des pages claires.\u003c/p>\n  \u003cul>\n    \u003cli>HTML\u003c/li>\n    \u003cli>CSS\u003c/li>\n    \u003cli>JavaScript\u003c/li>\n  \u003c/ul>\n\u003c/main>","css":"body{margin:0;font-family:Georgia,serif;background:#f4efe6;color:#1c1915}\nheader,main{padding:1.25rem 1.5rem;max-width:36rem}\nh1{margin:0 0 .5rem;font-weight:560}\na{color:#0e6b52}","js":""}}]}]}]}],"presets":[{"id":"vide","title":"Page vide","html":"\u003ch1>Titre\u003c/h1>\n\u003cp>Écris ici.\u003c/p>\n","css":"body {\n  font-family: Georgia, serif;\n  line-height: 1.5;\n}\n","js":""},{"id":"carte","title":"Carte","html":"\u003carticle class=\"carte\">\n  \u003cp class=\"kicker\">Atelier\u003c/p>\n  \u003ch1>Page claire\u003c/h1>\n  \u003cp>Un texte court, une bordure, assez d'air.\u003c/p>\n\u003c/article>\n","css":"body { font-family: Georgia, serif; background: #f4efe6; }\n.carte { max-width: 22rem; background: #fbf8f2; border: 1px solid #e3d9cc; border-radius: 0.75rem; padding: 1.25rem; }\n.kicker { margin: 0; letter-spacing: 0.04em; text-transform: uppercase; font-family: system-ui, sans-serif; font-size: 0.75rem; }\nh1 { margin: 0.25rem 0 0.5rem; font-size: 1.8rem; }\np { margin: 0; }\n","js":""},{"id":"barre","title":"Barre","html":"\u003cheader class=\"barre\">\n  \u003cstrong>Atrium\u003c/strong>\n  \u003cnav>\n    \u003ca href=\"#\">Cours\u003c/a>\n    \u003ca href=\"#\">Atelier\u003c/a>\n  \u003c/nav>\n\u003c/header>\n\u003cmain>\u003cp>Le contenu commence sous la barre.\u003c/p>\u003c/main>\n","css":"body { margin: 0; font-family: system-ui, sans-serif; }\n.barre { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 1rem; background: #1c1915; color: #f4efe6; }\nnav { display: flex; gap: 0.75rem; }\na { color: #f4efe6; }\nmain { padding: 1rem; }\n","js":""},{"id":"grille","title":"Grille","html":"\u003csection class=\"cartes\">\n  \u003carticle>HTML\u003c/article>\n  \u003carticle>CSS\u003c/article>\n  \u003carticle>JavaScript\u003c/article>\n  \u003carticle>SQL\u003c/article>\n\u003c/section>\n","css":".cartes {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));\n  gap: 0.75rem;\n}\narticle {\n  padding: 1rem;\n  border: 1px solid #e3d9cc;\n  border-radius: 0.75rem;\n  background: white;\n}\n","js":""},{"id":"bonjour","title":"Bouton","html":"\u003clabel for=\"prenom\">Prénom\u003c/label>\n\u003cinput id=\"prenom\" />\n\u003cbutton id=\"dire\" type=\"button\">Dire bonjour\u003c/button>\n\u003cp id=\"sortie\">\u003c/p>\n","css":"body { display: grid; gap: 0.5rem; max-width: 18rem; font-family: system-ui, sans-serif; }\ninput, button { font: inherit; padding: 0.45rem; }\n","js":"const champ = document.querySelector(\"#prenom\");\nconst bouton = document.querySelector(\"#dire\");\nconst sortie = document.querySelector(\"#sortie\");\nbouton.addEventListener(\"click\", () => {\n  const prenom = champ.value.trim();\n  sortie.textContent = prenom ? \"Bonjour \" + prenom : \"Écris un prénom\";\n});\n"}]};</script>
<script>const SQL=(()=>{                                       

                        
               
                    
                     
  

                          
           
                            
                    
                     
                  
                          
                     
  

                                                      

                                                

const AMBIG = Symbol("ambig");

                                    

              
                                   
                           
  

function cloneTables(tables            )             {
  return tables.map((table) => ({
    name: table.name,
    columns: [...table.columns],
    rows: table.rows.map((row) => [...row]),
  }));
}

function stripComments(sql        ) {
  return sql.replace(/--[^\n]*/g, " ");
}

function shield(sql        ) {
  const strings           = [];
  const text = sql.replace(/'(?:''|[^'])*'|"(?:\\"|[^"])*"/g, (match) => {
    const quote = match[0];
    const inner = match.slice(1, -1).replace(quote === "'" ? /''/g : /""/g, quote);
    strings.push(inner);
    return `§${strings.length - 1}§`;
  });
  return { text, strings };
}

function normalize(source        )                                                   {
  let raw = stripComments(source).trim();
  if (!raw) return { ok: false, error: "Écris une requête." };
  raw = raw.replace(/;+\s*$/, "").trim();
  if (raw.includes(";")) {
    return { ok: false, error: "Une seule requête à la fois." };
  }
  const { text, strings } = shield(raw);
  const flat = text.replace(/\s+/g, " ").trim().toLowerCase();
  return { text: flat, strings };
}

function findTable(tables            , name        ) {
  return tables.find((table) => table.name.toLowerCase() === name);
}

function parseValue(token        , strings          )                  {
  const placeholder = token.match(/^§(\d+)§$/);
  if (placeholder) return strings[Number(placeholder[1])] ?? null;
  if (/^-?\d+(\.\d+)?$/.test(token)) return Number(token);
  return null;
}

function asNumber(value          )                {
  if (typeof value === "number") return value;
  if (/^-?\d+(\.\d+)?$/.test(value)) return Number(value);
  return null;
}

function compare(left          , op        , right          ) {
  const a = asNumber(left);
  const b = asNumber(right);
  const numeric = a !== null && b !== null;
  if (op === "=") return numeric ? a === b : String(left) === String(right);
  if (op === "!=" || op === "<>") return numeric ? a !== b : String(left) !== String(right);
  if (!numeric) {
    const ls = String(left);
    const rs = String(right);
    if (op === "<") return ls < rs;
    if (op === ">") return ls > rs;
    if (op === "<=") return ls <= rs;
    if (op === ">=") return ls >= rs;
    return false;
  }
  if (op === "<") return a < b;
  if (op === ">") return a > b;
  if (op === "<=") return a <= b;
  if (op === ">=") return a >= b;
  return false;
}

function splitComma(list        ) {
  return list
    .split(",")
    .map((part) => part.trim())
    .filter(Boolean);
}

                                                         

function parseWhere(where        , strings          )                      {
  const parts = where.split(/\s+and\s+/);
  const preds         = [];
  for (const part of parts) {
    const match = part.trim().match(/^([a-z_][a-z0-9_.]*)\s*(<=|>=|<>|!=|=|<|>)\s*(\S+)$/);
    if (!match) {
      return {
        ok: false,
        error: `Condition trop complexe : « ${part.trim()} ». Utilise =, <, >, <=, >=, != et AND.`,
      };
    }
    const value = parseValue(match[3], strings);
    if (value === null) {
      return { ok: false, error: `Valeur illisible : « ${match[3]} ». Entoure le texte de quotes.` };
    }
    preds.push({ col: match[1], op: match[2], value });
  }
  return preds;
}

function scopeFrom(table          , row            )        {
  const qualified = new Map                  ();
  const plain = new Map              ();
  table.columns.forEach((column, index) => {
    const key = column.toLowerCase();
    qualified.set(`${table.name.toLowerCase()}.${key}`, row[index]);
    plain.set(key, row[index]);
  });
  return { qualified, plain };
}

function mergeScopes(left       , right       )        {
  const qualified = new Map(left.qualified);
  const plain = new Map(left.plain);
  right.qualified.forEach((value, key) => qualified.set(key, value));
  right.plain.forEach((value, key) => {
    if (plain.has(key)) plain.set(key, AMBIG);
    else plain.set(key, value);
  });
  return { qualified, plain };
}

function isFailure(value         )                      {
  return typeof value === "object" && value !== null && "ok" in value;
}

function readCol(scope       , col        )                        {
  if (col.includes(".")) {
    if (!scope.qualified.has(col)) return { ok: false, error: `Colonne inconnue : ${col}` };
    return scope.qualified.get(col)            ;
  }
  if (!scope.plain.has(col)) return { ok: false, error: `Colonne inconnue : ${col}` };
  const value = scope.plain.get(col);
  if (value === AMBIG) {
    return {
      ok: false,
      error: `La colonne « ${col} » existe dans plusieurs tables. Précise-la, par exemple livres.${col}.`,
    };
  }
  return value            ;
}

function matchPreds(scope       , preds        )                       {
  for (const pred of preds) {
    const left = readCol(scope, pred.col);
    if (isFailure(left)) return left;
    if (!compare(left, pred.op, pred.value)) return false;
  }
  return true;
}

function sortScopes(scopes         , order                                      )                       {
  const decorated                                           = [];
  for (const scope of scopes) {
    const value = readCol(scope, order.col);
    if (isFailure(value)) return value;
    decorated.push({ scope, value });
  }
  const dir = order.dir === "desc" ? -1 : 1;
  decorated.sort((a, b) => {
    if (a.value === b.value) return 0;
    const left = asNumber(a.value);
    const right = asNumber(b.value);
    if (left !== null && right !== null) return left < right ? -dir : dir;
    return String(a.value) < String(b.value) ? -dir : dir;
  });
  return decorated.map((item) => item.scope);
}

function project(
  scope       ,
  select        ,
  rightName               ,
  tables            ,
)                                                         {
  if (select.trim() === "*") {
    const columns           = [];
    const values             = [];
    scope.qualified.forEach((value, key) => {
      columns.push(rightName ? key : key.split(".")[1]);
      values.push(value);
    });
    return { columns, values };
  }

  const columns           = [];
  const values             = [];
  for (const item of splitComma(select)) {
    if (item.endsWith(".*")) {
      const name = item.slice(0, -2);
      const table = findTable(tables, name);
      if (!table) return { ok: false, error: `Table inconnue : ${name}` };
      for (const column of table.columns) {
        const key = column.toLowerCase();
        columns.push(rightName ? `${name}.${key}` : key);
        values.push(scope.qualified.get(`${name}.${key}`)            );
      }
      continue;
    }
    const value = readCol(scope, item);
    if (isFailure(value)) return value;
    columns.push(item);
    values.push(value);
  }
  return { columns, values };
}

function available(tables            ) {
  return tables.map((table) => table.name).join(", ");
}

function runSelect(
  body        ,
  strings          ,
  tables            ,
  order                                             ,
)            {
  const fromMatch = body.match(/^select\s+(.+)\s+from\s+(.+)$/);
  if (!fromMatch) {
    return { ok: false, error: "Requête SELECT incomplète. Exemple : SELECT titre FROM livres" };
  }
  const select = fromMatch[1];
  let from = fromMatch[2];
  let preds         = [];

  const whereMatch = from.match(/^(.*)\s+where\s+(.+)$/);
  if (whereMatch) {
    from = whereMatch[1];
    const parsed = parseWhere(whereMatch[2], strings);
    if (isFailure(parsed)) return parsed;
    preds = parsed;
  }

  const joinMatch = from.match(
    /^([a-z_][a-z0-9_]*)\s+(?:inner\s+)?join\s+([a-z_][a-z0-9_]*)\s+on\s+([a-z_][a-z0-9_.]*)\s*=\s*([a-z_][a-z0-9_.]*)$/,
  );

  let scopes          = [];
  let rightName                = null;

  if (joinMatch) {
    const leftName = joinMatch[1];
    rightName = joinMatch[2];
    const left = findTable(tables, leftName);
    const right = findTable(tables, rightName);
    if (!left || !right) {
      return { ok: false, error: `Table inconnue. Tables disponibles : ${available(tables)}.` };
    }
    for (const leftRow of left.rows) {
      for (const rightRow of right.rows) {
        const scope = mergeScopes(scopeFrom(left, leftRow), scopeFrom(right, rightRow));
        const onLeft = readCol(scope, joinMatch[3]);
        const onRight = readCol(scope, joinMatch[4]);
        if (isFailure(onLeft)) return onLeft;
        if (isFailure(onRight)) return onRight;
        if (compare(onLeft, "=", onRight)) scopes.push(scope);
      }
    }
  } else {
    if (!/^[a-z_][a-z0-9_]*$/.test(from)) {
      return {
        ok: false,
        error: "Jointure trop complexe. Utilise INNER JOIN ... ON table.col = autre.col.",
      };
    }
    const table = findTable(tables, from);
    if (!table) return { ok: false, error: `Table inconnue : ${from}. Tables : ${available(tables)}.` };
    scopes = table.rows.map((row) => scopeFrom(table, row));
  }

  const kept          = [];
  for (const scope of scopes) {
    const ok = matchPreds(scope, preds);
    if (isFailure(ok)) return ok;
    if (ok) kept.push(scope);
  }

  if (order) {
    const sorted = sortScopes(kept, order);
    if (isFailure(sorted)) return sorted;
    kept.splice(0, kept.length, ...sorted);
  }

  const projected               = [];
  let columns           = [];
  for (const scope of kept) {
    const row = project(scope, select, rightName, tables);
    if (isFailure(row)) return row;
    columns = row.columns;
    projected.push(row.values);
  }
  if (kept.length === 0 && scopes.length > 0) {
    const sample = project(scopes[0], select, rightName, tables);
    if (isFailure(sample)) return sample;
    columns = sample.columns;
  } else if (kept.length === 0 && select.trim() !== "*") {
    columns = splitComma(select);
  }

  return {
    ok: true,
    kind: "select",
    columns,
    rows: projected,
    message: projected.length === 1 ? "1 ligne." : `${projected.length} lignes.`,
    affected: null,
    tables,
  };
}

function runMutate(kind                                , sql        , strings          , tables            )            {
  if (kind === "insert") {
    const match = sql.match(/^insert into\s+([a-z_][a-z0-9_]*)\s*\(([^)]+)\)\s*values\s*\(([^)]+)\)$/);
    if (!match) {
      return { ok: false, error: "INSERT attendu : INSERT INTO livres (titre, prix) VALUES ('Poésies', 14)" };
    }
    const table = findTable(tables, match[1]);
    if (!table) return { ok: false, error: `Table inconnue : ${match[1]}.` };
    const cols = splitComma(match[2]);
    const rawValues = splitComma(match[3]);
    if (cols.length !== rawValues.length) {
      return { ok: false, error: "Le nombre de colonnes et de valeurs ne correspond pas." };
    }
    const unknown = cols.find((col) => !table.columns.some((column) => column.toLowerCase() === col));
    if (unknown) return { ok: false, error: `Colonne inconnue : ${unknown}` };
    const row = table.columns.map(() => ""            );
    for (let index = 0; index < cols.length; index += 1) {
      const at = table.columns.findIndex((column) => column.toLowerCase() === cols[index]);
      const value = parseValue(rawValues[index], strings);
      if (value === null) return { ok: false, error: `Valeur illisible : « ${rawValues[index]} ».` };
      row[at] = value;
    }
    table.rows.push(row);
    return {
      ok: true,
      kind: "mutate",
      columns: table.columns,
      rows: table.rows,
      message: "1 ligne ajoutée.",
      affected: table.name,
      tables,
    };
  }

  if (kind === "update") {
    const match = sql.match(/^update\s+([a-z_][a-z0-9_]*)\s+set\s+(.+)$/);
    if (!match) return { ok: false, error: "UPDATE incomplet. Exemple : UPDATE livres SET prix = 12 WHERE id = 1" };
    const table = findTable(tables, match[1]);
    if (!table) return { ok: false, error: `Table inconnue : ${match[1]}.` };
    let assign = match[2];
    let preds         = [];
    const where = assign.match(/^(.*)\s+where\s+(.+)$/);
    if (where) {
      assign = where[1];
      const parsed = parseWhere(where[2], strings);
      if (isFailure(parsed)) return parsed;
      preds = parsed;
    }
    const pairs = splitComma(assign).map((part) => {
      const eq = part.match(/^([a-z_][a-z0-9_]*)\s*=\s*(\S+)$/);
      return eq ? { col: eq[1], token: eq[2] } : null;
    });
    if (pairs.some((pair) => !pair)) {
      return { ok: false, error: "Affectation illisible. Exemple : SET prix = 12, auteur = 'Bâ'" };
    }
    let count = 0;
    for (const row of table.rows) {
      const scope = scopeFrom(table, row);
      const ok = matchPreds(scope, preds);
      if (isFailure(ok)) return ok;
      if (!ok) continue;
      for (const pair of pairs) {
        if (!pair) continue;
        const at = table.columns.findIndex((column) => column.toLowerCase() === pair.col);
        if (at < 0) return { ok: false, error: `Colonne inconnue : ${pair.col}` };
        const value = parseValue(pair.token, strings);
        if (value === null) return { ok: false, error: `Valeur illisible : « ${pair.token} ».` };
        row[at] = value;
      }
      count += 1;
    }
    return {
      ok: true,
      kind: "mutate",
      columns: table.columns,
      rows: table.rows,
      message: count === 1 ? "1 ligne modifiée." : `${count} lignes modifiées.`,
      affected: table.name,
      tables,
    };
  }

  const match = sql.match(/^delete from\s+([a-z_][a-z0-9_]*)(?:\s+where\s+(.+))?$/);
  if (!match) return { ok: false, error: "DELETE incomplet. Exemple : DELETE FROM livres WHERE id = 2" };
  const table = findTable(tables, match[1]);
  if (!table) return { ok: false, error: `Table inconnue : ${match[1]}.` };
  let preds         = [];
  if (match[2]) {
    const parsed = parseWhere(match[2], strings);
    if (isFailure(parsed)) return parsed;
    preds = parsed;
  }
  const next               = [];
  let count = 0;
  for (const row of table.rows) {
    const ok = matchPreds(scopeFrom(table, row), preds);
    if (isFailure(ok)) return ok;
    if (ok) count += 1;
    else next.push(row);
  }
  table.rows = next;
  return {
    ok: true,
    kind: "mutate",
    columns: table.columns,
    rows: table.rows,
    message: count === 1 ? "1 ligne supprimée." : `${count} lignes supprimées.`,
    affected: table.name,
    tables,
  };
}

function runSql(source        , seeds            )            {
  const prepared = normalize(source);
  if (isFailure(prepared)) return prepared;
  const { text, strings } = prepared;
  const tables = cloneTables(seeds);

  let order                                              = null;
  let sql = text;
  const orderMatch = sql.match(/^(.*)\s+order by\s+([a-z_][a-z0-9_.]*)(?:\s+(asc|desc))?$/);
  if (orderMatch) {
    sql = orderMatch[1].trim();
    order = { col: orderMatch[2], dir: orderMatch[3] === "desc" ? "desc" : "asc" };
    if (!sql.startsWith("select ")) return { ok: false, error: "ORDER BY s'utilise avec SELECT." };
  }

  if (sql.startsWith("select ")) return runSelect(sql, strings, tables, order);
  if (sql.startsWith("insert ")) return runMutate("insert", sql, strings, tables);
  if (sql.startsWith("update ")) return runMutate("update", sql, strings, tables);
  if (sql.startsWith("delete ")) return runMutate("delete", sql, strings, tables);
  return { ok: false, error: "Je ne comprends pas cette requête. Utilise SELECT, INSERT, UPDATE ou DELETE." };
}

function signature(columns          , rows              , ordered         ) {
  const head = columns.map((column) => column.toLowerCase()).join("|");
  const body = rows.map((row) => row.map((value) => `${typeof value}:${String(value)}`).join("\u0001"));
  const lines = ordered ? body : [...body].sort();
  return `${head}#${lines.join("\u0002")}`;
}

function sameOutcome(user            , solution            , ordered         ) {
  if (user.kind !== solution.kind) return false;
  if (user.kind === "select") {
    return signature(user.columns, user.rows, ordered) === signature(solution.columns, solution.rows, ordered);
  }
  const userTable = user.tables.find((table) => table.name === user.affected);
  const solutionTable = solution.tables.find((table) => table.name === solution.affected);
  if (!userTable || !solutionTable) return false;
  return (
    signature(userTable.columns, userTable.rows, false) ===
    signature(solutionTable.columns, solutionTable.rows, false)
  );
}

return{runSql,sameOutcome};})();</script>
