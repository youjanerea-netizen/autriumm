<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,wght@0,400;0,600;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4efe6;--sh:#fbf8f2;--fg:#1c1915;--mu:#4f493f;--ln:#e3d9cc;--ac:#0e6b52;--as:#e3f2eb;--ai:#083d2f;--cb:#1c1915;--cf:#f4efe6;--on:#fff;--sans:Figtree,ui-sans-serif,system-ui,sans-serif;--disp:Fraunces,Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--sh:#1d1a16;--fg:#f1ece2;--mu:#bab1a3;--ln:#3a342b;--ac:#5fcfa6;--as:#12332a;--ai:#bfeadb;--cb:#0c0b09;--cf:#f1ece2;--on:#07241b}}
:root[data-theme="dark"]{--bg:#14120f;--sh:#1d1a16;--fg:#f1ece2;--mu:#bab1a3;--ln:#3a342b;--ac:#5fcfa6;--as:#12332a;--ai:#bfeadb;--cb:#0c0b09;--cf:#f1ece2;--on:#07241b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nv{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;border-bottom:1px solid var(--ln)}
.lg{font:italic 600 22px var(--disp);color:var(--fg);text-decoration:none}
.nv nav a{display:inline-flex;align-items:center;min-height:44px;color:var(--mu);text-decoration:none;font-weight:500}
.w{max-width:820px;margin:0 auto;padding:24px 16px 72px}
.w.big{max-width:1040px}
h1{font:600 clamp(28px,6vw,44px)/1.15 var(--disp);margin:.3em 0 .4em}
h2{font:500 24px/1.25 var(--disp);margin:1.8em 0 .6em}
.k{font:500 13px var(--mono);color:var(--ac);margin:0}
.mu{color:var(--mu)}.sm{font-size:14px}.lead{font-size:18px;max-width:640px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sh);color:var(--fg);font:500 14px var(--sans);cursor:pointer;text-decoration:none}
.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
code{font:14px var(--mono);background:var(--as);color:var(--ai);padding:0 4px;border-radius:5px}
pre{margin:0;overflow-x:auto;font:14px/1.6 var(--mono)}
pre code{background:none;color:inherit;padding:0}
.cd{margin:0;background:var(--cb);color:var(--cf);border-radius:14px;overflow:hidden}
.cd figcaption{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 0 16px;font-size:14px;opacity:.85}
.cd button{min-height:44px;border:0;background:none;color:inherit;font:500 14px var(--sans);cursor:pointer}
.cd pre{padding:0 16px 16px}
.pl{background:var(--sh);border:1px solid var(--ln);border-radius:12px;padding:12px}
.bl{display:flex;flex-direction:column;gap:20px}.bl p,.bl h2{margin:0}
ul,ol{padding-left:22px;margin:0}li{margin:6px 0}
.nt{background:var(--as);color:var(--ai);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;font-size:14px}
.tb{overflow-x:auto;border:1px solid var(--ln);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:360px;font-size:14px;text-align:left}
th{background:var(--sh);font-weight:500}th,td{padding:8px 12px;border-bottom:1px solid var(--ln);vertical-align:top}
.dm{margin:0;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--sh)}
.dm figcaption{padding:8px 16px;font-size:14px;color:var(--mu);border-bottom:1px solid var(--ln)}
iframe{display:block;width:100%;height:256px;border:0;background:#fbf8f2}
.exs{border-top:1px solid var(--ln);margin-top:48px}
.ex{display:flex;flex-direction:column;gap:12px;margin:0 0 44px}.ex p,.ex fieldset{margin:0}
fieldset{border:0;padding:0;display:flex;flex-direction:column;gap:8px}legend{margin-bottom:8px;padding:0}
.q{min-height:44px;text-align:left;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sh);color:var(--fg);font:15px var(--sans);cursor:pointer}
.q.ok{border-color:var(--ac);background:var(--as);color:var(--ai)}.q.no{border-color:var(--fg)}
.ta{display:block;width:100%;box-sizing:border-box;min-height:190px;background:var(--cb);color:var(--cf);font:15px/1.6 var(--mono);padding:16px;border:0;border-radius:12px;resize:vertical;tab-size:2}
details{border:1px solid var(--ln);background:var(--sh);border-radius:12px;padding:0 16px}
summary{min-height:44px;display:flex;align-items:center;font-weight:500;cursor:pointer}
details pre{padding-bottom:16px}
.pg{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--sh)}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--mu);font:500 14px var(--sans);cursor:pointer}
.tabs .on{background:var(--cb);color:var(--cf)}
.pg .ta{display:none;border-radius:0;height:224px}
.big .pg .ta{height:380px}
.pg[data-f=html] .e-html,.pg[data-f=css] .e-css,.pg[data-f=js] .e-js{display:block}
.pvw{display:none}.pg[data-f=p] .pvw{display:block}
.pv{height:288px}.big .pv{height:380px}
.cs{max-height:144px;overflow:auto;background:var(--cb);color:var(--cf);font:14px/1.6 var(--mono);padding:10px 16px}
.cs p{margin:0}.cs:empty::before{content:"La console s’affichera ici.";opacity:.75}
@media(min-width:900px){.bd{display:grid;grid-template-columns:1fr 1fr}.pvw{display:block!important;border-left:1px solid var(--ln)}.tp{display:none}}
.rw,.tc{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);color:var(--fg);text-decoration:none}
.rw{align-items:baseline;min-height:44px}.ck{width:1.2em;color:var(--ac);flex:none}
.tc{flex-direction:column;gap:2px}.tc b{font:500 22px var(--disp)}
#sq{margin:32px 0 8px;width:100%;max-width:420px;min-height:44px;box-sizing:border-box;border:1px solid var(--ln);border-radius:10px;background:var(--sh);color:var(--fg);padding:0 12px;font:16px var(--sans)}
.foot{margin-top:40px;padding-top:24px;border-top:1px solid var(--ln)}
</style>
</head>
<body>
<div id="app"></div>
<script>%%DATA%%</script>
<script>%%SQL%%</script>
<script>
const $=s=>document.querySelector(s),A=$('#app');
let PR={lessons:{},exercises:{},last:null},cur=null,fid=0;
try{Object.assign(PR,JSON.parse(localStorage.getItem('atrium-progress')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('atrium-progress',JSON.stringify(PR))}catch(e){}};
const mark=(id,v)=>{PR.exercises[id]=v;save()};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T=s=>esc(String(s).replace(/(\p{L})'(\p{L})/gu,'$1’$2'));
const rich=t=>t.split(/(`[^`]+`|\*\*[^*]+\*\*)/g).map(p=>p.length>2&&p[0]==='`'&&p.endsWith('`')?'<code>'+esc(p.slice(1,-1))+'</code>':p.length>4&&p.startsWith('**')&&p.endsWith('**')?'<strong>'+T(p.slice(2,-2))+'</strong>':T(p)).join('');
const TR=DATA.tracks,F=[],EX={};
TR.forEach(t=>t.chapters.forEach(c=>c.lessons.forEach(l=>{F.push({t,c,l});l.exercises.forEach(e=>EX[e.id]=e)})));
const NM={python:'Python',php:'PHP',javascript:'JavaScript',html:'HTML',css:'CSS',sql:'SQL'},LB={html:'HTML',css:'CSS',js:'JavaScript'};
const sf=(s,t)=>s.replace(new RegExp('</'+t,'gi'),'<\\/'+t);
const boot=id=>'(function(){var id='+JSON.stringify(id)+';function tx(a){try{return typeof a==="string"?a:JSON.stringify(a)}catch(e){return String(a)}}function p(k,a){try{parent.postMessage({channel:"atrium",id:id,kind:k,text:[].map.call(a,tx).join(" ")},"*")}catch(e){}}console.log=function(){p("log",arguments)};console.error=function(){p("error",arguments)};console.warn=function(){p("warn",arguments)};addEventListener("error",function(e){p("error",[e.message||"Erreur"])})})();';
function doc(h,c,j,id){const st=sf(c,'style'),rt='<script>'+boot(id)+'<\/script><script>'+sf(j,'script')+'<\/script>',d=h.trim();
if(/<!doctype html/i.test(d)||/<html[\s>]/i.test(d)){let o=/<\/head>/i.test(d)?d.replace(/<\/head>/i,()=>'<style>'+st+'</style></head>'):'<style>'+st+'</style>'+d;return /<\/body>/i.test(o)?o.replace(/<\/body>/i,()=>rt+'</body>'):o+rt}
return'<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}body{padding:16px;font-family:system-ui,sans-serif;color:#1c1915;background:#fbf8f2;line-height:1.5}'+st+'</style></head><body>'+d+rt+'</body></html>'}
function blk(b,i){switch(b.type){
case'p':return'<p>'+rich(b.text)+'</p>';
case'h':return'<h2>'+T(b.text)+'</h2>';
case'ul':case'ol':return'<'+b.type+'>'+b.items.map(x=>'<li>'+rich(x)+'</li>').join('')+'</'+b.type+'>';
case'table':return'<div>'+(b.caption?'<p class=mu>'+T(b.caption)+'</p>':'')+'<div class=tb><table><thead><tr>'+b.headers.map(h=>'<th>'+T(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+T(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
case'code':return'<figure class=cd><figcaption><span>'+esc(b.caption||b.lang)+'</span><button data-a=copy>Copier</button></figcaption><pre><code>'+esc(b.code)+'</code></pre></figure>';
case'note':case'caution':return'<p class=nt><strong>'+(b.type==='caution'?'Attention. ':'À retenir. ')+'</strong>'+rich(b.text)+'</p>';
default:return'<figure class=dm><figcaption>'+T(b.caption||'Aperçu')+'</figcaption><iframe title="Aperçu de l’exemple" sandbox="allow-scripts" srcdoc="'+esc(doc(b.html,b.css||'',b.js||'','d'+i))+'"></iframe></figure>'}}
function pg(files,st){const id=++fid,f=files[0]||'html';
return'<div class=pg data-id="'+id+'" data-f="'+f+'"><div class=tabs>'+files.map(x=>'<button data-f="'+x+'" class="'+(x===f?'on':'')+'">'+LB[x]+'</button>').join('')+'<button data-f=p class=tp>Aperçu</button></div><div class=bd><div>'+['html','css','js'].map(x=>'<textarea class="ta e-'+x+'" aria-label="'+LB[x]+'" spellcheck=false autocapitalize=off autocorrect=off>\n'+esc(st[x]||'')+'</textarea>').join('')+'</div><div class=pvw><iframe class=pv title="Aperçu de la page" sandbox="allow-scripts"></iframe>'+(files.includes('js')?'<div class=cs id="c'+id+'"></div>':'')+'</div></div></div>'}
function run(g){const v=k=>g.querySelector('.e-'+k).value,c=g.querySelector('.cs');if(c)c.innerHTML='';g.querySelector('iframe').srcdoc=doc(v('html'),v('css'),v('js'),g.dataset.id)}
const grid=(c,r)=>c.length?'<div class=tb><table><thead><tr>'+c.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+(r.length?r.map(w=>'<tr>'+w.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+c.length+'" class=mu>Aucune ligne.</td></tr>')+'</tbody></table></div>':'<p class=mu>Aucune colonne.</p>';
const sol=e=>'<details><summary>Voir la solution</summary><pre>'+esc(e.solution)+'</pre></details>';
const area=s=>'<textarea class=ta aria-label="Code" spellcheck=false autocapitalize=off autocorrect=off>\n'+esc(s)+'</textarea>';
const ty={
quiz:e=>'<fieldset><legend>'+rich(e.prompt)+'</legend>'+e.choices.map((c,i)=>'<button class=q data-q="'+i+'">'+T(c)+'</button>').join('')+'<p class="mu ex-out"></p></fieldset>',
web:e=>'<p>'+rich(e.prompt)+'</p>'+(e.hint?'<p class=mu>Indice : '+rich(e.hint)+'</p>':'')+pg(e.files,e.starter)+'<div class=bar><button class=btn data-a=sol>Voir la solution</button><button class="btn pri" data-a=done>'+(PR.exercises[e.id]?'Exercice fait':'Marquer comme fait')+'</button></div>',
write:e=>'<p>'+rich(e.prompt)+'</p><p class=mu>'+NM[e.lang]+' ne s’exécute pas dans la page. Écris le code, compare-le à la sortie attendue, puis à la solution.</p>'+area(e.starter)+(e.expected?'<p class=mu>Sortie attendue</p><pre class=pl>'+esc(e.expected)+'</pre>':'')+'<div class=bar><button class="btn pri" data-a=chkw>Vérifier la forme</button></div><p class=ex-out></p>'+sol(e),
sql:e=>'<p>'+rich(e.prompt)+'</p><p class=mu>'+T(e.goal)+'</p>'+e.seeds.map(s=>'<p class=k>'+esc(s.name)+'</p>'+grid(s.columns,s.rows)).join('')+area(e.starter)+'<div class=bar><button class="btn pri" data-a=sql>Exécuter</button></div><div class=ex-out></div>'+sol(e)};
const ex=(e,i)=>'<article class=ex data-ex="'+e.id+'"><p class=k>Exercice '+(i+1)+'</p>'+ty[e.type](e)+'</article>';
const row=l=>'<a class=rw href="#/lecon/'+l.id+'"><span class=ck>'+(PR.lessons[l.id]?'✓':'')+'</span><span>'+T(l.title)+' <small class=mu>· '+l.minutes+' min</small></span></a>';
const nav=()=>'<header class=nv><a class=lg href="#/">Atrium</a><nav><a href="#/atelier">Atelier</a></nav></header>';
const nf=()=>nav()+'<main class=w><h1>Cette page n’existe pas.</h1><a class=btn href="#/">Retour au parcours</a></main>';
function home(){const rd=F.filter(r=>PR.lessons[r.l.id]).length,last=F.find(r=>r.l.id===PR.last);
return nav()+'<main class=w><p class=k>Débutant absolu → autonomie</p><h1>Apprendre à développer, page après page.</h1><p class="lead mu">HTML, CSS, JavaScript, Python, PHP et SQL. Des leçons, des exercices, et un atelier pour voir ce que le code donne à l’écran. Pas de points, pas de série, pas de récompense.</p><div class=bar><a class="btn pri" href="#/lecon/'+(last||F[0]).l.id+'">'+(last?'Reprendre : '+T(last.l.title):'Commencer par le début')+'</a><a class=btn href="#/atelier">Ouvrir l’atelier</a></div><p class="mu sm">'+TR.length+' parties · '+F.length+' leçons'+(rd?' · '+rd+' lues':'')+'</p><input id=sq type=search placeholder="Chercher une leçon" aria-label="Chercher une leçon"><div id=lst></div></main>'}
function lst(){const o=$('#lst');if(!o)return;const q=$('#sq').value.trim().toLowerCase();
if(q){const m=F.filter(r=>(r.l.title+' '+r.l.summary).toLowerCase().includes(q));o.innerHTML=m.length?m.map(r=>row(r.l)).join(''):'<p class=mu>Aucune leçon ne porte ces mots.</p>';return}
o.innerHTML=TR.map(t=>{const ls=F.filter(r=>r.t.id===t.id),rd=ls.filter(r=>PR.lessons[r.l.id]).length;return'<a class=tc href="#/parcours/'+t.id+'"><span class=k>'+T(t.kicker)+'</span><b>'+T(t.title)+'</b><span class=mu>'+T(t.summary)+'</span><span class="mu sm">'+ls.length+' leçons'+(rd?' · '+rd+' lues':'')+'</span></a>'}).join('')}
function track(id){const t=TR.find(x=>x.id===id);if(!t)return nf();return nav()+'<main class=w><p class=k>'+T(t.kicker)+'</p><h1>'+T(t.title)+'</h1><p class="lead mu">'+T(t.summary)+'</p>'+t.chapters.map(c=>'<h2>'+T(c.title)+'</h2>'+c.lessons.map(row).join('')).join('')+'</main>'}
function lesson(id){const i=F.findIndex(r=>r.l.id===id);if(i<0)return nf();const r=F[i],l=r.l;cur=id;PR.last=id;save();
return nav()+'<main class=w><p class="mu sm"><a href="#/parcours/'+r.t.id+'">'+T(r.t.title)+'</a> · '+T(r.c.title)+' · '+l.minutes+' min</p><h1>'+T(l.title)+'</h1><p class="lead mu">'+T(l.summary)+'</p><div class=bl>'+l.blocks.map(blk).join('')+'</div>'+(l.exercises.length?'<section class=exs><h2>Exercices</h2>'+l.exercises.map(ex).join('')+'</section>':'')+'<div class="bar foot"><button class=btn data-a=read>'+(PR.lessons[id]?'✓ Lue':'Marquer comme lue')+'</button>'+(i?'<a class=btn href="#/lecon/'+F[i-1].l.id+'">Précédent</a>':'')+(i<F.length-1?'<a class="btn pri" href="#/lecon/'+F[i+1].l.id+'">'+T(F[i+1].l.title)+'</a>':'<a class=btn href="#/">Fin du parcours</a>')+'</div></main>'}
function atelier(){const p=DATA.presets;return nav()+'<main class="w big"><h1>Atelier</h1><div class=bar>'+p.map((x,i)=>'<button class="btn'+(i?'':' pri')+'" data-p="'+i+'">'+T(x.title)+'</button>').join('')+'</div><div id=slot>'+pg(['html','css','js'],p[0])+'</div></main>'}
function route(){const[a,b]=location.hash.replace(/^#\/?/,'').split('/');
A.innerHTML=a==='lecon'?lesson(b):a==='parcours'?track(b):a==='atelier'?atelier():home();
document.querySelectorAll('.pg').forEach(run);lst();scrollTo(0,0)}
A.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,art=b.closest('.ex'),E=art&&EX[art.dataset.ex];
if(d.f){const g=b.closest('.pg');g.dataset.f=d.f;g.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));return}
if(d.p!==undefined){const s=$('#slot');s.innerHTML=pg(['html','css','js'],DATA.presets[+d.p]);run(s.firstChild);b.parentNode.querySelectorAll('.btn').forEach(x=>x.classList.toggle('pri',x===b));return}
if(d.q!==undefined){const i=+d.q,fs=b.closest('fieldset');fs.querySelectorAll('.q').forEach((x,j)=>{x.classList.toggle('ok',j===E.answer);x.classList.toggle('no',j===i&&j!==E.answer)});fs.querySelector('.ex-out').innerHTML=rich(E.explain);if(i===E.answer)mark(E.id,true);return}
const a=d.a;
if(a==='copy'){const p=navigator.clipboard&&navigator.clipboard.writeText(b.closest('figure').querySelector('pre').textContent);if(p)p.then(()=>{b.textContent='Copié';setTimeout(()=>b.textContent='Copier',1200)}).catch(()=>{})}
else if(a==='read'){PR.lessons[cur]=!PR.lessons[cur];save();b.textContent=PR.lessons[cur]?'✓ Lue':'Marquer comme lue'}
else if(a==='done'){const v=!PR.exercises[E.id];mark(E.id,v);b.textContent=v?'Exercice fait':'Marquer comme fait'}
else if(a==='sol'){const g=art.querySelector('.pg'),on=g.dataset.sol!=='1',t=document.createElement('div');t.innerHTML=pg(E.files,on?E.solution:E.starter);const n=t.firstChild;n.dataset.sol=on?'1':'';g.replaceWith(n);run(n);b.textContent=on?'Revenir à mon énoncé':'Voir la solution'}
else if(a==='chkw'){const c=art.querySelector('.ta').value,m=(E.mustInclude||[]).filter(x=>!c.includes(x)),o=art.querySelector('.ex-out');if(m.length)o.textContent='Il manque encore : '+m.join(', ')+'.';else{mark(E.id,true);o.textContent='Les éléments demandés sont là. Ce n’est pas une exécution : relis la sortie attendue et, si besoin, la solution.'}}
else if(a==='sql'){const r=SQL.runSql(art.querySelector('.ta').value,E.seeds),s=SQL.runSql(E.solution,E.seeds),o=art.querySelector('.ex-out');
if(!r.ok){o.innerHTML='<p>'+esc(r.error)+'</p>';return}
const ok=s.ok&&SQL.sameOutcome(r,s,/\border\s+by\b/i.test(E.solution));if(ok)mark(E.id,true);
o.innerHTML='<p class=mu>'+esc(r.message)+'</p>'+grid(r.columns,r.rows)+'<p>'+(ok?'Le résultat correspond à celui attendu.':'La requête a tourné, mais le résultat n’est pas celui attendu.')+'</p>'}};
A.addEventListener('input',e=>{if(e.target.id==='sq')return lst();const g=e.target.closest('.pg');if(g){clearTimeout(g.tm);g.tm=setTimeout(()=>run(g),160)}});
A.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Tab'&&t.classList.contains('ta')){e.preventDefault();t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}});
addEventListener('message',e=>{const d=e.data,c=d&&d.channel==='atrium'&&document.getElementById('c'+d.id);if(c&&typeof d.text==='string'){c.insertAdjacentHTML('beforeend','<p>'+(d.kind==='error'?'Erreur : ':'')+esc(d.text)+'</p>');while(c.children.length>40)c.firstChild.remove()}});
addEventListener('hashchange',route);route();
</script>
</body>
</html>
