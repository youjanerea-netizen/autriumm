vres.json\", \"utf8\");","mustInclude":["node:fs/promises","readFile","utf8"]}]},{"id":"node-http","title":"Un serveur HTTP minimal","summary":"createServer, un statut, un corps. Les frameworks viendront après.","minutes":12,"blocks":[{"type":"p","text":"Le module `node:http` suffit pour voir ce qu'est un serveur. `createServer` reçoit une fonction appelée à chaque requête. Tu lis `req.method` et `req.url`. Tu réponds avec `res.writeHead(statut, en-têtes)` puis `res.end(corps)`. `listen(3000)` ouvre le port. Tant que le processus tourne, le port répond. `Ctrl+C` arrête."},{"type":"p","text":"Express, Hono, Fastify ajoutent le routage, les paramètres, le JSON parsé. Ils ne changent pas HTTP. Si tu sais lire une méthode et poser un statut, tu sais ce que le framework fait à ta place. Commence sans, une après-midi, pour que le framework ne soit pas une boîte noire."},{"type":"code","lang":"javascript","code":"import http from \"node:http\";\n\nconst serveur = http.createServer((req, res) => {\n  res.writeHead(200, { \"Content-Type\": \"application/json; charset=utf-8\" });\n  res.end(JSON.stringify({ ok: true }));\n});\n\nserveur.listen(3000);","caption":"Toute URL reçoit la même réponse. Le routage serait un if sur req.url."},{"type":"note","text":"Le Content-Type avec charset évite le mojibake vu dans les fondations. Un JSON sans ce détail s'affiche encore, jusqu'au jour de l'accent."}],"exercises":[{"type":"quiz","id":"node-http-q","prompt":"Quel appel envoie le corps et termine la réponse ?","choices":["res.listen","res.end","req.url","console.log"],"answer":1,"explain":"writeHead pose le statut et les en-têtes. end envoie le corps et clôt la réponse."},{"type":"write","id":"node-http-w","prompt":"Écris l'appel writeHead pour un statut 201 et un JSON en utf-8, comme dans la leçon mais avec 201.","lang":"javascript","starter":"","solution":"res.writeHead(201, { \"Content-Type\": \"application/json; charset=utf-8\" });","mustInclude":["writeHead","201"]}]},{"id":"node-env","title":"Configuration et secrets","summary":"Le port peut avoir un défaut. Une clé, non. Le .env ne se commit pas.","minutes":10,"blocks":[{"type":"p","text":"`process.env` est un dictionnaire de textes fourni par l'environnement au moment du lancement. `const port = Number(process.env.PORT ?? 3000)` lit le port, avec un défaut raisonnable. Une clé d'API n'a pas de défaut dans le code. Si elle manque, le programme s'arrête avec un message clair, plutôt que d'appeler un service avec `undefined`."},{"type":"p","text":"Un fichier `.env` est une façon commode de poser ces variables en local. Il est dans `.gitignore`. On commit un `.env.example` sans valeurs sensibles, pour que la personne suivante sache quels noms existent. Le secret réel vit dans l'environnement du serveur, ou dans un gestionnaire de secrets. Pas dans git. Un secret commité reste dans l'historique : le retirer au commit suivant ne suffit pas, il faut le **révoquer**."},{"type":"code","lang":"javascript","code":"const port = Number(process.env.PORT ?? 3000);\nconst cle = process.env.CLE_API;\nif (!cle) {\n  console.error(\"CLE_API manquante\");\n  process.exit(1);\n}","caption":"Défaut pour le port. Arrêt net pour le secret absent."},{"type":"caution","text":"Ne mets pas un mot de passe de base dans le JavaScript, même « temporairement ». Le temporaire se retrouve dans un commit."}],"exercises":[{"type":"quiz","id":"node-env-q","prompt":"Où ranger le mot de passe de la base ?","choices":["Dans le dépôt, pour l'équipe","Dans une variable d'environnement, hors du dépôt","Dans le JavaScript du navigateur","Dans l'URL du README"],"answer":1,"explain":"Le dépôt se copie, se fork, se fuit. La variable d'environnement reste sur la machine qui a le droit de la voir."},{"type":"write","id":"node-env-w","prompt":"Écris la lecture de process.env.PORT avec un défaut 3000 via ??.","lang":"javascript","starter":"","solution":"const port = Number(process.env.PORT ?? 3000);","mustInclude":["process.env.PORT","3000"]}]}]}]},"api":{"id":"api","title":"API et JSON","kicker":"Le web","summary":"Échanger des données : JSON, HTTP, REST, et fetch sans se perdre.","chapters":[{"id":"api-1","title":"Le contrat","lessons":[{"id":"api-quoi","title":"Une API est un contrat","summary":"Des opérations nommées, des formes convenues. Pas une boîte magique.","minutes":9,"blocks":[{"type":"p","text":"Une **API** est un contrat entre deux programmes. L'un propose des opérations, l'autre les appelle sans connaître l'intérieur. Sur le web, ce contrat passe presque toujours par **HTTP** : une URL, une méthode, parfois un corps, et une forme de réponse. « L'API des livres » veut dire : voici comment demander la liste, voici comment en ajouter un, voici à quoi ressemble un livre dans la réponse, voici les erreurs possibles."},{"type":"p","text":"Si le contrat change sans prévenir — un champ `titre` renommé `title` — les clients cassent. On versionne pour ça : `/v1/livres` peut rester stable pendant que `/v2/livres` évolue. Documenter, c'est écrire le contrat là où l'autre programmeur (souvent toi, dans trois mois) le retrouve. Une API sans exemple de requête et de réponse n'est pas documentée."},{"type":"code","lang":"text","code":"GET /v1/livres        → 200 et une liste\nGET /v1/livres/4      → 200 et un livre, ou 404\nPOST /v1/livres       → 201 et le livre créé","caption":"Trois lignes de contrat. Le reste est du détail."},{"type":"ul","items":["Le client dépend du contrat, pas du langage du serveur.","Un exemple vaut mieux qu'un adjectif (« simple », « puissant »).","Une erreur fait partie du contrat : son statut, et la forme de son message."]},{"type":"note","text":"Tu consommeras des API avant d'en écrire. Lis le contrat jusqu'au bout, y compris la page des erreurs."}],"exercises":[{"type":"quiz","id":"api-quoi-q","prompt":"Pourquoi préfixer /v1 ?","choices":["Pour chiffrer","Pour pouvoir changer le contrat sans casser les anciens clients","Pour remplacer HTTPS","Parce que JSON l'exige"],"answer":1,"explain":"La version fige une forme. Les nouveaux clients peuvent suivre /v2, les anciens restent sur /v1."},{"type":"write","id":"api-quoi-w","prompt":"Écris trois lignes de contrat pour des livres : liste, détail, création. Utilise GET et POST.","lang":"text","starter":"","solution":"GET /v1/livres\nGET /v1/livres/4\nPOST /v1/livres","mustInclude":["GET /v1/livres","POST /v1/livres"]}]},{"id":"api-json","title":"Lire et écrire JSON","summary":"parse et stringify. Le JSON est plus strict que le JavaScript.","minutes":10,"blocks":[{"type":"p","text":"`JSON.stringify` transforme une valeur JavaScript en texte JSON. `JSON.parse` fait l'inverse. Entre les deux, ce texte peut voyager : corps d'une requête, fichier, réponse. Ce n'est pas le même objet en mémoire. C'est une copie décrite. Les fonctions, les `undefined` dans un objet, les symboles ne survivent pas au voyage. Un date devient souvent une chaîne, et tu dois la relire."},{"type":"table","headers":["JavaScript","JSON"],"rows":[["Clés sans guillemets","Clés entre guillemets doubles"],["Guillemets simples possibles","Guillemets doubles seulement"],["Virgule finale tolérée par le moteur","Virgule finale interdite"],["undefined","Disparaît dans un objet, devient null dans un tableau"]]},{"type":"code","lang":"javascript","code":"const livre = { titre: \"Beloved\", prix: 16 };\nconst texte = JSON.stringify(livre);\nconst copie = JSON.parse(texte);\nconsole.log(copie.titre);","caption":"Texte au milieu. copie n'est pas livre : c'est une nouvelle valeur."},{"type":"caution","text":"JSON.parse lève une exception si le texte est invalide. Autour d'une donnée qui vient d'ailleurs, un try/catch n'est pas optionnel."},{"type":"note","text":"Affiche le texte quand tu débogues, pas seulement l'objet. La virgule en trop se voit dans le texte."}],"exercises":[{"type":"quiz","id":"api-json-q","prompt":"Que fait JSON.parse sur un texte invalide ?","choices":["Il renvoie null","Il lève une erreur","Il ignore la dernière ligne","Il convertit en CSV"],"answer":1,"explain":"Le parse échoue. Sans try/catch, l'erreur remonte et peut arrêter le script."},{"type":"write","id":"api-json-w","prompt":"Pars d'un objet livre {titre: \"Beloved\", prix: 16} et produis le texte avec JSON.stringify.","lang":"javascript","starter":"","solution":"const livre = { titre: \"Beloved\", prix: 16 };\nconst texte = JSON.stringify(livre);\nconsole.log(texte);","mustInclude":["JSON.stringify","titre","Beloved"]}]},{"id":"api-rest","title":"REST : ressources et verbes","summary":"Des noms dans l'URL, des verbes HTTP pour l'action.","minutes":11,"blocks":[{"type":"p","text":"Une API **REST** organise les URL autour de **ressources**, des noms : `/livres`, `/livres/4`. L'action est la méthode HTTP, pas un verbe collé dans le chemin. `GET /livres` lit la liste. `POST /livres` crée. `GET /livres/4` lit un livre. `PATCH /livres/4` ou `PUT /livres/4` modifie. `DELETE /livres/4` supprime. `/getLivres` et `/supprimerLivre` mélangent l'action et le nom : on les évite."},{"type":"p","text":"`GET` est sûr : le rappeler ne devrait rien changer. On peut le répéter, le mettre en cache, le précharger. `POST` n'a pas cette promesse. `PUT` remplace toute la ressource ; `PATCH` envoie seulement ce qui change. Tu choisiras l'un des deux dans un projet et tu t'y tiendras. Les statuts suivent : 200 pour une lecture, 201 pour une création, 204 quand ça a marché et qu'il n'y a pas de corps, 400 pour une demande invalide, 404 si l'id n'existe pas, 409 pour un conflit."},{"type":"code","lang":"text","code":"GET    /livres\nPOST   /livres\nGET    /livres/4\nPATCH  /livres/4\nDELETE /livres/4","caption":"Cinq opérations. Les noms ne changent pas, les méthodes oui."},{"type":"caution","text":"Un GET qui supprime « parce que c'est plus simple à tester dans le navigateur » sera préchargé, mis en cache, rejoué. La suppression partira toute seule."},{"type":"note","text":"Pluriel pour la collection (`/livres`), id pour un élément (`/livres/4`). Tiens cette régularité."}],"exercises":[{"type":"quiz","id":"api-rest-q","prompt":"Quelle requête lit un livre sans le modifier ?","choices":["POST /livres/4","GET /livres/4","DELETE /livres/4","GET /supprimer/4"],"answer":1,"explain":"GET lit. L'identifiant est dans le chemin. Pas de verbe supprimer dans l'URL."},{"type":"write","id":"api-rest-w","prompt":"Écris quatre lignes : GET liste, POST création, GET un livre, DELETE un livre. Ressource /livres.","lang":"text","starter":"","solution":"GET /livres\nPOST /livres\nGET /livres/4\nDELETE /livres/4","mustInclude":["GET /livres","POST /livres","DELETE /livres/4"]}]},{"id":"api-fetch","title":"Appeler avec fetch","summary":"fetch ne rejette pas sur un 404. Tu testes res.ok.","minutes":12,"blocks":[{"type":"p","text":"`fetch` envoie une requête et renvoie une promesse de réponse. `await` attend cette réponse dans une fonction `async`. Le piège : la promesse **échoue** si le réseau casse, pas si le serveur répond 404 ou 500. Une réponse d'erreur est quand même une réponse. Tu testes `res.ok` (statuts 200 à 299) avant de lire le corps."},{"type":"p","text":"Pour un POST JSON : méthode, en-tête `Content-Type: application/json`, et `body: JSON.stringify(...)`. Oublier l'en-tête, c'est envoyer un texte que le serveur ne reconnaît pas comme JSON. Oublier `stringify`, c'est envoyer `[object Object]`."},{"type":"code","lang":"javascript","code":"async function chargerLivres() {\n  const res = await fetch(\"/v1/livres\");\n  if (!res.ok) throw new Error(\"HTTP \" + res.status);\n  return res.json();\n}\n\nasync function creer(livre) {\n  const res = await fetch(\"/v1/livres\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(livre),\n  });\n  if (!res.ok) throw new Error(\"HTTP \" + res.status);\n  return res.json();\n}","caption":"Lire, puis créer. Les deux vérifient le statut avant json()."},{"type":"caution","text":"await fetch(...) sans tester res.ok, puis res.json() sur une page d'erreur HTML : le parse échoue, et le vrai statut est perdu."},{"type":"note","text":"Dans cette application, l'atelier n'appelle pas Internet. Le schéma reste celui que tu lanceras sur ta machine."}],"exercises":[{"type":"quiz","id":"api-fetch-q","prompt":"fetch reçoit un 404. Que se passe-t-il ?","choices":["La promesse est rejetée automatiquement","La promesse réussit, res.ok vaut false","Le navigateur ferme l'onglet","JSON.parse est appelé tout seul"],"answer":1,"explain":"404 est une réponse HTTP. Il faut regarder res.ok ou res.status. Le rejet est réservé à la panne réseau."},{"type":"write","id":"api-fetch-w","prompt":"Écris une fonction async qui fetch /v1/livres, throw si !res.ok, et return res.json().","lang":"javascript","starter":"","solution":"async function chargerLivres() {\n  const res = await fetch(\"/v1/livres\");\n  if (!res.ok) throw new Error(\"HTTP \" + res.status);\n  return res.json();\n}","mustInclude":["await fetch","!res.ok","res.json()"]}]},{"id":"api-etats","title":"Chargement, erreur, vide","summary":"Trois états visibles. Une liste vide n'est pas une erreur.","minutes":10,"blocks":[{"type":"p","text":"Une interface qui attend des données a trois états, et l'utilisateur doit les distinguer. **Chargement** : la requête est partie, rien n'est arrivé. **Erreur** : le réseau ou le serveur a refusé, on dit quoi faire (réessayer), pas la pile d'appels. **Données** : on affiche. Une liste **vide** est un succès : il n'y a pas encore de livres. Montrer « erreur » dans ce cas est un mensonge. Montrer une page blanche est un oubli."},{"type":"p","text":"Autour de l'appel : `try/catch`. Le `throw` sur `!res.ok` atterrit dans le `catch`. Tu ranges un message court dans une variable d'état, et le rendu choisit. Pas de `console.log` comme seule gestion : la console n'est pas l'interface."},{"type":"code","lang":"javascript","code":"let etat = \"chargement\";\nlet livres = [];\nlet message = \"\";\ntry {\n  livres = await chargerLivres();\n  etat = \"pret\";\n} catch (erreur) {\n  etat = \"erreur\";\n  message = \"Impossible de charger les livres.\";\n}","caption":"Deux issues nommées. Le message pour l'humain ne contient pas l'objet erreur brut."},{"type":"ul","items":["Chargement : un texte « Chargement… », pas un écran gelé sans explication.","Erreur : une phrase, et un moyen de réessayer.","Vide : « Aucun livre pour l'instant. », qui n'est pas rouge."]},{"type":"note","text":"Ces trois états reviendront avec React. Le nom change (`useState`), pas le problème."}],"exercises":[{"type":"quiz","id":"api-etats-q","prompt":"L'API répond 200 et une liste []. Que montres-tu ?","choices":["Une erreur réseau","Un état vide, réussi","Un 404 inventé","Rien, c'est un bug obligatoire"],"answer":1,"explain":"La requête a marché. Il n'y a juste aucun élément. Le message le dit calmement."},{"type":"write","id":"api-etats-w","prompt":"Écris un try/catch autour de await chargerLivres(), avec un message d'erreur lisible dans le catch.","lang":"javascript","starter":"","solution":"try {\n  const livres = await chargerLivres();\n  console.log(livres);\n} catch (erreur) {\n  console.error(\"Impossible de charger les livres.\");\n}","mustInclude":["try","await chargerLivres","catch"]}]},{"id":"api-concevoir","title":"Concevoir une petite API","summary":"Champs, routes, et ce qu'on ne renvoie jamais.","minutes":11,"blocks":[{"type":"h","text":"La ressource"},{"type":"p","text":"Un livre a un `id` choisi par le serveur, un `titre`, un `auteur`, un `prix`. L'id ne vient pas du client au moment de la création : deux clients enverraient le même. La réponse de `GET /livres/4` renvoie ces champs, pas le mot de passe de la personne qui a ajouté la fiche, pas la chaîne de connexion, pas un jeton interne."},{"type":"p","text":"La liste peut être longue. On prévoit tôt un plafond : `GET /livres?limit=20`. Pas besoin d'un système de pages sophistiqué le premier jour. Il faut que la route ne puisse pas renvoyer cent mille lignes parce que personne n'a demandé « tous »."},{"type":"code","lang":"json","code":"{\n  \"id\": 4,\n  \"titre\": \"Beloved\",\n  \"auteur\": \"Morrison\",\n  \"prix\": 16\n}","caption":"GET /livres/4. Juste le livre."},{"type":"ul","items":["Création : le client envoie titre, auteur, prix. Le serveur répond 201 et le livre avec son id.","Titre manquant : 400, avec un message qui dit quel champ.","Id inconnu : 404.","Prix négatif : 400. La règle est côté serveur."]},{"type":"note","text":"Écris ce contrat sur une demi-page avant de choisir Express, Hono ou autre. L'outil ne répare pas une ressource floue."}],"exercises":[{"type":"quiz","id":"api-concevoir-q","prompt":"Qui choisit l'id d'un livre créé ?","choices":["Le client, librement","Le serveur","Le CSS","Le DNS"],"answer":1,"explain":"Le serveur garantit l'unicité. Le client envoie les champs métier."},{"type":"write","id":"api-concevoir-w","prompt":"Écris le JSON de GET /livres/4 pour Beloved, Morrison, prix 16, id 4. Inclue le champ titre.","lang":"json","starter":"","solution":"{\n  \"id\": 4,\n  \"titre\": \"Beloved\",\n  \"auteur\": \"Morrison\",\n  \"prix\": 16\n}","mustInclude":["\"titre\"","Beloved","\"id\""]}]},{"id":"api-auth","title":"Jetons, CORS, secrets","summary":"Ce qui prouve une session ne se met pas dans l'URL. Ce qui est secret ne va pas dans le navigateur.","minutes":12,"blocks":[{"type":"p","text":"Un **jeton** (token) prouve qu'une requête est autorisée. Il voyage dans l'en-tête `Authorization: Bearer …`, pas dans l'URL : les URL finissent dans des journaux, des historiques, des référents. Le jeton est un secret de session. Tu ne le commites pas, tu ne le mets pas dans une capture d'écran."},{"type":"p","text":"**CORS** est une règle du **navigateur**. Une page servie par `site-a` qui appelle `site-b` est bloquée, sauf si `site-b` répond qu'il autorise `site-a`. Ce n'est pas une protection du serveur contre tout Internet : `curl`, un autre serveur, un script hors navigateur ne jouent pas cette règle. CORS ne remplace pas une authentification. Il empêche le JavaScript d'un site étranger de lire une réponse en s'appuyant sur le navigateur de l'utilisateur."},{"type":"h","text":"Où vivent les secrets"},{"type":"p","text":"Une clé qui donne un pouvoir (écrire en base, payer, lire tous les utilisateurs) reste sur le serveur, dans une variable d'environnement. Le JavaScript envoyé au navigateur est public : toute personne peut le lire. Une clé dite « publique » ou « publishable » est conçue pour être vue, et elle est bridée. Si la documentation dit secret, elle ne va pas dans le front."},{"type":"code","lang":"http","code":"GET /v1/livres HTTP/1.1\nAuthorization: Bearer eyJhbGciOi...\n\nHTTP/1.1 401 Unauthorized","caption":"Pas de jeton, ou un jeton refusé : 401. Pas 200 avec une liste vide."},{"type":"caution","text":"Contourner CORS avec un proxy « ouvert à tous » republie ton API au monde. Le proxy doit être le tien, et il vérifie le droit."}],"exercises":[{"type":"quiz","id":"api-auth-q","prompt":"Où ne faut-il pas mettre une clé secrète d'API ?","choices":["Dans une variable d'environnement côté serveur","Dans le JavaScript de la page","Dans un gestionnaire de secrets","Hors du dépôt git"],"answer":1,"explain":"Le JavaScript de la page est téléchargé par le visiteur. Un secret dedans n'en est plus un."},{"type":"write","id":"api-auth-w","prompt":"Écris l'en-tête Authorization pour un jeton ABC123, sur une seule ligne.","lang":"text","starter":"","solution":"Authorization: Bearer ABC123","mustInclude":["Authorization: Bearer ABC123"]}]}]}]},"algo":{"id":"algo","title":"Algorithmique","kicker":"Penser","summary":"Décrire une solution, estimer son coût, et connaître les structures qui reviennent partout.","chapters":[{"id":"algo-base","title":"Raisonner","lessons":[{"id":"algo-quoi","title":"Un algorithme, avant le code","summary":"Des entrées, des étapes, une sortie. Le langage vient après.","minutes":10,"blocks":[{"type":"p","text":"Un **algorithme** est une suite d'étapes qui, pour une entrée, produit une sortie. Il est fini, précis, et tu peux le suivre sans deviner. « Faire une moyenne » n'est pas un algorithme. « Si la liste est vide, refuser. Sinon additionner chaque note, puis diviser par le nombre de notes » en est un. Le code est une écriture de cet algorithme dans un langage. L'algorithme, lui, peut tenir en français."},{"type":"p","text":"Avant d'écrire la fonction, prends deux exemples à la main. Notes `[12, 15, 9]` : somme 36, trois valeurs, moyenne 12. Liste vide : tu dois décider. Renvoyer 0 cache le problème. Signaler l'absence est plus honnête. Les cas limites (vide, une seule valeur, valeur négative) se choisissent avant, pas au milieu du bug."},{"type":"code","lang":"text","code":"entrée : une liste de notes\nsi la liste est vide :\n  échouer clairement\nsomme ← 0\npour chaque note :\n  somme ← somme + note\nsortie : somme / nombre de notes","caption":"La moyenne, en français précis."},{"type":"ul","items":["Nomme l'entrée et la sortie en une phrase.","Écris un exemple numérique, résultat inclus, calculé par toi.","Ensuite seulement, traduis en JavaScript, Python ou autre."]},{"type":"note","text":"Écrire les étapes en français est déjà programmer. Le langage ne fait qu'exiger une orthographe que la machine accepte."}],"exercises":[{"type":"quiz","id":"algo-quoi-q","prompt":"Pourquoi traiter la liste vide avant d'écrire la division ?","choices":["Parce que la division par zéro n'a pas de sens ici","Parce que les listes vides sont interdites par la loi","Parce que le processeur ne sait pas additionner","Parce que JSON interdit le zéro"],"answer":0,"explain":"Diviser par le nombre de notes quand il n'y en a aucune ne veut rien dire. On décide du comportement avant."},{"type":"write","id":"algo-quoi-w","prompt":"Écris en français les étapes pour trouver la plus grande note d'une liste non vide.","lang":"text","starter":"","solution":"entrée : liste non vide\nmax ← première note\npour chaque note :\n  si note > max : max ← note\nsortie : max","mustInclude":["max","note"]}]},{"id":"algo-complexite","title":"Compter les opérations","summary":"Pas une médaille : un ordre de grandeur. Juste d'abord, rapide ensuite.","minutes":12,"blocks":[{"type":"p","text":"La **complexité** estime comment le nombre d'opérations grandit quand l'entrée grandit. On écrit O(1), O(n), O(n²). Le n, c'est la taille : 10 prénoms, puis 10 000. On ignore les détails (une addition de plus) et on garde la forme. Ce n'est pas le temps en millisecondes sur ta machine. C'est la forme de la croissance."},{"type":"table","headers":["Notation","Idée","Exemple"],"rows":[["O(1)","Un coût fixe, même si la liste s'allonge","Lire le premier élément"],["O(n)","Proportionnel à la taille","Chercher un nom en parcourant la liste"],["O(n²)","Chaque élément comparé à beaucoup d'autres","Comparer toutes les paires"]]},{"type":"p","text":"Une boucle dans une boucle sur la même liste est le signe habituel d'un O(n²). Pour 10 éléments, 100 comparaisons, tu ne vois rien. Pour 10 000, cent millions : l'écran fige. Avant d'optimiser, vérifie que le résultat est **juste** sur un petit exemple. Un algorithme rapide et faux reste faux."},{"type":"code","lang":"javascript","code":"function aDesDoublons(noms) {\n  for (let i = 0; i < noms.length; i++) {\n    for (let j = i + 1; j < noms.length; j++) {\n      if (noms[i] === noms[j]) return true;\n    }\n  }\n  return false;\n}","caption":"Deux boucles : chaque paire. Correct, et quadratique."},{"type":"caution","text":"Une complexité meilleure n'excuse pas un résultat faux. On mesure la justesse d'abord, le coût ensuite, et seulement si le coût se voit."},{"type":"note","text":"Les langages ont déjà des structures pour éviter le O(n²) naïf : ensembles, tables de hachage. On y vient."}],"exercises":[{"type":"quiz","id":"algo-complexite-q","prompt":"Tu parcours une fois une liste de n titres. Quelle forme ?","choices":["O(1)","O(n)","O(n²)","O(nⁿ)"],"answer":1,"explain":"Une boucle qui visite chaque élément une fois grandit comme n."},{"type":"write","id":"algo-complexite-w","prompt":"Dans un commentaire, dis si une double boucle qui compare toutes les paires est O(n) ou O(n²), puis écris la double boucle vide en JS sur un tableau noms.","lang":"javascript","starter":"const noms = [\"Awa\", \"Malik\"];\n","solution":"// O(n²) : toutes les paires\nfor (let i = 0; i < noms.length; i++) {\n  for (let j = i + 1; j < noms.length; j++) {\n  }\n}","mustInclude":["O(n²)","for","noms.length"]}]},{"id":"algo-recherche","title":"Recherche linéaire et dichotomique","summary":"Tout regarder, ou couper en deux. La deuxième exige un tableau trié.","minutes":12,"blocks":[{"type":"p","text":"La recherche **linéaire** part du début et avance jusqu'à trouver la valeur, ou jusqu'au bout. Sur n éléments, le pire cas fait n comparaisons. Elle fonctionne sur une liste dans n'importe quel ordre. C'est le bon choix quand la liste est courte ou n'est pas triée."},{"type":"p","text":"La recherche **dichotomique** exige un tableau **trié**. On regarde l'élément du milieu. S'il est trop grand, la valeur ne peut être qu'à gauche. S'il est trop petit, qu'à droite. On jette la moitié à chaque étape. Chercher 15 dans `[3, 8, 12, 15, 20, 24]` : milieu 12, trop petit, on continue à droite `[15, 20, 24]`, milieu 20, trop grand, reste 15. Quelques comparaisons, même quand la liste est longue. En ordre de grandeur : logarithme de n."},{"type":"code","lang":"text","code":"trié : 3  8  12  15  20  24\ncherche 15\nmilieu 12 → trop petit → droite\nmilieu 20 → trop grand → gauche\nreste 15 → trouvé","caption":"On ne regarde pas tout. On jette une moitié."},{"type":"caution","text":"Sur un tableau non trié, couper en deux ne veut plus rien dire. L'algorithme répond n'importe quoi, sans erreur visible. Trie d'abord, ou cherche en linéaire."},{"type":"note","text":"En pratique tu appelleras souvent une fonction déjà écrite. Savoir laquelle suppose de savoir si tes données sont triées."}],"exercises":[{"type":"quiz","id":"algo-recherche-q","prompt":"Quelle condition est obligatoire pour une recherche dichotomique ?","choices":["Le tableau contient des chaînes","Le tableau est trié","Le tableau a une taille paire","Le langage est JavaScript"],"answer":1,"explain":"Couper en deux ne garde le bon côté que si l'ordre est garanti."},{"type":"write","id":"algo-recherche-w","prompt":"Pour le tableau trié [3, 8, 12, 15, 20, 24], écris les milieux successifs quand on cherche 8. Un nombre par ligne, dans l'ordre.","lang":"text","starter":"","solution":"12\n3\n8","hint":"Milieu de 6 éléments : index 2, valeur 12. À gauche il reste 3 et 8.","mustInclude":["12","8"]}]},{"id":"algo-tri","title":"Trier, sans magie","summary":"Le tri par sélection, pas à pas. En production, tu appelles le tri du langage.","minutes":12,"blocks":[{"type":"p","text":"Trier, c'est ranger pour que chaque élément soit inférieur ou égal au suivant. Le **tri par sélection** est lent et clair. Sur la partie encore en désordre, tu cherches le minimum, tu le échanges avec le premier de cette partie, et tu recommences plus loin. `[4, 1, 3]` : le minimum est 1, échange avec 4 → `[1, 4, 3]`. Puis minimum de `[4, 3]` est 3 → `[1, 3, 4]`."},{"type":"p","text":"Ce tri fait une double boucle : O(n²). Les tris utilisés vraiment (timsort derrière Python, le tri des moteurs JS) sont en n log n, et ils sont déjà écrits. Tu les appelles : `noms.sort()` en JavaScript, `sorted(noms)` en Python. Les réécrire est un exercice de compréhension, pas une étape d'un projet."},{"type":"code","lang":"javascript","code":"const notes = [4, 1, 3];\nnotes.sort((a, b) => a - b);\nconsole.log(notes);","caption":"Le tri du langage. Le comparateur (a, b) => a - b trie des nombres du plus petit au plus grand."},{"type":"caution","text":"En JavaScript, `sort()` sans comparateur trie comme du texte : 10 passe avant 2, parce que `\"10\"` < `\"2\"`. Pour des nombres, donne un comparateur."},{"type":"note","text":"Un tableau trié débloque la recherche dichotomique. Trier coûte. Chercher souvent dans une liste fixe peut rembourser ce coût."}],"exercises":[{"type":"quiz","id":"algo-tri-q","prompt":"Pourquoi sort() sans comparateur surprend sur des nombres ?","choices":["Il trie en les lisant comme du texte","Il ne trie que trois éléments","Il exige un tableau déjà trié","Il supprime les doublons"],"answer":0,"explain":"L'ordre lexicographique place \"10\" avant \"2\". Le comparateur numérique évite ça."},{"type":"write","id":"algo-tri-w","prompt":"Écris une fonction JS minDe(vals) qui retourne le plus petit nombre d'un tableau non vide, avec une boucle.","lang":"javascript","starter":"","solution":"function minDe(vals) {\n  let min = vals[0];\n  for (const v of vals) {\n    if (v < min) min = v;\n  }\n  return min;\n}","expected":"minDe([4, 1, 3]) === 1","mustInclude":["function minDe","for","return min"]}]}]},{"id":"algo-structures","title":"Structures","lessons":[{"id":"algo-recursivite","title":"Récursivité","summary":"Une fonction qui s'appelle elle-même, avec une porte de sortie.","minutes":11,"blocks":[{"type":"p","text":"Une fonction **récursive** s'appelle elle-même sur un problème plus petit, jusqu'à un **cas de base** qu'elle sait résoudre sans appel. Sommer `[12, 15, 9]` : c'est 12 plus la somme de `[15, 9]`. La somme d'une liste vide est 0. Sans ce 0, les appels ne s'arrêtent pas : la pile grandit jusqu'à l'erreur (stack overflow)."},{"type":"p","text":"Chaque appel attend le retour du suivant. La pile d'appels ressemble à une pile d'assiettes : le dernier appelé rend la main le premier. C'est la même idée que la pile, leçon suivante. La récursion est naturelle sur les arbres (un dossier contient des dossiers). Sur une simple liste, une boucle est souvent plus lisible et ne risque pas la limite de pile."},{"type":"code","lang":"javascript","code":"function somme(vals) {\n  if (vals.length === 0) return 0;\n  return vals[0] + somme(vals.slice(1));\n}","caption":"Cas de base : liste vide. Cas récursif : la tête plus le reste."},{"type":"caution","text":"Pas de cas de base, ou un cas qui ne rétrécit pas le problème : la fonction ne revient jamais. Teste d'abord le cas vide."},{"type":"note","text":"Si tu peux l'écrire avec une boucle sans te tordre, fais-le. Garde la récursion quand la donnée est elle-même récursive."}],"exercises":[{"type":"quiz","id":"algo-recursivite-q","prompt":"À quoi sert le cas de base ?","choices":["À accélérer le processeur","À arrêter les appels","À trier le tableau","À remplacer le return"],"answer":1,"explain":"Sans cas qui ne rappelle plus la fonction, la pile d'appels ne se vide pas."},{"type":"write","id":"algo-recursivite-w","prompt":"Écris la fonction somme ci-dessus, avec le cas de la liste vide.","lang":"javascript","starter":"","solution":"function somme(vals) {\n  if (vals.length === 0) return 0;\n  return vals[0] + somme(vals.slice(1));\n}","mustInclude":["vals.length === 0","return 0","somme("]}]},{"id":"algo-pile-file","title":"Piles et files","summary":"Dernier entré premier sorti, ou premier entré premier sorti.","minutes":11,"blocks":[{"type":"p","text":"Une **pile** est LIFO : last in, first out. Comme une pile d'assiettes, tu poses et tu reprends au sommet. Les appels de fonctions sont une pile. Ctrl+Z aussi : la dernière action s'annule la première. Opérations : empiler (`push`), dépiler (`pop`)."},{"type":"p","text":"Une **file** est FIFO : first in, first out. Comme une file d'attente. On entre par l'arrière, on sort par l'avant. Utile pour traiter des tâches dans l'ordre d'arrivée, et pour le parcours en largeur d'un graphe. Opérations : enfiler, défiler."},{"type":"code","lang":"javascript","code":"const pages = [];\npages.push(\"/accueil\");\npages.push(\"/livres\");\nconst retour = pages.pop();\nconsole.log(retour);","caption":"Une pile de pages. pop retire /livres, la dernière posée."},{"type":"ul","items":["En JavaScript, un tableau avec `push` et `pop` est une pile correcte.","Une file naïve avec `push` et `shift` marche, mais `shift` décale tout le tableau : coûteux si la file est longue.","L'idée compte plus que la classe nommée Stack. Sache quel bout tu modifies."]},{"type":"note","text":"Quand tu lis « pile d'appels » dans une erreur, c'est cette structure : le dernier appel est en haut du message."}],"exercises":[{"type":"quiz","id":"algo-pile-q","prompt":"On empile A, puis B, puis C. Que retire le premier pop ?","choices":["A","B","C","Les trois à la fois"],"answer":2,"explain":"LIFO : le dernier entré sort le premier. C était au sommet."},{"type":"write","id":"algo-pile-w","prompt":"Simule une pile : empile accueil puis livres, dépile une fois, et affiche ce qui reste au sommet avec un autre pop dans un console.log. Utilise push.","lang":"javascript","starter":"","solution":"const pages = [];\npages.push(\"accueil\");\npages.push(\"livres\");\npages.pop();\nconsole.log(pages.pop());","expected":"accueil","mustInclude":["push","pop","console.log"]}]},{"id":"algo-hash","title":"Tables de hachage","summary":"De la clé à la valeur, sans parcourir toute la liste. En moyenne.","minutes":11,"blocks":[{"type":"p","text":"Une **table de hachage** associe une clé à une valeur et retrouve la valeur sans parcourir toutes les entrées. En moyenne, c'est O(1) : un calcul sur la clé désigne un tiroir. Les dictionnaires Python, `Map` et les objets utilisés comme dictionnaires en JavaScript, `HashMap` en Java : même idée."},{"type":"p","text":"Deux clés différentes peuvent viser le même tiroir : une **collision**. La structure s'en arrange (une petite liste dans le tiroir), et l'accès reste excellent tant que la table n'est pas saturée. Tu n'écris pas le hachage toi-même au début. Tu choisis la structure quand tu cherches par clé, pas par position."},{"type":"code","lang":"javascript","code":"const prix = new Map();\nprix.set(\"Beloved\", 16);\nprix.set(\"Sula\", 14);\nconsole.log(prix.get(\"Beloved\"));\nconsole.log(prix.has(\"Jazz\"));","caption":"Clé : le titre. Valeur : le prix. has répond sans parcourir à la main."},{"type":"ul","items":["Un `Set` garde des valeurs uniques. En dessous, une table de hachage.","Les clés doivent être stables. Muter un objet utilisé comme clé casse la recherche.","Parcourir toutes les valeurs reste O(n). Seule la recherche par clé est O(1) en moyenne."]},{"type":"caution","text":"« En moyenne » n'est pas « toujours ». Une mauvaise fonction de hachage ou des clés ridicules dégradent. Avec les types du langage (String, nombres), tu es tranquille."}],"exercises":[{"type":"quiz","id":"algo-hash-q","prompt":"Quelle structure répond vite à « quel est le prix de ce titre ? »","choices":["Une liste qu'on parcourt","Une table clé → valeur","Une pile","Un booléen"],"answer":1,"explain":"La clé est le titre, la valeur est le prix. C'est le travail d'une table de hachage."},{"type":"write","id":"algo-hash-w","prompt":"Crée une Map, associe Awa à 15, et affiche cette note avec get.","lang":"javascript","starter":"","solution":"const notes = new Map();\nnotes.set(\"Awa\", 15);\nconsole.log(notes.get(\"Awa\"));","expected":"15","mustInclude":["new Map","set","get"]}]},{"id":"algo-arbres","title":"Arbres","summary":"Une racine, des enfants, pas de cycle. Le HTML est déjà un arbre.","minutes":11,"blocks":[{"type":"p","text":"Un **arbre** relie des nœuds sans boucle. Un nœud a zéro, un ou plusieurs **enfants**. Celui qui n'a pas de parent est la **racine**. Un nœud sans enfant est une **feuille**. Un **arbre binaire** limite chaque nœud à deux enfants. Les dossiers d'un disque forment un arbre. Le HTML aussi : `html` contient `body`, qui contient un `ul`, qui contient des `li`."},{"type":"p","text":"Parcourir, c'est visiter chaque nœud une fois. En **profondeur** : on descend chez un enfant avant de voir le frère (préfixe : le nœud avant ses enfants ; suffixe : après). En **largeur** : on finit tout un niveau avant le suivant, avec une file. Les sélecteurs CSS `article p` descendent dans l'arbre du document. Comprendre l'arbre, c'est comprendre pourquoi un style « plus bas » dans l'imbrication vise un élément précis."},{"type":"code","lang":"text","code":"html\n  body\n    h1\n    ul\n      li\n      li","caption":"Pas un dessin décoratif : la structure réelle d'une page."},{"type":"ul","items":["Un nœud n'a qu'un parent. Sinon ce n'est plus un arbre, c'est un graphe.","La profondeur est le nombre de liens depuis la racine.","On ne parle pas ici d'équilibrage AVL. L'idée suffit largement."]},{"type":"note","text":"Quand le DOM te surprend, dessine quatre niveaux. Le bug est souvent « je croyais que cet élément était enfant, il est frère »."}],"exercises":[{"type":"quiz","id":"algo-arbres-q","prompt":"Dans un arbre, que peut-on dire d'un nœud qui n'est pas la racine ?","choices":["Il a plusieurs parents","Il a exactement un parent","Il n'a pas d'enfant, jamais","Il est une feuille, toujours"],"answer":1,"explain":"Un seul parent. Zéro parent : c'est la racine. Les feuilles sont celles sans enfant, racine comprise si l'arbre n'a qu'un nœud."},{"type":"write","id":"algo-arbres-w","prompt":"Décris en texte l'arbre d'une page : html, puis body, puis un h1 et un p frères. Un nom par ligne, indenté par deux espaces pour les enfants.","lang":"text","starter":"","solution":"html\n  body\n    h1\n    p","mustInclude":["html","body","h1"]}]},{"id":"algo-graphes","title":"Graphes, le minimum","summary":"Des points reliés, avec ou sans sens. Le plus court chemin en nombre de sauts.","minutes":12,"blocks":[{"type":"p","text":"Un **graphe** est un ensemble de **sommets** reliés par des **arêtes**. Une carte de trains : les villes sont des sommets, les lignes sont des arêtes. Si le lien a un sens (un suivi, une dépendance), le graphe est **orienté**. Si l'arête a un coût (des minutes, des euros), elle est **pondérée**. Un arbre est un graphe sans cycle. Un graphe, lui, peut boucler : Lyon–Paris–Lyon."},{"type":"p","text":"Le parcours en **largeur** (BFS) part d'un sommet et visite d'abord les voisins, puis les voisins des voisins, grâce à une file. Sur un graphe non pondéré, le premier chemin qui atteint la cible est un plus court chemin en nombre d'arêtes. Quand les arêtes ont des coûts différents, cet algorithme ne suffit plus : Dijkstra et d'autres existent. Tu n'as pas à les coder aujourd'hui. Tu dois savoir que « le plus court » dépend de ce qu'on compte."},{"type":"code","lang":"text","code":"Dakar — Saint-Louis\n  |        |\nThiès ———— Louga","caption":"Quatre sommets. Plusieurs chemins de Dakar à Louga."},{"type":"caution","text":"BFS donne le moins de sauts, pas forcément le moins de minutes. Une arête directe lente peut être pire que deux arêtes rapides, si les coûts comptent."},{"type":"note","text":"Les réseaux sociaux, les dépendances entre fichiers, le web lui-même : des graphes. Dessine dix sommets maximum quand tu raisonnes. Au-delà, tu noies l'idée."}],"exercises":[{"type":"quiz","id":"algo-graphes-q","prompt":"Sur un graphe sans poids, que trouve un parcours en largeur ?","choices":["Le chemin avec le moins d'arêtes","Toujours le chemin le plus joli","Uniquement les arbres","Le sommet le plus lourd"],"answer":0,"explain":"La file explore anneau par anneau. Le premier fois qu'on atteint la cible, on a utilisé le moins de sauts."},{"type":"write","id":"algo-graphes-w","prompt":"Donne deux chemins différents de Dakar à Louga d'après le schéma (Dakar–Thiès–Louga et Dakar–Saint-Louis–Louga). Un chemin par ligne, villes séparées par un tiret.","lang":"text","starter":"","solution":"Dakar-Thiès-Louga\nDakar-Saint-Louis-Louga","mustInclude":["Dakar-Thiès-Louga","Dakar-Saint-Louis-Louga"]}]},{"id":"algo-methode","title":"Écrire l'algo avant le code","summary":"Reformuler, un exemple à la main, puis le code, puis la comparaison.","minutes":10,"blocks":[{"type":"p","text":"La méthode tient en quatre temps. Tu reformules le problème en une phrase qui ne contient pas de technologie. Tu calcules à la main au moins trois exemples : un cas ordinaire, un cas vide ou minimal, un cas limite. Tu écris les étapes. Tu traduis en code. Tu rejoues tes trois exemples sur le code. S'ils ne collent pas, tu corriges l'algo ou le code, pas les exemples pour « que ça passe »."},{"type":"h","text":"Un énoncé"},{"type":"p","text":"Garder les notes supérieures ou égales à 10. Exemple `[12, 9, 15, 10]` → `[12, 15, 10]`. Exemple `[]` → `[]`. Exemple `[9, 8]` → `[]`. Le 10 est gardé : la consigne dit « supérieures ou égales », pas « supérieures ». Cette décision se voit dans l'exemple, avant le `>=`."},{"type":"code","lang":"javascript","code":"function admises(notes) {\n  const gardees = [];\n  for (const note of notes) {\n    if (note >= 10) gardees.push(note);\n  }\n  return gardees;\n}","caption":"La boucle suit l'exemple. Le 10 reste."},{"type":"note","text":"Un exemple que tu n'as pas calculé toi-même ne teste rien : tu ne sais pas ce que le programme aurait dû répondre."}],"exercises":[{"type":"quiz","id":"algo-methode-q","prompt":"Pourquoi inclure un exemple de liste vide ?","choices":["Parce qu'il révèle une division ou une boucle qui suppose qu'il y a des éléments","Parce que les listes vides sont plus rapides à trier","Parce que JSON l'exige","Parce que le professeur aime le vide"],"answer":0,"explain":"Le cas vide casse les « je prends le premier élément » écrits trop vite."},{"type":"write","id":"algo-methode-w","prompt":"Écris la fonction admises qui garde les notes >= 10, comme dans la leçon.","lang":"javascript","starter":"","solution":"function admises(notes) {\n  const gardees = [];\n  for (const note of notes) {\n    if (note >= 10) gardees.push(note);\n  }\n  return gardees;\n}","expected":"admises([12, 9, 10]) → 12, 10","mustInclude":["function admises",">= 10","return gardees"]}]}]}]},"ingenierie":{"id":"ingenierie","title":"Git, livraison, regex","kicker":"Ingénierie","summary":"Branches, dépôt distant, expressions régulières, mise en ligne, et les réflexes pour livrer sans casse.","chapters":[{"id":"ing-git","title":"Git ensemble","lessons":[{"id":"ing-branches","title":"Branches et fusion","summary":"Une ligne de travail à part, puis une fusion. Un conflit se lit.","minutes":12,"blocks":[{"type":"p","text":"Une **branche** est un nom posé sur une suite de commits. `main` reste la ligne stable. `git switch -c fonction-recherche` part de là et nomme la nouvelle branche. Tu commits dessus. `git switch main` revient. `git merge fonction-recherche`, depuis main, ramène ces commits. Le travail en cours n'a pas mélangé la ligne stable tant que tu n'as pas fusionné."},{"type":"p","text":"Un **conflit** arrive si les deux côtés ont modifié les mêmes lignes. Git s'arrête et marque le fichier avec `<<<<<<<`, `=======`, `>>>>>>>`. Tu ouvres le fichier, tu gardes le texte voulu, tu enlèves les marqueurs, tu `git add` le fichier, tu commits. Ce n'est pas une panne de Git. C'est Git qui refuse de deviner."},{"type":"code","lang":"bash","code":"git switch -c fonction-recherche\n# ... edits, puis commits ...\ngit switch main\ngit merge fonction-recherche","caption":"Partir, travailler, revenir, fusionner."},{"type":"caution","text":"Fusionner dans main une branche que personne n'a relue, c'est publier le brouillon. La branche sert justement à relire avant."},{"type":"note","text":"`git rebase` réécrit l'historique pour poser tes commits au bout de main. Utile, et dangereux sur une branche déjà poussée et partagée. Au début, merge suffit."}],"exercises":[{"type":"quiz","id":"ing-branches-q","prompt":"Que signifient les marqueurs <<<<<<< dans un fichier ?","choices":["Le fichier est supprimé","Un conflit de fusion à résoudre à la main","Une erreur de syntaxe Java","La fin du dépôt"],"answer":1,"explain":"Git a laissé les deux versions. Tu choisis, tu retires les marqueurs, tu commits."},{"type":"write","id":"ing-branches-w","prompt":"Écris la commande qui crée et bascule sur la branche fonction-prix.","lang":"bash","starter":"","solution":"git switch -c fonction-prix","mustInclude":["git switch -c fonction-prix"]}]},{"id":"ing-remote","title":"Dépôt distant et revue","summary":"Pousser une branche, proposer de l'intégrer, expliquer pourquoi.","minutes":11,"blocks":[{"type":"p","text":"Le dépôt **distant** (souvent nommé `origin`) est une copie sur un serveur : Forge, GitHub, GitLab, ailleurs. `git push -u origin fonction-prix` envoie la branche et mémorise le lien. Ensuite, `git push` suffit. `git pull` ramène ce que d'autres ont poussé sur la branche courante. Pull avant de pousser si le distant a avancé."},{"type":"p","text":"Une **pull request** (ou merge request) est une conversation : voici la branche, voici ce qu'elle change, voici pourquoi. On relit le diff, on discute, on fusionne. Le message de commit dit le **pourquoi**, pas `update` ni `fix`. « Affiche le prix en euros, pas en centimes » se relit. « modifs » ne se relit pas."},{"type":"code","lang":"bash","code":"git switch -c fonction-prix\ngit commit -m \"Affiche le prix en euros\"\ngit push -u origin fonction-prix","caption":"La branche existe en local, puis sur le serveur. La revue se fait là-bas."},{"type":"note","text":"Le premier push d'une branche a besoin de -u. Les suivants savent où aller."}],"exercises":[{"type":"quiz","id":"ing-remote-q","prompt":"À quoi sert une pull request ?","choices":["À compiler Java","À relire une branche avant de l'intégrer","À supprimer origin","À remplacer les tests"],"answer":1,"explain":"C'est l'endroit où le diff se discute. Fusionner sans regarder annule l'intérêt."},{"type":"write","id":"ing-remote-w","prompt":"Écris les commandes pour créer la branche fonction-prix et la pousser en fixant le lien upstream.","lang":"bash","starter":"","solution":"git switch -c fonction-prix\ngit push -u origin fonction-prix","mustInclude":["git switch","git push"]}]},{"id":"ing-historique","title":"Historique et gitignore","summary":"Voir ce qui a changé. Ne jamais versionner les secrets ni les dépendances.","minutes":11,"blocks":[{"type":"p","text":"`git log --oneline` liste les commits, un par ligne. `git diff` montre ce qui n'est pas encore commité. `git restore fichier` remet le fichier comme au dernier commit : le travail non commité sur ce fichier **disparaît**. Ce n'est pas une corbeille. `git restore` se décide après avoir regardé `git diff`."},{"type":"p","text":"`.gitignore` liste ce que Git ne doit pas proposer. Dedans, presque toujours : `node_modules/`, `.venv/`, `.env`, `.DS_Store`, les dossiers de build. Tu l'ajoutes au premier commit. Un fichier déjà suivi reste suivi même si tu l'ajoutes ensuite au gitignore : il faut le retirer de l'index, pas seulement l'ignorer pour plus tard."},{"type":"code","lang":"text","code":"node_modules/\n.venv/\n.env\n.DS_Store","caption":"Un .gitignore de départ. À adapter, pas à vider."},{"type":"caution","text":"Un secret commité reste dans l'historique, même si le commit suivant le supprime. On révoque la clé. On ne se contente pas de `git rm`."},{"type":"note","text":"`git diff` avant chaque commit. Tu vois les `console.log` et les mots de passe que tu allais figer."}],"exercises":[{"type":"quiz","id":"ing-historique-q","prompt":"git restore notes.txt sur un fichier modifié non commité. Que se passe-t-il ?","choices":["Une branche est créée","Les modifications non commitées de ce fichier sont perdues","Le dépôt distant est effacé","Le fichier est publié"],"answer":1,"explain":"restore revient au dernier commit. Sans commit préalable, le texte en cours n'a plus de copie."},{"type":"write","id":"ing-historique-w","prompt":"Écris quatre lignes de .gitignore : node_modules, .venv, .env, .DS_Store.","lang":"text","starter":"","solution":"node_modules/\n.venv/\n.env\n.DS_Store\n","mustInclude":["node_modules/",".env",".venv/"]}]}]},{"id":"ing-livre","title":"Livrer","lessons":[{"id":"ing-regex","title":"Expressions régulières, le minimum","summary":"Décrire un motif. Ne pas s'en servir pour lire du HTML.","minutes":12,"blocks":[{"type":"p","text":"Une **expression régulière** décrit un motif dans du texte. Les lettres se cherchent telles quelles. `.` est un caractère quelconque. `*` répète zéro fois ou plus ce qui précède, `+` une fois ou plus, `?` zéro ou une fois. `[0-9]` est un chiffre, `\\d` aussi dans beaucoup de moteurs. `^` accroche le début, `$` la fin. Les parenthèses gardent un groupe."},{"type":"p","text":"En JavaScript, `/\\d{5}/` cherche cinq chiffres. Utile pour un code postal isolé, fragile si tu ne poses pas `^` et `$` : `750010` contient aussi cinq chiffres d'affilée. Le motif dit ce que tu as demandé, pas ce que tu croyais demander. Teste sur trois exemples : un qui doit passer, un qui doit échouer, un presque juste."},{"type":"code","lang":"javascript","code":"const cp = /^\\d{5}$/;\nconsole.log(cp.test(\"75011\"));\nconsole.log(cp.test(\"7501\"));\nconsole.log(cp.test(\"75 011\"));","caption":"Cinq chiffres, rien avant, rien après. L'espace fait échouer, et c'est voulu."},{"type":"caution","text":"Ne lis pas du HTML avec une regex. Une balise dans une balise, un attribut qui contient `>`, et le motif « simple » avale trop ou pas assez. Un parseur HTML existe pour ça."},{"type":"note","text":"Si le motif dépasse une ligne et que tu ne peux plus le lire demain, écris plutôt quelques conditions. La regex n'est pas un trophée."}],"exercises":[{"type":"quiz","id":"ing-regex-q","prompt":"Pourquoi ne pas extraire le texte d'une page HTML avec une regex ?","choices":["Les regex sont lentes sur quatre lettres","Le HTML s'imbrique, le motif casse sur des cas réels","Le navigateur interdit les regex","Parce que ^ est interdit"],"answer":1,"explain":"Dès qu'une balise contient une autre balise ou un > dans un attribut, le motif naïf se trompe."},{"type":"write","id":"ing-regex-w","prompt":"Écris en JS une regex ancrée qui reconnaît exactement cinq chiffres, dans une constante cp.","lang":"javascript","starter":"","solution":"const cp = /^\\d{5}$/;","mustInclude":["const cp","\\d{5}"]}]},{"id":"ing-deploy","title":"Mettre un site statique en ligne","summary":"Le build produit des fichiers. Un hébergeur les sert. Ce n'est plus ta machine.","minutes":10,"blocks":[{"type":"p","text":"`npm run dev` lance un serveur pour toi, avec rechargement, messages bavards, parfois des outils qui n'existent pas en production. **Mettre en ligne**, pour un site statique, c'est produire les fichiers (`npm run build`) et les donner à un hébergeur qui les sert en HTTPS. Pages, Netlify, Cloudflare Pages sont des exemples, pas une obligation. Le visiteur ne lance pas ton terminal. Il reçoit le résultat du build."},{"type":"p","text":"Ce que tu vois en local peut différer : une variable d'environnement absente, un chemin `/images/a.png` qui marchait parce que le dossier de dev n'est pas celui du build, un cache du navigateur qui garde l'ancienne page. Quand « la mise à jour n'apparaît pas », recharge sans cache avant de réécrire le projet."},{"type":"ul","items":["Le build est ce qui est déployé. Le mode dev ne l'est pas.","Un site statique n'a pas de secret : tout fichier envoyé est lisible.","HTTPS est le défaut chez ces hébergeurs. N'ajoute pas un mode HTTP « pour tester ».","Le domaine et le certificat se configurent chez l'hébergeur, pas dans ton CSS."]},{"type":"code","lang":"bash","code":"npm run build\n# le dossier produit (dist, build, .output…) part sur l'hébergeur","caption":"Deux mondes. Seul le second est public."},{"type":"note","text":"Déploie tôt une page presque vide. Tu découvres le chemin de publication avant d'avoir cent pages à déboguer."}],"exercises":[{"type":"quiz","id":"ing-deploy-q","prompt":"Que voit le visiteur ?","choices":["Ton terminal npm run dev","Les fichiers produits par le build","Ton node_modules","Le fichier .env"],"answer":1,"explain":"L'hébergeur sert le résultat du build. Le reste reste chez toi, et .env ne part pas."},{"type":"write","id":"ing-deploy-w","prompt":"En deux lignes : la commande de build, puis le nom d'un dossier de sortie courant (dist).","lang":"text","starter":"","solution":"npm run build\ndist","mustInclude":["npm run build","dist"]}]},{"id":"ing-secrets","title":"Secrets et configuration","summary":"Une clé qui donne un pouvoir ne traverse ni git ni le navigateur.","minutes":9,"blocks":[{"type":"p","text":"Un **secret** est une valeur qui donne un pouvoir : mot de passe de base, clé d'API privée, jeton d'administration. Il vit dans l'environnement du serveur, pas dans le code, pas dans le dépôt, pas dans le JavaScript envoyé au navigateur. Le code lit `process.env.CLE`. Les machines qui ont le droit de tourner le programme reçoivent la valeur par un autre canal."},{"type":"p","text":"Certaines clés sont **publiques par conception** : une clé « publishable » qui ne peut qu'afficher, bridée par domaine. La documentation le dit. Si le mot secret, private ou service_role apparaît, elle ne va pas dans le front. En cas de fuite, on révoque. On ne « change le nom de la variable »."},{"type":"code","lang":"text","code":"DANS git : le nom de la variable, un .env.example vide\nHORS git : la valeur\nDANS le navigateur : rien de secret","caption":"Trois emplacements. Un seul peut voir la valeur."},{"type":"caution","text":"Une capture d'écran de ton éditeur avec le .env ouvert est une fuite. Recadre avant d'envoyer."}],"exercises":[{"type":"quiz","id":"ing-secrets-q","prompt":"Une clé est marquée secret dans la doc. Où l'utiliser ?","choices":["Dans le JS de la page, c'est plus simple","Uniquement côté serveur","Dans le README","Dans l'URL, en paramètre"],"answer":1,"explain":"Le navigateur télécharge le JS. Un secret dedans est public. Le serveur, lui, peut le lire sans l'envoyer."},{"type":"write","id":"ing-secrets-w","prompt":"Écris deux lignes : où va la valeur d'une clé secrète, et où elle ne va pas.","lang":"text","starter":"","solution":"Valeur : variable d'environnement du serveur, hors git.\nPas dans le JavaScript du navigateur.","mustInclude":["serveur","navigateur"]}]},{"id":"ing-ci","title":"Un test qui se lance tout seul","summary":"À chaque push, une machine vierge vérifie. Rouge : on ne fusionne pas.","minutes":11,"blocks":[{"type":"p","text":"L'**intégration continue** lance des commandes sur une machine propre à chaque push : installer, compiler, tester. Personne ne dit « chez moi ça passe » sans que la machine vierge soit d'accord. Si le résultat est rouge, on ne fusionne pas. Le correctif est un commit, pas une discussion pour ignorer le rouge."},{"type":"p","text":"Un test, au plus petit, est une affirmation. Tu calcules le résultat attendu toi-même. Le programme le recalcule. S'ils diffèrent, on s'arrête. L'exemple ci-dessous n'est pas un framework. C'est l'idée. Plus tard, le framework (node:test, pytest, JUnit) rangera ces affirmations et les comptera."},{"type":"code","lang":"javascript","code":"function moyenne(notes) {\n  return notes.reduce((s, n) => s + n, 0) / notes.length;\n}\nfunction assert(cond, msg) {\n  if (!cond) throw new Error(msg);\n}\nassert(moyenne([10, 20]) === 15, \"moyenne\");","caption":"15 a été calculé à la main. L'assert compare."},{"type":"code","lang":"yaml","code":"name: verifier\non: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - run: npm test","caption":"L'idée d'un workflow. L'hébergeur lance ça, pas toi le matin."},{"type":"note","text":"Un test qui répète le code (« attendu = la fonction elle-même ») ne teste rien. L'attendu vient d'un calcul séparé."}],"exercises":[{"type":"quiz","id":"ing-ci-q","prompt":"La CI est rouge. Que fait-on de la branche ?","choices":["On fusionne quand même, c'est long","On ne fusionne pas tant que ce n'est pas vert","On supprime les tests","On désactive HTTPS"],"answer":1,"explain":"Le rouge est le point. L'ignorer revient à ne pas avoir de CI."},{"type":"write","id":"ing-ci-w","prompt":"Écris une fonction assert et un appel qui vérifie que moyenne([10, 20]) vaut 15. Inclus le mot assert.","lang":"javascript","starter":"function moyenne(notes) {\n  return notes.reduce((s, n) => s + n, 0) / notes.length;\n}\n","solution":"function assert(cond, msg) {\n  if (!cond) throw new Error(msg);\n}\nassert(moyenne([10, 20]) === 15, \"moyenne\");","mustInclude":["assert","=== 15"]}]},{"id":"ing-docker","title":"Un conteneur, l'idée","summary":"La même recette partout. Pas un substitut à comprendre le programme.","minutes":9,"blocks":[{"type":"p","text":"« Chez moi ça marche » veut souvent dire : ta machine a une version de Node, une bibliothèque système, une variable, que l'autre machine n'a pas. Une **image** est une recette figée : un système minimal, un runtime, ton application, les fichiers qu'il faut. Un **conteneur** est cette recette en train de tourner. Deux personnes qui lancent la même image obtiennent le même point de départ."},{"type":"p","text":"Un `Dockerfile` se lit de haut en bas. `FROM` choisit la base. `COPY` amène tes fichiers. `CMD` dit comment démarrer. Tu n'as pas à retenir toutes les instructions. Tu dois savoir qu'un conteneur n'est pas une machine virtuelle complète, et qu'il ne répare pas un programme faux : il le reproduit fidèlement, bug inclus."},{"type":"code","lang":"text","code":"FROM node:22\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci\nCOPY . .\nCMD [\"npm\", \"start\"]","caption":"Esquisse. La prod ajoute un utilisateur non root, et ne copie pas .env."},{"type":"note","text":"Docker est un outil de livraison. Il ne remplace ni les tests, ni la lecture du code, ni la question « de quoi ce programme a-t-il besoin »."}],"exercises":[{"type":"quiz","id":"ing-docker-q","prompt":"Quelle différence entre image et conteneur ?","choices":["Aucun, ce sont des synonymes","L'image est la recette figée, le conteneur est une instance qui tourne","Le conteneur est le Dockerfile, l'image est le CPU","L'image est toujours un secret"],"answer":1,"explain":"On construit une image. On lance un ou plusieurs conteneurs à partir d'elle."},{"type":"write","id":"ing-docker-w","prompt":"Écris les trois mots clés FROM, COPY et CMD, un par ligne, comme rappel de l'esquisse.","lang":"text","starter":"","solution":"FROM\nCOPY\nCMD","mustInclude":["FROM","COPY","CMD"]}]},{"id":"ing-paysage","title":"Le paysage après ce parcours","summary":"Aucun langage n'est le bon. Le problème et l'équipe choisissent.","minutes":10,"blocks":[{"type":"p","text":"Ce parcours t'a donné de quoi lire et écrire le web, et de quoi ne pas être perdu ailleurs. HTML, CSS et JavaScript décrivent ce que le navigateur montre. TypeScript relit les formes. React organise l'interface. Node met le même langage côté serveur. Python va bien aux scripts, aux fichiers, à beaucoup d'outils de données. Java occupe énormément de serveurs d'entreprise et une partie d'Android. PHP tient encore une grande part du web déjà en place. **SQL** est là dès qu'il y a des données relationnelles, quel que soit le langage autour."},{"type":"p","text":"Ensuite, selon le métier. **Go** revient souvent pour des services réseau simples à déployer. **Rust** et **C** quand la mémoire et le système sont le sujet. **Kotlin** et **Swift** pour les applications mobiles natives. Linux et le terminal restent le sol commun des serveurs. Tu n'as pas à tous les apprendre avant de construire quelque chose. Tu en apprends un assez bien pour finir un projet, et tu sais reconnaître les autres quand tu les croises."},{"type":"ul","items":["Le choix dépend du problème, de l'équipe, et de ce qui existe déjà.","Changer de langage ne dispense pas des fondations : HTTP, fichiers, tests, Git.","Un deuxième langage s'apprend plus vite que le premier, parce que les idées se retrouvent."]},{"type":"note","text":"Si tu dois choisir maintenant : finis un projet web avec ce que tu as, ou un script Python qui t'est utile. La suite se décide devant un vrai besoin, pas devant une liste."}],"exercises":[{"type":"quiz","id":"ing-paysage-q","prompt":"À quoi sert SQL, à côté de Java, Python ou PHP ?","choices":["À remplacer HTML","À interroger des données relationnelles, quel que soit le langage autour","Uniquement à compiler","À dessiner en CSS"],"answer":1,"explain":"La base parle SQL. Le langage du serveur envoie les requêtes. Ce sont deux étages."},{"type":"write","id":"ing-paysage-w","prompt":"Cite trois langages ou outils du parcours et une phrase sur ce que tu leur demandes. Inclus SQL.","lang":"text","starter":"","solution":"JavaScript : la page réagit.\nPython : les scripts.\nSQL : les données.","mustInclude":["SQL"]}]}]}]},"ia":{"id":"ia","title":"Coder avec l'IA","kicker":"Ingénierie","summary":"Demander, relire, tester. L'outil accélère. Il ne signe pas à ta place.","chapters":[{"id":"ia-1","title":"Un outil, pas un auteur","lessons":[{"id":"ia-limites","title":"Ce que le modèle fait vraiment","summary":"Il poursuit un texte plausible. Il n'a pas lancé ton programme.","minutes":10,"blocks":[{"type":"p","text":"Un modèle de langage produit le prochain morceau de texte le plus plausible, vu ce que tu as écrit et ce qu'il a appris. Il ne compile pas ton projet. Il n'ouvre pas ta base. Il ne sait pas qu'une bibliothèque a changé de nom la semaine dernière, sauf si cette information est dans la conversation ou dans ses données. Quand il invente une méthode, un flag, une citation, on appelle ça une **hallucination**. Le ton peut être sûr. La sûreté du ton n'est pas une vérification."},{"type":"p","text":"Ça reste utile : dégrossir une fonction, expliquer une erreur, proposer trois façons de nommer. C'est inutile, ou pire, si tu colles le résultat sans pouvoir dire ce qu'il fait. La règle tient en une phrase : si tu ne sais pas le vérifier, tu ne sais pas l'utiliser."},{"type":"code","lang":"text","code":"demande → texte plausible\npas : demande → programme exécuté chez toi\nvérifier : lancer, lire, comparer à un exemple à toi","caption":"Le modèle propose. La machine à toi exécute. Toi, tu compares."},{"type":"note","text":"Une réponse longue n'est pas plus vraie qu'une réponse courte. Elle est seulement plus longue à relire."}],"exercises":[{"type":"quiz","id":"ia-limites-q","prompt":"Le modèle affirme qu'une fonction existe. Qu'est-ce qui tranche ?","choices":["Le ton assuré","La documentation et un essai chez toi","La longueur de la réponse","Le fait qu'il ait mis un exemple"],"answer":1,"explain":"L'exemple peut être inventé avec la fonction. La doc et l'exécution ne le sont pas."},{"type":"write","id":"ia-limites-w","prompt":"En une phrase : que faut-il faire avant de croire une méthode que le modèle vient de nommer ?","lang":"text","starter":"","solution":"Vérifier dans la documentation qu'elle existe, puis l'essayer sur un exemple.","mustInclude":["documentation"]}]},{"id":"ia-prompt","title":"Écrire une demande utile","summary":"Langage, version, but, exemple. Pas « fais mon site ».","minutes":11,"blocks":[{"type":"p","text":"Une demande utile tient sur un écran. Elle dit le langage et, si ça compte, la version. Elle dit le but en une phrase. Elle donne un exemple d'entrée et de sortie que **tu** as calculé. Elle dit ce que tu as déjà essayé et le message d'erreur exact. Elle demande une fonction, pas une application. « Fais mon site » n'a pas de critère de fin. « Écris une fonction `moyenne(notes)` qui ignore ce qui n'est pas un nombre ; `[10, \"x\", 20]` donne `15` » en a un."},{"type":"p","text":"Tu ne colles pas le dépôt entier. Tu colles la fonction, l'erreur, et trois lignes de contexte. Tu ne colles pas de secret pour « aider le modèle à comprendre la config ». Le modèle n'a pas besoin du mot de passe pour expliquer un 401."},{"type":"code","lang":"text","code":"Mauvais : fais mon site de livres.\n\nMieux : fonction JS moyenne(notes) qui ignore les valeurs\ndont typeof n'est pas \"number\".\nExemple : [10, \"x\", 20] → 15.\nPas de bibliothèque.","caption":"Le deuxième prompt se vérifie. Le premier non."},{"type":"note","text":"Si tu n'arrives pas à écrire l'exemple chiffré, tu n'es pas prêt à déléguer. Reviens à l'algorithme, à la main."}],"exercises":[{"type":"quiz","id":"ia-prompt-q","prompt":"Quel élément rend une demande vérifiable ?","choices":["Beaucoup d'adjectifs","Un exemple d'entrée et la sortie attendue, calculée par toi","Le mot « professionnel »","Coller tout le projet"],"answer":1,"explain":"Sans sortie attendue, tout résultat « a l'air bien ». L'exemple tranche."},{"type":"write","id":"ia-prompt-w","prompt":"Réécris une demande : une fonction moyenne, l'exemple [10, \"x\", 20] qui doit donner 15. Le mot moyenne doit apparaître.","lang":"text","starter":"","solution":"Écris une fonction JS moyenne(notes) qui ignore les valeurs non numériques. Exemple : [10, \"x\", 20] → 15.","mustInclude":["moyenne","15"]}]},{"id":"ia-relire","title":"Relire le code généré","summary":"Ligne à ligne. Une fonction à la fois, pas un fichier de quatre cents lignes.","minutes":10,"blocks":[{"type":"p","text":"Relire, c'est pouvoir expliquer chaque ligne. La checklist est courte. Est-ce que les noms existent dans la documentation de cette version ? Est-ce que les cas limites de ton exemple sont traités (vide, zéro, texte inattendu) ? Est-ce qu'une erreur est avalée par un `catch` vide ? Est-ce qu'un secret, un chemin, une URL de prod s'est glissé ? Est-ce que c'est plus compliqué que le problème ? Si oui, demande une version plus courte, ou réécris."},{"type":"ul","items":["Lis le diff, pas seulement le fichier entier.","Refuse un changement que tu ne saurais pas réécrire dans une heure.","Un `try/catch` qui ne fait rien cache la panne.","Les commentaires générés répètent souvent le code. Tu peux les enlever."]},{"type":"code","lang":"javascript","code":"function moyenne(notes) {\n  const nums = notes.filter((n) => typeof n === \"number\");\n  if (nums.length === 0) return null;\n  return nums.reduce((s, n) => s + n, 0) / nums.length;\n}","caption":"Court. Le cas vide est décidé. On peut le tester."},{"type":"caution","text":"Un long fichier d'un seul coup est plus dur à relire qu'une fonction. Demande la fonction. Intègre-la. Puis la suivante."}],"exercises":[{"type":"quiz","id":"ia-relire-q","prompt":"Quel est le problème d'un catch vide autour d'un appel généré ?","choices":["Il accélère trop","Il cache l'erreur au lieu de la traiter","Il est interdit par Git","Il supprime les types"],"answer":1,"explain":"L'erreur existe encore. Tu ne la vois plus. Le bug devient « parfois rien ne se passe »."},{"type":"write","id":"ia-relire-w","prompt":"Écris la fonction moyenne qui ignore les non-nombres et retourne null si aucun nombre. Inclus filter et null.","lang":"javascript","starter":"","solution":"function moyenne(notes) {\n  const nums = notes.filter((n) => typeof n === \"number\");\n  if (nums.length === 0) return null;\n  return nums.reduce((s, n) => s + n, 0) / nums.length;\n}","mustInclude":["filter","return null"]}]},{"id":"ia-tester","title":"Tester avant de croire","summary":"L'exemple attendu vient de toi. Le test écrit par le modèle peut partager le bug.","minutes":10,"blocks":[{"type":"p","text":"Le modèle peut écrire le code et le test dans la même foulée. Les deux partagent alors la même erreur : le test « prouve » le bug. L'attendu doit venir d'un calcul que tu as fait sans le modèle. `[10, \"x\", 20]` : 10 et 20, somme 30, deux nombres, moyenne 15. Tu lances. Tu compares à 15, pas à « ce que la fonction retourne aujourd'hui »."},{"type":"p","text":"Si tu ne peux pas lancer (pas de JDK sous la main, pas de réseau), tu compares quand même à la main, ligne à ligne, sur cet exemple. Une lecture qui ne rejoue aucun chiffre n'est pas un test. C'est une impression."},{"type":"code","lang":"javascript","code":"import assert from \"node:assert/strict\";\nassert.equal(moyenne([10, \"x\", 20]), 15);\nassert.equal(moyenne([\"x\"]), null);","caption":"Deux cas. Le deuxième empêche de diviser par zéro en douce."},{"type":"note","text":"Garde les exemples dans le projet. Ils documentent ce que tu as décidé, y compris le cas vide."}],"exercises":[{"type":"quiz","id":"ia-tester-q","prompt":"Pourquoi ne pas faire confiance au test écrit en même temps que la fonction ?","choices":["Les tests sont lents","Il peut encoder la même erreur que la fonction","node:assert est fictif","Un test doit faire mille lignes"],"answer":1,"explain":"Même auteur, même confusion. L'attendu calculé à part casse cette dépendance."},{"type":"write","id":"ia-tester-w","prompt":"Écris deux assert.equal : moyenne de [10, \"x\", 20] vaut 15, moyenne de [\"x\"] vaut null.","lang":"javascript","starter":"","solution":"assert.equal(moyenne([10, \"x\", 20]), 15);\nassert.equal(moyenne([\"x\"]), null);","mustInclude":["assert.equal","15","null"]}]},{"id":"ia-responsable","title":"Secrets, licences, responsabilité","summary":"Tu signes le commit. Le modèle n'a pas de dépôt.","minutes":9,"blocks":[{"type":"p","text":"Ne colle pas de clés, de dumps clients, de données personnelles, de code que ton employeur ou ton école t'interdit de sortir. Une conversation avec un modèle est une copie. Tu ne sais pas toujours où elle va. En cas de doute, tu reformules le problème sur un exemple fictif : des livres, des notes, Awa et Malik."},{"type":"p","text":"Le code proposé peut ressembler à du code sous licence. Pour apprendre, sur un exercice, le risque est faible. Pour un produit que tu publies, **tu** es responsable de ce que tu distribues : tu dois pouvoir dire d'où ça vient et sous quelle licence c'est le tien. Le modèle ne signe pas. Le commit porte ton nom."},{"type":"ul","items":["Exemple fictif plutôt que données réelles.","Pas de secret « pour le contexte ».","Relire avant de publier, y compris les commentaires qui citent une fausse source.","Si tu ne comprends pas le morceau, il n'entre pas."]},{"type":"caution","text":"Un mot de passe collé « une fois » dans une conversation est à considérer comme compromis. Révoque-le. N'attends pas de savoir si quelqu'un l'a lu."},{"type":"note","text":"L'outil accélère la frappe. Il ne choisit pas à ta place ce qui est juste, ni ce qui est à toi."}],"exercises":[{"type":"quiz","id":"ia-responsable-q","prompt":"Qui est responsable du code que tu merges ?","choices":["Le modèle, puisqu'il l'a écrit","Toi, qui signes le commit","L'hébergeur git","La licence du navigateur"],"answer":1,"explain":"Le nom sur le commit est le tien. « C'est l'IA » n'est pas une revue."},{"type":"write","id":"ia-responsable-w","prompt":"Écris la règle en une ligne : pas de secret dans la demande, et le commit est signé par toi. Inclus les mots secret et commit.","lang":"text","starter":"","solution":"Pas de secret dans la demande. Le commit est le mien.","mustInclude":["secret","commit"]}]}]}]},"projets":{"id":"projets","title":"Projets guidés","kicker":"Pratique","summary":"Cinq chantiers pour assembler HTML, CSS, JavaScript et la manière de travailler.","chapters":[{"id":"proj-web","title":"Dans le navigateur","lessons":[{"id":"projet-liste","title":"Projet : liste de tâches","summary":"Ajouter, afficher, retirer. Un tableau en mémoire, un rendu qui le suit.","minutes":16,"blocks":[{"type":"p","text":"Le chantier est petit et complet : un champ, un bouton, une liste. En mémoire, un tableau de textes. À chaque changement, tu **redessines** la liste à partir du tableau. Tu ne cherches pas à « ajouter un li à la main » d'un côté et à oublier le tableau de l'autre : le tableau est la source, le HTML en est la photo."},{"type":"h","text":"Les étapes"},{"type":"ul","items":["Le HTML a un formulaire avec un label, un input, un bouton, et un ul vide.","Au submit : preventDefault, lire la valeur, refuser le vide, push, vider le champ, redraw.","redraw vide le ul, puis crée un li par tâche, avec un bouton Retirer qui splice et rappelle redraw.","Le label a un for qui vise l'id de l'input. Le bouton dit ce qu'il fait."]},{"type":"code","lang":"javascript","code":"function redraw() {\n  liste.replaceChildren();\n  taches.forEach((titre, index) => {\n    const li = document.createElement(\"li\");\n    li.textContent = titre + \" \";\n    const retirer = document.createElement(\"button\");\n    retirer.type = \"button\";\n    retirer.textContent = \"Retirer\";\n    retirer.addEventListener(\"click\", () => {\n      taches.splice(index, 1);\n      redraw();\n    });\n    li.append(retirer);\n    liste.append(li);\n  });\n}","caption":"replaceChildren évite d'empiler d'anciens li. L'index est celui du tour de forEach."},{"type":"p","text":"Extension, une fois que l'ajout marche : `localStorage.setItem(\"taches\", JSON.stringify(taches))` à la fin de redraw, et au démarrage `JSON.parse(localStorage.getItem(\"taches\") || \"[]\")`. Le tableau redevient la source après le parse. Si le parse jette, tu repars de `[]`."},{"type":"note","text":"Fais d'abord l'ajout sans stockage. Le localStorage se branche quand redraw existe. Pas l'inverse."}],"exercises":[{"type":"web","id":"projet-liste-web","prompt":"Complète le JavaScript : au submit, ajoute le texte de l'input au tableau taches (ignore le vide), vide le champ, et appelle redraw. Le bouton Retirer est déjà dans redraw.","files":["html","css","js"],"starter":{"html":"<form id=\"f\">\n  <label for=\"t\">Nouvelle tâche</label>\n  <input id=\"t\" required>\n  <button>Ajouter</button>\n</form>\n<ul id=\"liste\"></ul>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }\nform { display: flex; gap: 8px; flex-wrap: wrap; }\nul { padding-left: 1.2rem; }","js":"const taches = [];\nconst form = document.querySelector(\"#f\");\nconst input = document.querySelector(\"#t\");\nconst liste = document.querySelector(\"#liste\");\n\nfunction redraw() {\n  liste.replaceChildren();\n  taches.forEach((titre, index) => {\n    const li = document.createElement(\"li\");\n    li.textContent = titre + \" \";\n    const retirer = document.createElement(\"button\");\n    retirer.type = \"button\";\n    retirer.textContent = \"Retirer\";\n    retirer.addEventListener(\"click\", () => {\n      taches.splice(index, 1);\n      redraw();\n    });\n    li.append(retirer);\n    liste.append(li);\n  });\n}\n\nform.addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  // à toi : pousser input.value.trim() s'il n'est pas vide, vider, redraw\n});"},"solution":{"html":"<form id=\"f\">\n  <label for=\"t\">Nouvelle tâche</label>\n  <input id=\"t\" required>\n  <button>Ajouter</button>\n</form>\n<ul id=\"liste\"></ul>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }\nform { display: flex; gap: 8px; flex-wrap: wrap; }\nul { padding-left: 1.2rem; }","js":"const taches = [];\nconst form = document.querySelector(\"#f\");\nconst input = document.querySelector(\"#t\");\nconst liste = document.querySelector(\"#liste\");\n\nfunction redraw() {\n  liste.replaceChildren();\n  taches.forEach((titre, index) => {\n    const li = document.createElement(\"li\");\n    li.textContent = titre + \" \";\n    const retirer = document.createElement(\"button\");\n    retirer.type = \"button\";\n    retirer.textContent = \"Retirer\";\n    retirer.addEventListener(\"click\", () => {\n      taches.splice(index, 1);\n      redraw();\n    });\n    li.append(retirer);\n    liste.append(li);\n  });\n}\n\nform.addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  const titre = input.value.trim();\n  if (!titre) return;\n  taches.push(titre);\n  input.value = \"\";\n  redraw();\n});"},"hint":"preventDefault est déjà là. Il manque push, le test de chaîne vide, et redraw."},{"type":"quiz","id":"projet-liste-q","prompt":"Pourquoi redessiner toute la liste depuis le tableau, plutôt que seulement append un li ?","choices":["Parce que append est interdit","Parce que le tableau reste la source : retirer et réafficher ne se désynchronisent pas","Parce que le CSS l'exige","Parce que le formulaire ne peut pas avoir de bouton"],"answer":1,"explain":"Si le li et le tableau divergent, le prochain redraw ou le prochain retrait part d'une donnée fausse."}]},{"id":"projet-livres","title":"Projet : galerie de livres","summary":"Un tableau d'objets, une grille, un filtre sur le titre.","minutes":16,"blocks":[{"type":"p","text":"Les données sont un tableau d'objets `{ titre, auteur, prix }`. L'interface les montre en cartes. Un champ filtre : on ne garde que les livres dont le titre, en minuscules, contient la saisie en minuscules. Liste vide de filtre : tous les livres. Saisie qui ne correspond à rien : un message, pas une page blanche."},{"type":"h","text":"Sémantique"},{"type":"p","text":"Une liste de cartes est un `ul` avec des `li`, ou une suite d'`article`. Pas une soupe de `div` sans rôle. Le champ a un `label`. Le prix est du texte, avec son unité. La grille CSS tient dans dix lignes : `display: grid` et `grid-template-columns: repeat(auto-fill, minmax(180px, 1fr))`."},{"type":"code","lang":"javascript","code":"function visibles() {\n  const q = filtre.value.trim().toLowerCase();\n  return livres.filter((livre) => livre.titre.toLowerCase().includes(q));\n}","caption":"Une fonction, pas un filtre recopié à trois endroits."},{"type":"note","text":"toLowerCase des deux côtés, sinon « bel » ne trouve pas « Beloved »."}],"exercises":[{"type":"web","id":"projet-livres-web","prompt":"Relie le champ : à chaque saisie, affiche dans #grille seulement les livres dont le titre contient le texte (sans tenir compte de la casse). S'il n'y en a aucun, écris Aucun livre dans #grille.","files":["html","css","js"],"starter":{"html":"<label for=\"q\">Filtrer par titre</label>\n<input id=\"q\">\n<div id=\"grille\"></div>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }\n#grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }\narticle { border: 1px solid #e3d9cc; padding: 12px; background: white; }","js":"const livres = [\n  { titre: \"Beloved\", auteur: \"Morrison\", prix: 16 },\n  { titre: \"Sula\", auteur: \"Morrison\", prix: 14 },\n  { titre: \"L'étranger\", auteur: \"Camus\", prix: 9 },\n];\nconst filtre = document.querySelector(\"#q\");\nconst grille = document.querySelector(\"#grille\");\n\nfunction draw() {\n  grille.replaceChildren();\n  // à toi : filtrer livres, créer un article par livre, ou un paragraphe Aucun livre\n}\n\nfiltre.addEventListener(\"input\", draw);\ndraw();"},"solution":{"html":"<label for=\"q\">Filtrer par titre</label>\n<input id=\"q\">\n<div id=\"grille\"></div>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }\n#grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }\narticle { border: 1px solid #e3d9cc; padding: 12px; background: white; }","js":"const livres = [\n  { titre: \"Beloved\", auteur: \"Morrison\", prix: 16 },\n  { titre: \"Sula\", auteur: \"Morrison\", prix: 14 },\n  { titre: \"L'étranger\", auteur: \"Camus\", prix: 9 },\n];\nconst filtre = document.querySelector(\"#q\");\nconst grille = document.querySelector(\"#grille\");\n\nfunction draw() {\n  grille.replaceChildren();\n  const q = filtre.value.trim().toLowerCase();\n  const gardes = livres.filter((livre) => livre.titre.toLowerCase().includes(q));\n  if (gardes.length === 0) {\n    const p = document.createElement(\"p\");\n    p.textContent = \"Aucun livre\";\n    grille.append(p);\n    return;\n  }\n  for (const livre of gardes) {\n    const article = document.createElement(\"article\");\n    article.innerHTML = \"<h2></h2><p></p>\";\n    article.querySelector(\"h2\").textContent = livre.titre;\n    article.querySelector(\"p\").textContent = livre.auteur + \" · \" + livre.prix + \" €\";\n    grille.append(article);\n  }\n}\n\nfiltre.addEventListener(\"input\", draw);\ndraw();"},"hint":"includes après toLowerCase. tex
