(function(){
const NEW={"info":{"id":"info","title":"L'informatique","kicker":"Fondations","summary":"La machine, les octets, le réseau et HTTP : ce que le code utilise sans le dire.","chapters":[{"id":"info-machine","title":"La machine","lessons":[{"id":"info-ordi","title":"Ce qu'est un ordinateur","summary":"Processeur, mémoire vive, stockage : trois rôles qu'on confond trop souvent.","minutes":10,"blocks":[{"type":"p","text":"Un ordinateur fait trois choses : il calcule, il se souvient, et il échange avec l'extérieur. Le **processeur** (CPU) exécute des instructions, très vite, une petite étape à la fois. La **mémoire vive** (RAM) tient ce qui est en cours de travail : le programme ouvert, le texte pas encore enregistré. Elle est rapide, et elle s'efface quand on coupe le courant. Le **stockage** (SSD ou disque) garde les fichiers. Il survit à l'extinction, et il est plus lent."},{"type":"p","text":"Le processeur ne « comprend » pas Java, Python ou JavaScript. Ces langages sont faits pour toi. Un outil (compilateur, interpréteur, navigateur) les traduit en instructions machines. Quand un programme « tourne », c'est le processeur qui exécute cette traduction, en lisant les données dans la RAM."},{"type":"table","headers":["Pièce","Rôle","Si elle disparaît"],"rows":[["CPU","Exécute les instructions","Plus rien ne calcule"],["RAM","Travail en cours","Le non-enregistré est perdu"],["Stockage","Fichiers durables","Les programmes et documents ne sont plus là"],["Entrées / sorties","Clavier, écran, réseau","La machine calcule dans son coin"]]},{"type":"ul","items":["La RAM est le bureau. Le stockage est l'étagère. On travaille sur le bureau, on range sur l'étagère.","Ouvrir un fichier, c'est le **copier** du stockage vers la RAM. Enregistrer, c'est recopier l'inverse.","Un plantage arrête un programme. Le reste de la machine continue, tant que le système d'exploitation tient."]},{"type":"code","lang":"text","code":"ouvrir Beloved.txt\n→ copier le fichier en mémoire\n→ tu modifies la copie\n→ enregistrer : réécrire le fichier sur le disque","caption":"Ouvrir un document, sans magie."},{"type":"note","text":"« Je n'ai pas enregistré » veut dire : la seule copie à jour était en RAM. Éteindre, ou un plantage, l'efface."}],"exercises":[{"type":"quiz","id":"info-ordi-q","prompt":"Où se trouve le texte que tu es en train de taper, avant d'enregistrer ?","choices":["Dans le processeur, en permanence","En mémoire vive, jusqu'à l'enregistrement","Déjà sur le SSD, à chaque lettre","Dans le câble réseau"],"answer":1,"explain":"La frappe modifie la copie en RAM. Le fichier sur le disque ne change qu'au moment d'enregistrer."},{"type":"write","id":"info-ordi-w","prompt":"En trois lignes de texte, nomme la pièce qui exécute, celle qui tient le travail en cours, et celle qui garde les fichiers.","lang":"text","starter":"","solution":"CPU : exécute\nRAM : travail en cours\nSSD : fichiers","mustInclude":["CPU","RAM","SSD"]}]},{"id":"info-binaire","title":"Bits, octets et hexadécimal","summary":"Tout finit en 0 et en 1. L'octet et l'hexadécimal sont juste des paquets plus lisibles.","minutes":12,"blocks":[{"type":"p","text":"Un **bit** est un choix : 0 ou 1. Avec un bit, deux valeurs. Avec deux bits, quatre : 00, 01, 10, 11. Chaque bit ajouté double les possibilités. Huit bits font un **octet** : 256 valeurs, de 0 à 255. C'est l'unité de base des tailles de fichiers."},{"type":"p","text":"On écrit les nombres en puissances de deux parce que c'est exactement ce que les bits représentent. 1, 2, 4, 8, 16, 32, 64, 128. Le nombre 13, c'est 8 + 4 + 1, donc `1101` en binaire : les bits 8, 4 et 1 sont allumés, le bit 2 est éteint. Tu n'as pas à convertir de tête toute la journée. Tu dois reconnaître la forme, et ne plus croire qu'un fichier « pèse 13 » sans unité."},{"type":"table","headers":["Nom","Vaut environ","Exemple"],"rows":[["octet (o)","8 bits, 0 à 255","Un caractère ASCII"],["kio","1024 octets","Un petit texte"],["Mio","1024 kio","Une photo, un gros PDF"],["Gio","1024 Mio","Une vidéo, un projet"]],"caption":"Les fabricants de disques comptent souvent en 1000, pas en 1024. L'écart s'accumule."},{"type":"p","text":"L'**hexadécimal** groupe les bits par 4. Un chiffre hexadécimal va de 0 à 15, écrit 0–9 puis A–F. Deux chiffres hex font un octet : `FF` vaut 255. Une couleur CSS `#0e6b52` est trois octets : rouge `0e`, vert `6b`, bleu `52`. Les adresses mémoire, les empreintes et les couleurs se lisent ainsi, parce que `11000011` fatigue plus que `C3`."},{"type":"code","lang":"text","code":"13 en décimal\n= 8 + 4 + 1\n= 1101 en binaire\n= D en hexadécimal (un seul chiffre, 13)","caption":"Le même nombre, trois écritures."},{"type":"note","text":"Un ko « marketing » (1000 octets) et un kio (1024 octets) ne sont pas la même chose. Pour un fichier, l'ordre de grandeur suffit presque toujours."}],"exercises":[{"type":"quiz","id":"info-binaire-q","prompt":"Combien de valeurs distinctes tient un octet ?","choices":["8","16","256","1024"],"answer":2,"explain":"8 bits donnent 2⁸ = 256 combinaisons, de 0 à 255."},{"type":"write","id":"info-binaire-w","prompt":"Écris la représentation binaire de 10, puis dis en une ligne ce que signifie le couleur #000000.","lang":"text","starter":"","solution":"10 en binaire : 1010\n#000000 : aucune lumière, noir","expected":"1010","mustInclude":["1010","#000000"]}]},{"id":"info-fichiers","title":"Fichiers : des octets avec un nom","summary":"Un fichier n'est pas son icône. C'est un nom, un chemin, et une suite d'octets.","minutes":10,"blocks":[{"type":"p","text":"Un **fichier** a un nom, un emplacement, et un contenu : une suite d'octets. L'extension (`.html`, `.jpg`, `.py`) est un indice pour les humains et pour certains programmes. Ce n'est pas une preuve. Renommer `photo.jpg` en `photo.txt` ne transforme pas l'image en texte : les octets restent ceux d'une image. Ouvre-les dans un éditeur, tu verras du charabia."},{"type":"p","text":"Un **chemin** dit où est le fichier. Un chemin absolu part de la racine : `/home/awa/cours/index.html` sur Linux et macOS, quelque chose comme `C:\\Users\\Awa\\cours\\index.html` sur Windows. Un chemin relatif part d'où tu es : `cours/index.html`, ou `../images/couv.jpg` pour remonter d'un dossier. Le programme qui ouvre le fichier n'a pas « le fichier sous les yeux ». Il a un chemin, et il va le lire."},{"type":"ul","items":["Un dossier est une liste de noms. Il ne « contient » pas magiquement les octets : il pointe vers eux.","Deux fichiers peuvent avoir le même nom s'ils ne sont pas dans le même dossier.","`index.html` à la racine d'un site est souvent la page d'accueil, par convention, pas par loi physique."]},{"type":"code","lang":"text","code":"projet/\n  index.html\n  style.css\n  images/\n    couv.jpg","caption":"Un petit projet. style.css est à côté d'index.html."},{"type":"caution","text":"Dans un terminal, supprimer un fichier ne passe en général pas par une corbeille. La commande retire le nom. Sans sauvegarde, le contenu est perdu pour toi."},{"type":"note","text":"Texte ou binaire : les deux sont des octets. La différence, c'est qu'un fichier texte suit un encodage (souvent UTF-8) qu'un éditeur sait afficher en lettres."}],"exercises":[{"type":"quiz","id":"info-fichiers-q","prompt":"Que se passe-t-il si tu renommes photo.jpg en photo.txt ?","choices":["L'image devient un texte descriptif","Les octets ne changent pas, seul l'indice du nom change","Le fichier est converti en HTML","Le disque refuse toujours"],"answer":1,"explain":"L'extension aide à choisir un programme. Elle ne réécrit pas le contenu."},{"type":"write","id":"info-fichiers-w","prompt":"Depuis le dossier projet, quel chemin relatif vise l'image images/couv.jpg ? Écris aussi le nom du fichier de la page d'accueil.","lang":"text","starter":"","solution":"images/couv.jpg\nindex.html","mustInclude":["images/couv.jpg","index.html"]}]},{"id":"info-os","title":"Système d'exploitation","summary":"Le programme qui garde les autres programmes, les fichiers et les utilisateurs.","minutes":10,"blocks":[{"type":"p","text":"Le **système d'exploitation** (Windows, macOS, Linux) est le programme qui démarre avant les autres et leur prête la machine. Il lance les **processus**, leur donne de la mémoire, les empêche de s'écraser les uns les autres, et leur ouvre les fichiers selon des **droits**. Ton éditeur est un processus. Ton navigateur en est un autre. Chacun croit avoir un ordinateur ; le système partage le vrai."},{"type":"p","text":"Un processus a une identité (un numéro, le PID), du code en mémoire, et des entrées-sorties. Quand tu lances `python notes.py`, le système crée un processus, charge Python, et lui donne le fichier. Quand le programme se termine, normalement ou par une erreur, le processus disparaît. La machine, elle, continue. C'est pour ça qu'un script qui plante ne « casse » pas l'ordinateur : il casse ce processus."},{"type":"ul","items":["Les onglets d'un navigateur moderne sont souvent isolés. L'un peut mourir sans fermer les autres.","Deux utilisateurs sur la même machine ne voient pas les mêmes fichiers, si les droits sont en place.","Linux est partout côté serveur. macOS et Windows dominent les ordinateurs de bureau. Les idées (processus, fichiers, droits) sont les mêmes."]},{"type":"code","lang":"text","code":"toi → système → processus « navigateur »\n                 → processus « éditeur »\n                 → processus « python notes.py »","caption":"Tu ne parles pas au processeur. Tu demandes au système."},{"type":"note","text":"Retiens le vocabulaire : système, processus, fichier, droit. Le terminal, plus loin, n'est qu'une façon précise de demander des choses au système."}],"exercises":[{"type":"quiz","id":"info-os-q","prompt":"Un script Python plante. Qu'est-ce qui s'arrête ?","choices":["Tout l'ordinateur, obligatoirement","Le processus de ce script","Le disque dur","Le réseau mondial"],"answer":1,"explain":"Le système isole les processus. Celui-ci se termine. Les autres continuent, sauf s'ils dépendaient de lui."},{"type":"write","id":"info-os-w","prompt":"Nomme trois processus qu'une personne a souvent en même temps sur son ordinateur, un par ligne.","lang":"text","starter":"","solution":"navigateur\néditeur\nterminal","mustInclude":["navigateur","éditeur"]}]}]},{"id":"info-reseau","title":"Le réseau","lessons":[{"id":"info-dns","title":"IP, ports et DNS","summary":"Une machine a une adresse. Un programme sur cette machine a un port. Un nom se traduit.","minutes":11,"blocks":[{"type":"p","text":"Une **adresse IP** désigne une machine sur un réseau, comme une adresse postale désigne un immeuble. IPv4 ressemble à `203.0.113.10`. Ce n'est pas un site, et ce n'est pas un secret absolu : beaucoup de services la voient passer. Ce qui compte, c'est de ne pas la confondre avec une URL, ni la coller dans un programme en croyant que « l'adresse ne change jamais »."},{"type":"p","text":"Un **port** est une porte sur cette machine. Plusieurs programmes peuvent écouter en même temps : un site sur le port 443, un autre outil sur le port 3000. La paire adresse + port vise un programme précis. `localhost` et `127.0.0.1` désignent ta propre machine. Un serveur lancé « en local » n'est pas sur Internet."},{"type":"h","text":"Quand tu tapes une adresse"},{"type":"ol","items":["Le **DNS** traduit le nom `atrium.example` en adresse IP. C'est un annuaire, pas le site lui-même.","Ta machine ouvre une connexion vers cette IP, sur le port 443 si l'adresse commence par `https`.","Elle envoie une requête : quel document, pour quel nom.","Le serveur répond : un statut, des en-têtes, un corps.","Le navigateur affiche ce corps, souvent du HTML, et redemande les images et les feuilles de style."]},{"type":"code","lang":"text","code":"atrium.example  --DNS-->  203.0.113.10\nconnexion vers 203.0.113.10 port 443\nGET /","caption":"Le nom n'est pas l'adresse. Le DNS fait le lien."},{"type":"caution","text":"Si le DNS est trompé, tu parles à la mauvaise machine tout en lisant le bon nom. D'où l'intérêt, ensuite, de HTTPS : le serveur doit prouver qu'il est bien celui du nom."}],"exercises":[{"type":"quiz","id":"info-dns-q","prompt":"À quoi sert le DNS ?","choices":["À chiffrer la page","À traduire un nom de domaine en adresse IP","À stocker les images","À écrire le HTML"],"answer":1,"explain":"Le DNS est l'annuaire. Le chiffrement, c'est TLS. Le HTML, c'est le document."},{"type":"write","id":"info-dns-w","prompt":"Écris ce que désignent localhost et le port 443, en deux lignes.","lang":"text","starter":"","solution":"localhost : cette machine\n443 : le port habituel de HTTPS","mustInclude":["localhost","443"]}]},{"id":"info-http","title":"HTTP, la langue du web","summary":"Une requête, une réponse, un statut. HTML n'est que le corps, souvent.","minutes":12,"blocks":[{"type":"p","text":"**HTTP** est le protocole des échanges du web. Le client envoie une **requête** : une méthode, un chemin, des en-têtes, et parfois un corps. Le serveur renvoie une **réponse** : un statut, des en-têtes, et un corps. Ce corps est souvent du HTML, parfois du JSON, parfois une image. HTTP n'est pas HTML. HTML est un format de document. HTTP est la façon de le demander."},{"type":"p","text":"Une URL comme `https://exemple.org/livres?tri=prix` se lit ainsi : `https` le protocole, `exemple.org` le nom, `/livres` le chemin, `tri=prix` la requête. Le chemin vise une ressource. Les paramètres précisent la demande. Rien de tout cela n'est « le code du site » : c'est l'adresse de la conversation."},{"type":"table","headers":["Statut","Sens pratique"],"rows":[["200","Ça a marché, voici le corps"],["201","Créé. Souvent après un POST"],["301 / 302","Va voir ailleurs (redirection)"],["400","La requête est mal formée"],["401","Il faut s'authentifier"],["403","Authentifié ou non, c'est interdit"],["404","Cette ressource n'existe pas"],["500","Le serveur a planté en traitant la demande"]]},{"type":"ul","items":["`GET` demande à lire. Une requête GET ne devrait pas supprimer ni débiter.","`POST` envoie un corps pour créer ou déclencher quelque chose.","Les en-têtes portent des métadonnées : type du contenu, langue, cookie, jeton."]},{"type":"code","lang":"http","code":"GET /livres?tri=prix HTTP/1.1\nHost: exemple.org\n\nHTTP/1.1 200 OK\nContent-Type: text/html; charset=utf-8","caption":"Une requête, puis le début d'une réponse. Le HTML viendrait ensuite."},{"type":"note","text":"Retiens 200, 404 et 500. Tu les verras dans l'onglet Réseau du navigateur bien avant de les produire toi-même."}],"exercises":[{"type":"quiz","id":"info-http-q","prompt":"Quelle différence entre HTTP et HTML ?","choices":["Ce sont deux noms du même langage","HTTP est l'échange, HTML est souvent le document échangé","HTML chiffre, HTTP dessine","HTTP ne sert que pour les images"],"answer":1,"explain":"HTTP transporte. Le corps peut être du HTML, du JSON, une image, autre chose."},{"type":"write","id":"info-http-w","prompt":"Pour une page introuvable et pour un succès, écris les deux statuts et leur sens, un par ligne.","lang":"text","starter":"","solution":"404 : la ressource n'existe pas\n200 : succès","mustInclude":["404","200"]}]},{"id":"info-https","title":"Le cadenas","summary":"HTTPS chiffre le trajet. Il ne promet pas que le site est honnête.","minutes":10,"blocks":[{"type":"p","text":"En HTTP nu, n'importe qui sur le chemin (un café, un proxy malveillant) peut lire et modifier les échanges. **HTTPS** ajoute **TLS** : le canal est chiffré, et le serveur présente un **certificat** qui lie une clé publique au nom du domaine. Ton navigateur vérifie ce certificat auprès d'autorités qu'il connaît déjà. Le cadenas veut dire : je parle bien à ce nom, et personne au milieu ne lit la conversation."},{"type":"p","text":"Le cadenas ne dit pas que le contenu est vrai, utile ou légal. Un site d'arnaque peut avoir un certificat valide. Il dit seulement que la liaison vers ce nom est protégée. Inversement, un cadenas absent sur une page de connexion est une raison de s'arrêter."},{"type":"h","text":"Empreinte, pas coffre"},{"type":"p","text":"Un **hachage** (SHA-256, par exemple) transforme des octets en une empreinte de taille fixe. La même entrée donne la même empreinte. On ne retrouve pas l'entrée à partir de l'empreinte. C'est pour ça qu'un mot de passe correctement stocké n'est pas le mot de passe : c'est une empreinte, souvent salée, que le serveur recalcule pour comparer. Ce n'est pas du chiffrement : chiffrer, c'est pouvoir déchiffrer avec une clé."},{"type":"code","lang":"text","code":"HTTP  : le facteur lit la carte\nHTTPS : enveloppe cachetée, le nom est vérifié\nhachage(\"secret\") → empreinte, sans retour en arrière","caption":"Trois idées à ne pas mélanger."},{"type":"caution","text":"Ne désactive jamais la vérification des certificats « pour que ça marche ». Tu viens d'accepter de parler à n'importe qui."}],"exercises":[{"type":"quiz","id":"info-https-q","prompt":"Que garantit le cadenas du navigateur ?","choices":["Que le site dit la vérité","Que l'échange avec ce nom est chiffré et que le certificat correspond","Que le mot de passe est stocké en clair","Que le HTML est valide"],"answer":1,"explain":"TLS protège le canal et l'identité du nom. Le contenu, lui, peut quand même être malhonnête."},{"type":"write","id":"info-https-w","prompt":"En une phrase chacun, distingue chiffrer et hacher.","lang":"text","starter":"","solution":"Chiffrer : rendre illisible, avec une clé pour revenir au texte.\nHacher : calculer une empreinte, sans moyen simple de revenir à l'entrée.","mustInclude":["Chiffrer","Hacher"]}]},{"id":"info-ou","title":"Où s'exécute le code","summary":"Le navigateur et le serveur ne voient pas la même chose. L'utilisateur peut tout modifier chez lui.","minutes":11,"blocks":[{"type":"p","text":"Du code **côté client** tourne dans le navigateur : HTML, CSS, JavaScript de la page. La personne devant l'écran peut le lire, le modifier, le rejouer. Du code **côté serveur** tourne sur une machine que tu contrôles : PHP, Node, Java, Python, la base SQL. L'utilisateur n'en voit que les effets, à travers HTTP."},{"type":"p","text":"Conséquence directe : un prix, un droit, un score « officiel » calculés seulement dans le JavaScript de la page ne valent rien. La personne change le script, ou envoie elle-même la requête. Le serveur doit revérifier. Le client sert à montrer, à guider, à réagir vite. Le serveur sert à décider ce qui est vrai pour tout le monde."},{"type":"table","headers":["","Client (navigateur)","Serveur"],"rows":[["Voit","La page, les clics, une partie du réseau","La requête, la base, les secrets"],["Langages ici","HTML, CSS, JavaScript","PHP, Node, Java, Python, SQL"],["L'utilisateur peut","Tout modifier","Seulement envoyer des requêtes"],["Secret possible ?","Non","Oui, s'il ne part pas dans la réponse"]]},{"type":"code","lang":"javascript","code":"const prix = 16;\ndocument.querySelector(\"#total\").textContent = prix + \" €\";","caption":"Afficher 16 € est honnête. Décider côté client que « c'est payé » ne l'est pas."},{"type":"note","text":"La suite du parcours commence exprès par ce que le navigateur montre : HTML, puis CSS, puis JavaScript. Le serveur viendra quand la page devra se souvenir de quelque chose de fiable."}],"exercises":[{"type":"quiz","id":"info-ou-q","prompt":"Où doit-on vérifier qu'une personne a le droit de supprimer un livre ?","choices":["Uniquement dans le JavaScript du bouton","Sur le serveur, au moment de la requête","Dans le CSS","Dans le nom du fichier"],"answer":1,"explain":"Le bouton peut être modifié ou contourné. La décision durable se prend là où la base est modifiée."},{"type":"write","id":"info-ou-w","prompt":"Classe ces quatre mots : HTML, SQL, CSS, PHP. Écris « client » ou « serveur » à côté de chacun.","lang":"text","starter":"","solution":"HTML : client\nCSS : client\nSQL : serveur\nPHP : serveur","mustInclude":["HTML","SQL","PHP","CSS"]}]}]},{"id":"info-texte","title":"Le texte et les données","lessons":[{"id":"info-utf8","title":"Unicode et UTF-8","summary":"Une lettre n'est pas un octet. L'encodage dit comment passer de l'un à l'autre.","minutes":10,"blocks":[{"type":"p","text":"**Unicode** numérote les caractères : le A latin, le é, le 你, l'espace. Ce numéro s'appelle un point de code. Il ne dit pas encore combien d'octets occupent le caractère dans un fichier. Ça, c'est l'**encodage**. **UTF-8** est celui du web et de presque tout code source aujourd'hui. Les caractères ASCII (anglais de base, chiffres, ponctuation simple) tiennent en un octet. Le `é` en tient deux. Beaucoup d'emoji en tiennent quatre."},{"type":"p","text":"Si un fichier UTF-8 est lu comme s'il était en Latin-1, les octets d'un `é` (`C3 A9`) s'affichent `Ã©`. C'est du **mojibake** : les octets sont souvent encore là, c'est l'interprétation qui est fausse. D'où la balise `<meta charset=\"UTF-8\">`, et d'où l'habitude d'enregistrer les sources en UTF-8 sans se poser la question à chaque fichier."},{"type":"ul","items":["Un `é` n'est pas « un octet qui a mal tourné ». C'est un caractère, encodé.","Dans certains langages, `length` compte des unités de code, pas des « lettres visibles ». Un emoji peut compter 2.","Mélanger deux encodages dans un projet produit des bugs qui n'apparaissent que sur les accents."]},{"type":"code","lang":"text","code":"é  en UTF-8     : C3 A9\nlu comme Latin-1 : Ã©\nbien déclaré     : é","caption":"Le même octet, deux lectures."},{"type":"caution","text":"Copier un texte depuis un PDF ou un mail peut glisser un encodage ou un caractère invisible. Si un mot « identique » ne se trouve pas dans la recherche, regarde les octets, pas seulement l'écran."}],"exercises":[{"type":"quiz","id":"info-utf8-q","prompt":"Pourquoi voit-on parfois Ã© à la place de é ?","choices":["Le clavier est en panne","De l'UTF-8 a été lu avec le mauvais encodage","HTML interdit les accents","Le DNS a traduit le caractère"],"answer":1,"explain":"Les octets de é en UTF-8, lus comme Latin-1, dessinent Ã©. Le fichier n'a pas « perdu » la lettre."},{"type":"write","id":"info-utf8-w","prompt":"Écris la balise meta qui déclare l'UTF-8, puis le mot qui nomme l'affichage cassé des accents.","lang":"text","starter":"","solution":"<meta charset=\"UTF-8\">\nmojibake","mustInclude":["UTF-8","mojibake"]}]},{"id":"info-json-intro","title":"Texte, CSV, JSON","summary":"Trois façons d'écrire des données. JSON sera le format des API.","minutes":11,"blocks":[{"type":"p","text":"Un fichier **texte** convient à un paragraphe. Dès que les données ont une forme — des livres, avec un titre et un prix — il faut un format que un programme relit sans deviner. Le **CSV** aligne une table : une ligne par enregistrement, des virgules ou des points-virgules entre les colonnes. Simple, fragile dès qu'un titre contient une virgule. **JSON** décrit des arbres : objets, tableaux, et des valeurs simples."},{"type":"p","text":"En JSON, un objet s'écrit entre accolades, un tableau entre crochets. Les clés sont des chaînes entre **guillemets doubles**. Les nombres s'écrivent tels quels, les booléens sont `true` et `false`, l'absence volontaire est `null`. Pas de commentaire. Pas de virgule après le dernier élément. Ce n'est pas du JavaScript, même si la ressemblance est voulue : `JSON.parse` refusera ce qu'un moteur JS accepterait parfois."},{"type":"code","lang":"json","code":"{\n  \"titre\": \"Beloved\",\n  \"auteur\": \"Morrison\",\n  \"prix\": 16,\n  \"dispo\": true\n}","caption":"Un livre. Les guillemets des clés ne sont pas optionnels."},{"type":"ul","items":["CSV : une table plate, facile à ouvrir dans un tableur.","JSON : des listes d'objets, des objets dans des objets. Le format des API web.","Binaire (image, vidéo, exécutable) : pas fait pour être édité à la main."]},{"type":"caution","text":"Une virgule finale, un guillemet simple, ou un commentaire `//` rendent un JSON invalide. L'erreur parlera de parse, pas de ton idée."},{"type":"note","text":"On reviendra sur JSON quand on appellera une API. Ici, il suffit de savoir le lire à voix haute."}],"exercises":[{"type":"quiz","id":"info-json-q","prompt":"Laquelle de ces lignes est du JSON valide pour un titre ?","choices":["titre: \"Beloved\"","{'titre': 'Beloved'}","{\"titre\": \"Beloved\"}","{\"titre\": \"Beloved\",}"],"answer":2,"explain":"Clés et chaînes entre guillemets doubles, pas de virgule finale, pas de guillemets simples."},{"type":"write","id":"info-json-w","prompt":"Écris un objet JSON avec un titre Beloved et un prix 16.","lang":"json","starter":"","solution":"{\n  \"titre\": \"Beloved\",\n  \"prix\": 16\n}","expected":"{\"titre\":\"Beloved\",\"prix\":16}","mustInclude":["\"titre\"","Beloved","\"prix\""]}]}]}]},"terminal":{"id":"terminal","title":"Terminal","kicker":"Outils","summary":"Naviguer, créer, chercher et enchaîner des commandes. Le quotidien du développement.","chapters":[{"id":"term-base","title":"Les commandes de tous les jours","lessons":[{"id":"term-pourquoi","title":"À quoi sert le terminal","summary":"Une ligne précise, que tu peux relire et rejouer. Pas un mur de boutons.","minutes":8,"blocks":[{"type":"p","text":"Le **terminal** est un texte : tu écris une commande, le système répond par du texte. Rien de mystérieux. L'intérêt, c'est la précision. « Le fichier dans ce dossier » devient `ls cours`. Tu peux copier la ligne, la relire dans trois mois, la mettre dans un script. Une interface de clics ne se recolle pas dans un fichier."},{"type":"p","text":"Ce parcours montre **bash**, le shell de Linux et le défaut de beaucoup de macOS (zsh comprend presque les mêmes commandes de base). L'invite affiche souvent un `$` ou un `%`. Tu ne tapes pas ce symbole : il marque l'endroit où ta commande commence. Windows a PowerShell, qui n'est pas bash. Les idées (dossier courant, commande, arguments) restent. Les noms changent."},{"type":"code","lang":"bash","code":"pwd\nls\ncd cours","caption":"Trois demandes : où je suis, ce qu'il y a, j'entre dans cours."},{"type":"ul","items":["Une commande a un nom (`ls`) et des arguments (`cours`, `-l`).","L'espace sépare les arguments. Un nom de fichier avec espace se met entre guillemets.","La flèche haut rappelle la commande précédente."]},{"type":"caution","text":"Ne colle pas une commande trouvée au hasard, surtout si elle contient `sudo`, `rm` ou un tuyau vers `sh`. Lis-la. Si tu ne sais pas nommer ce qu'elle fait, tu ne la lances pas."},{"type":"note","text":"Le terminal ne remplace pas l'éditeur. Il te déplace, il lance, il cherche. Le code, tu continues de l'écrire dans un fichier."}],"exercises":[{"type":"quiz","id":"term-pourquoi-q","prompt":"Que ne faut-il pas taper, dans les exemples de ce cours ?","choices":["Le nom de la commande","Le $ du début de ligne","Les arguments","Le nom du dossier"],"answer":1,"explain":"Le $ est l'invite, affichée par le shell. Ta commande commence après."},{"type":"write","id":"term-pourquoi-w","prompt":"Écris une commande qui demande le dossier courant, puis une qui liste son contenu. Une par ligne, sans le $.","lang":"bash","starter":"","solution":"pwd\nls","expected":"pwd\nls","mustInclude":["pwd","ls"]}]},{"id":"term-nav","title":"Se déplacer","summary":"pwd, ls, cd. Tout le reste suppose que tu sais où tu es.","minutes":10,"blocks":[{"type":"p","text":"Le shell a toujours un **dossier courant**. `pwd` l'affiche (print working directory). `ls` liste ce qu'il contient. `ls -la` ajoute les fichiers cachés (ceux qui commencent par un point) et des détails : droits, taille, date. `cd cours` entre dans `cours`. `cd ..` remonte d'un cran. `cd` seul revient dans ton dossier personnel, que `~` désigne aussi."},{"type":"p","text":"Les chemins relatifs partent d'ici. `cd ../images` remonte puis descend. Les chemins absolus partent de la racine `/`. Si `cd` répond « No such file or directory », le nom est faux ou tu n'es pas dans le dossier que tu crois : `pwd`, puis `ls`, puis seulement `cd`."},{"type":"code","lang":"bash","code":"pwd\nls\ncd cours\npwd\ncd ..\ncd ~","caption":"Entrer, vérifier, remonter, rentrer chez soi."},{"type":"ul","items":["La touche Tab complète un nom de fichier. Si rien ne se complète, le début est faux.","`ls -la` montre `.` (ici) et `..` (le parent). Ce ne sont pas des fichiers bizarres à supprimer.","Les noms sont sensibles à la casse sur Linux : `Cours` n'est pas `cours`."]},{"type":"note","text":"Avant une commande destructive, `pwd` puis `ls`. Deux secondes, et tu n'effaces pas le mauvais dossier."}],"exercises":[{"type":"quiz","id":"term-nav-q","prompt":"Que fait cd .. ?","choices":["Efface le dossier courant","Remonte au dossier parent","Liste les fichiers cachés","Revient à la racine /"],"answer":1,"explain":".. est le parent. cd .. quitte le dossier courant vers celui qui le contient."},{"type":"write","id":"term-nav-w","prompt":"Écris les commandes pour entrer dans Documents, lister, puis revenir au dossier personnel.","lang":"bash","starter":"","solution":"cd Documents\nls\ncd ~","mustInclude":["cd Documents","ls","cd ~"]}]},{"id":"term-fichiers","title":"Créer, copier, déplacer, supprimer","summary":"mkdir, touch, cp, mv, rm. La dernière ne demande pas confirmation.","minutes":10,"blocks":[{"type":"p","text":"`mkdir notes` crée un dossier. `touch brouillon.txt` crée un fichier vide, ou met à jour sa date s'il existe. `cp brouillon.txt copie.txt` copie. `cp -r notes notes-sauve` copie un dossier, parce que sans `-r` (récursif) `cp` refuse de descendre. `mv brouillon.txt archive.txt` renomme, ou déplace si la cible est un dossier : `mv archive.txt notes/`."},{"type":"p","text":"`rm fichier.txt` supprime un fichier. Il n'y a pas de corbeille. `rm -r dossier` supprime un dossier et ce qu'il contient. `rm -rf` force, y compris ce qui est protégé en écriture dans le dossier. Tu n'as presque jamais besoin de `-rf` au début. Tu n'as **jamais** besoin de `rm -rf /` ni de `rm -rf ~`. Ces formes effacent large, vite, sans retour."},{"type":"code","lang":"bash","code":"mkdir notes\ntouch notes/lire.txt\ncp notes/lire.txt notes/lire-copie.txt\nmv notes/lire-copie.txt notes/fait.txt","caption":"Créer, copier, renommer. Pas de rm dans l'exemple, volontairement."},{"type":"caution","text":"Si un tutoriel commence par `sudo rm -rf`, ferme-le. `sudo` exécute en administrateur. Combiné à `rm -rf`, une typo suffit."},{"type":"note","text":"Renommer, c'est `mv` vers un autre nom dans le même dossier. Déplacer, c'est le même outil vers un autre chemin."}],"exercises":[{"type":"quiz","id":"term-fichiers-q","prompt":"Quelle commande copie un dossier entier ?","choices":["cp dossier copie","cp -r dossier copie","mv -r dossier copie","touch -r dossier"],"answer":1,"explain":"cp tout seul ne descend pas dans un dossier. -r veut dire récursif."},{"type":"write","id":"term-fichiers-w","prompt":"Écris les commandes pour créer le dossier bibli et y mettre un fichier vide liste.txt. N'utilise pas rm.","lang":"bash","starter":"","solution":"mkdir bibli\ntouch bibli/liste.txt","mustInclude":["mkdir bibli","touch bibli/liste.txt"]}]},{"id":"term-lire","title":"Lire et chercher","summary":"Voir un fichier sans l'ouvrir dans un éditeur, et trouver une ligne dans un projet.","minutes":10,"blocks":[{"type":"p","text":"`cat fichier` affiche tout. Pratique pour vingt lignes, pénible pour mille. `head -n 20 fichier` montre le début, `tail -n 20 fichier` la fin — utile pour un journal d'erreurs. `less fichier` ouvre un lecteur : flèches pour descendre, `q` pour quitter. Tu ne modifies rien."},{"type":"p","text":"`grep motif fichier` affiche les lignes qui contiennent le motif. `grep -n TODO src/app.js` ajoute les numéros de ligne. `grep -r TODO src` cherche dans un dossier. Le motif est une expression régulière légère : un point vaut « n'importe quel caractère ». Pour chercher un point littéral, on l'échappe. Au début, cherche des mots simples."},{"type":"code","lang":"bash","code":"head -n 5 notes.txt\ngrep -n \"TODO\" src/app.js\ngrep -r \"console.log\" src","caption":"Le début d'un fichier, puis deux recherches."},{"type":"ul","items":["grep ne modifie pas les fichiers. Il affiche.","Si rien ne s'affiche, soit le mot n'y est pas, soit tu n'es pas dans le bon dossier.","Moins de résultats, c'est mieux : ajoute un dossier, un mot plus long."]},{"type":"note","text":"Chercher avant de réécrire. La moitié des « bugs introuvables » sont un mot déjà présent trois dossiers plus loin."}],"exercises":[{"type":"quiz","id":"term-lire-q","prompt":"Comment quitter less ?","choices":["Échap","q","Ctrl+S","rm"],"answer":1,"explain":"q quitte less. Le fichier n'est pas modifié."},{"type":"write","id":"term-lire-w","prompt":"Écris une commande grep qui cherche le mot TODO dans le dossier src, avec les numéros de ligne.","lang":"bash","starter":"","solution":"grep -n -r \"TODO\" src","hint":"-n numérote, -r descend dans les dossiers.","mustInclude":["grep","TODO","src"]}]},{"id":"term-droits","title":"Permissions","summary":"Qui peut lire, écrire, exécuter. Trois lettres, trois groupes.","minutes":11,"blocks":[{"type":"p","text":"Chaque fichier a des droits pour trois groupes : le **propriétaire**, le **groupe**, les **autres**. Pour chacun : `r` lire, `w` écrire, `x` exécuter (ou traverser, pour un dossier). `ls -l` commence par dix caractères. Le premier est le type (`-` fichier, `d` dossier). Les neuf suivants sont les droits, par paquets de trois."},{"type":"p","text":"`rw-r--r--` se lit : le propriétaire lit et écrit, les autres lisent seulement. C'est le `644` qu'on voit partout pour un fichier texte. `rwxr-xr-x` (`755`) : tout le monde peut exécuter, seul le propriétaire écrit. Un script `./sauve.sh` qui répond « Permission denied » a souvent simplement perdu le `x`. `chmod u+x sauve.sh` l'ajoute pour toi, sans ouvrir les droits au monde entier."},{"type":"table","headers":["Notation","Chiffres","Sens"],"rows":[["rw-r--r--","644","Tu écris, les autres lisent"],["rwxr-xr-x","755","Exécutable, écriture réservée au propriétaire"],["rwxrwxrwx","777","Tout le monde fait tout : à éviter"]]},{"type":"code","lang":"bash","code":"ls -l sauve.sh\nchmod u+x sauve.sh\n./sauve.sh","caption":"Rendre un script exécutable, puis le lancer."},{"type":"caution","text":"`chmod 777` « pour que ça marche » donne l'écriture à tout le monde, y compris sur un serveur. Corrige le droit précis qui manque."}],"exercises":[{"type":"quiz","id":"term-droits-q","prompt":"Un script ./outil.sh affiche Permission denied. Quelle correction est raisonnable ?","choices":["chmod 777 outil.sh","chmod u+x outil.sh","rm outil.sh","sudo rm -rf /"],"answer":1,"explain":"Il manque le droit d'exécution pour toi. u+x l'ajoute. 777 ouvre tout."},{"type":"write","id":"term-droits-w","prompt":"Écris la commande qui ajoute le droit d'exécution au propriétaire sur backup.sh.","lang":"bash","starter":"","solution":"chmod u+x backup.sh","mustInclude":["chmod u+x backup.sh"]}]}]},{"id":"term-suite","title":"Enchaîner","lessons":[{"id":"term-pipes","title":"Pipes et redirections","summary":"La sortie d'une commande devient l'entrée de la suivante, ou un fichier.","minutes":11,"blocks":[{"type":"p","text":"Une commande écrit sur la **sortie standard** (stdout) et ses erreurs sur la **sortie d'erreur** (stderr). Le terminal affiche les deux, mélangées à l'écran, mais ce sont deux tuyaux. `>` envoie stdout dans un fichier et **écrase** ce fichier. `>>` ajoute à la fin. `2>` envoie stderr. `programme > out.txt 2> err.txt` sépare le résultat et les erreurs."},{"type":"p","text":"Le **pipe** `|` branche stdout d'une commande sur stdin de la suivante. `ls | grep notes` : ls produit des noms, grep n'en garde que les lignes qui contiennent notes. Rien n'est un « objet ». C'est du texte, ligne par ligne. C'est à la fois la force et la limite : simple, et cassant si les noms contiennent des retours bizarres."},{"type":"p","text":"Une **variable** d'environnement est un nom et un texte, visibles des programmes lancés ensuite. `echo $HOME` affiche ton dossier personnel. `export PORT=3000` pose une variable pour les commandes qui suivent dans ce shell. Un programme lit `PORT` au lieu d'avoir le nombre écrit en dur. Les secrets, plus tard, passeront par là — pas dans le fichier de code."},{"type":"code","lang":"bash","code":"ls | grep \"notes\"\necho $HOME\nexport PORT=3000\necho \"Le serveur écoutera sur $PORT\"","caption":"Filtrer une liste, lire et poser une variable."},{"type":"caution","text":"`>` écrase sans demander. `echo salut > notes.txt` sur un fichier important le remplace par le mot salut."},{"type":"note","text":"Le pipe ne « comprend » pas tes fichiers. Il passe du texte. Si la commande de gauche échoue, regarde son message : il est souvent sur stderr, donc pas dans le pipe."}],"exercises":[{"type":"quiz","id":"term-pipes-q","prompt":"Quelle différence entre > et >> ?","choices":["> ajoute, >> écrase","> écrase le fichier, >> ajoute à la fin","Les deux suppriment le dossier",">> envoie les erreurs"],"answer":1,"explain":"> remplace le contenu. >> écrit à la suite."},{"type":"write","id":"term-pipes-w","prompt":"Écris une pipeline qui liste les fichiers et ne garde que les lignes contenant .js. Puis une ligne qui affiche HOME.","lang":"bash","starter":"","solution":"ls | grep \".js\"\necho $HOME","mustInclude":["ls | grep","echo $HOME"]}]},{"id":"term-process","title":"Processus, arrêt, SSH","summary":"Ctrl+C arrête le programme au premier plan. SSH ouvre un terminal ailleurs.","minutes":10,"blocks":[{"type":"p","text":"Quand tu lances une commande, elle occupe le **premier plan** du terminal jusqu'à la fin. Un serveur de développement ne « finit » pas : il attend. `Ctrl+C` lui envoie une interruption. Le processus s'arrête. Le terminal revient. Ça n'éteint pas l'ordinateur, et ça n'annule pas ce que le programme a déjà écrit sur le disque."},{"type":"p","text":"`ps` liste des processus. Tu n'as pas besoin de tout lire. L'idée : un programme qui tourne est un processus, avec un numéro. `Ctrl+C` vise celui qui est attaché à ton terminal. Fermer la fenêtre du terminal le coupe aussi, souvent plus brutalement."},{"type":"h","text":"Une autre machine"},{"type":"p","text":"**SSH** ouvre un terminal chiffré sur une autre machine : `ssh awa@203.0.113.10`. Tu tapes ensuite des commandes là-bas, pas ici. On préfère une **clé** à un mot de passe recopié partout. La clé privée reste sur ta machine. Tu ne la colles pas dans un chat, un dépôt, un ticket. La clé publique, elle, peut être installée sur le serveur."},{"type":"code","lang":"bash","code":"ssh awa@203.0.113.10\n# tu es sur l'autre machine\nexit","caption":"Entrer, travailler, revenir. Ctrl+C, lui, sert quand un programme local ne rend pas la main."},{"type":"caution","text":"Ctrl+C n'est pas « annuler le dernier rm ». L'interruption arrête un processus. Une suppression déjà faite reste faite."},{"type":"note","text":"Tu croiseras `&` pour lancer en arrière-plan, et plus tard des gestionnaires de processus. Au début : premier plan, Ctrl+C, exit."}],"exercises":[{"type":"quiz","id":"term-process-q","prompt":"Un serveur local tourne dans le terminal et tu veux le stopper. Que fais-tu ?","choices":["Tu éteins l'ordinateur","Ctrl+C dans ce terminal","rm -rf le dossier du projet","Tu changes l'adresse IP"],"answer":1,"explain":"Ctrl+C interrompt le processus au premier plan. Le reste de la machine continue."},{"type":"write","id":"term-process-w","prompt":"Écris une commande SSH vers awa@exemple.org, puis la commande qui affiche une variable nommée USER.","lang":"bash","starter":"","solution":"ssh awa@exemple.org\necho $USER","mustInclude":["ssh awa@exemple.org","echo $USER"]}]}]}]},"typescript":{"id":"typescript","title":"TypeScript","kicker":"Le web","summary":"Le JavaScript que le compilateur relit : types, unions, et erreurs utiles.","chapters":[{"id":"ts-1","title":"Typer","lessons":[{"id":"ts-pourquoi","title":"Pourquoi typer","summary":"Le compilateur lit le contrat avant que le navigateur ne lance la page.","minutes":9,"blocks":[{"type":"p","text":"JavaScript découvre beaucoup d'erreurs au moment de les exécuter : une fonction qui attend un nombre reçoit un texte, et l'erreur arrive chez l'utilisateur. **TypeScript** décrit les formes — ce paramètre est un nombre, ce champ s'appelle `titre` et c'est un texte — et un compilateur vérifie avant. Tu corriges dans l'éditeur, pas dans la console d'un visiteur."},{"type":"p","text":"TypeScript n'est pas ce que le navigateur exécute. Le compilateur **efface** les types et produit du JavaScript. Les types n'existent plus à l'exécution. Ils ne remplacent pas les tests, et ils ne rendent pas un calcul juste. Ils retirent des classes entières d'erreurs : le mauvais champ, l'argument inversé, le `null` oublié."},{"type":"code","lang":"typescript","code":"function prixAffiche(prix: number): string {\n  return prix.toFixed(2) + \" €\";\n}\n\nprixAffiche(16);\n// prixAffiche(\"16\")  ← le compilateur refuse","caption":"Le contrat est sur la fonction. L'appel faux est signalé sans lancer la page."},{"type":"ul","items":["Tu écris des fichiers `.ts` (ou `.tsx` dès qu'il y a du JSX).","Un outil (souvent Vite, ou `tsc`) produit le JavaScript.","Le reste du parcours web reste valable : HTML, CSS, le DOM. TypeScript s'ajoute au JavaScript."]},{"type":"note","text":"Si une erreur du compilateur t'agace, lis-la. La contourner avec `any` éteint l'outil sur cette zone."}],"exercises":[{"type":"quiz","id":"ts-pourquoi-q","prompt":"Que deviennent les types une fois le JavaScript produit ?","choices":["Ils sont vérifiés à chaque clic","Ils sont effacés : le JS n'en a plus","Ils chiffrent le fichier","Ils remplacent HTML"],"answer":1,"explain":"L'effacement veut dire : la vérification a eu lieu avant. Le navigateur reçoit du JavaScript ordinaire."},{"type":"write","id":"ts-pourquoi-w","prompt":"Écris une fonction bonjour(nom: string): string qui retourne Bonjour suivi du nom.","lang":"typescript","starter":"","solution":"function bonjour(nom: string): string {\n  return \"Bonjour \" + nom;\n}","mustInclude":["function bonjour","nom: string","string"]}]},{"id":"ts-bases","title":"Types de base","summary":"string, number, boolean, tableaux. any est un interrupteur, pas un type.","minutes":10,"blocks":[{"type":"p","text":"Les types de tous les jours : `string`, `number`, `boolean`, `null`, `undefined`. Un tableau de textes s'écrit `string[]`. Souvent tu n'annotes pas : si tu écris `let n = 3`, TypeScript infère `number`. Annote les frontières — paramètres, retours publics, objets que tu échanges — plutôt que chaque variable locale déjà évidente."},{"type":"p","text":"`any` dit : n'importe quoi, et tais-toi. Le compilateur arrête de t'aider sur cette valeur, et le silence se propage aux calculs qui en dépendent. `unknown` est le « je ne sais pas encore » honnête : tu ne peux rien en faire tant que tu n'as pas vérifié la forme. Préfère `unknown` pour une donnée qui arrive de l'extérieur."},{"type":"code","lang":"typescript","code":"let titre = \"Beloved\";\nlet prix: number = 16;\nconst auteurs: string[] = [\"Morrison\"];\n\nfunction lire(valeur: unknown) {\n  if (typeof valeur === \"string\") return valeur.toUpperCase();\n  return \"\";\n}","caption":"Inférence, annotation, et unknown qu'on raffine avant de l'utiliser."},{"type":"caution","text":"`any` fait taire l'erreur. Il ne la répare pas. Dans un exercice, si tu es tenté, c'est que le type de la donnée n'est pas encore nommé."},{"type":"note","text":"Il n'y a pas de type entier séparé dans le quotidien : `number` couvre 16 et 16.5. Les très grands entiers exacts sont un autre sujet (`bigint`)."}],"exercises":[{"type":"quiz","id":"ts-bases-q","prompt":"Pourquoi préférer unknown à any pour une réponse brute ?","choices":["unknown oblige à vérifier avant d'utiliser","unknown est plus rapide à l'exécution","any est interdit par le navigateur","unknown supprime les tableaux"],"answer":0,"explain":"Avec unknown, appeler une méthode est une erreur tant que tu n'as pas affiné le type. any laisse passer."},{"type":"write","id":"ts-bases-w","prompt":"Déclare un tableau titres de string contenant Beloved, et une fonction longueur(textes: string[]): number qui retourne textes.length.","lang":"typescript","starter":"","solution":"const titres: string[] = [\"Beloved\"];\nfunction longueur(textes: string[]): number {\n  return textes.length;\n}","mustInclude":["string[]","function longueur","textes.length"]}]},{"id":"ts-objets","title":"Objets, type et interface","summary":"Nommer la forme d'un livre une fois, la réutiliser partout.","minutes":11,"blocks":[{"type":"p","text":"Un objet anonyme ` { titre: \"Beloved\", prix: 16 } ` a déjà un type, inféré. Dès que cette forme circule — paramètre, retour, tableau — donne-lui un nom. `type Livre = { titre: string; prix: number }` et `interface Livre { titre: string; prix: number }` se ressemblent pour ce cas. Choisis-en un dans un projet et tiens-le. L'interface se prête bien aux objets et peut être étendue ; le type alias se prête bien aux unions. Au début, les deux nomment une forme."},{"type":"p","text":"Un champ optionnel s'écrit `auteur?: string`. Il peut manquer. Un littéral qui ajoute un champ non prévu (`isbn` alors que `Livre` ne le connaît pas) est signalé quand tu l'assignes directement à `Livre` : c'est souvent une typo. Un champ en lecture peut être marqué `readonly` si tu veux que le compilateur refuse `livre.prix = 0`."},{"type":"code","lang":"typescript","code":"type Livre = {\n  titre: string;\n  prix: number;\n  auteur?: string;\n};\n\nconst livre: Livre = { titre: \"Beloved\", prix: 16 };\nconst rayon: Livre[] = [livre];","caption":"La forme a un nom. Le tableau ne contient que des livres."},{"type":"note","text":"Nomme les formes qui franchissent une fonction. Laisse les objets locaux tout petits sans cérémonie."}],"exercises":[{"type":"quiz","id":"ts-objets-q","prompt":"Que veut dire auteur?: string ?","choices":["Le champ est privé","Le champ peut être absent","Le champ est un tableau","Le champ est obligatoire et numérique"],"answer":1,"explain":"Le ? rend le champ optionnel. S'il est présent, c'est un string."},{"type":"write","id":"ts-objets-w","prompt":"Déclare un type Livre avec titre string et prix number, puis une constante beloved de ce type.","lang":"typescript","starter":"","solution":"type Livre = { titre: string; prix: number };\nconst beloved: Livre = { titre: \"Beloved\", prix: 16 };","mustInclude":["type Livre","titre: string","prix: number"]}]},{"id":"ts-unions","title":"Unions et raffinement","summary":"Une valeur peut être de plusieurs formes. Tu vérifies avant d'agir.","minutes":11,"blocks":[{"type":"p","text":"Une **union** `string | number` dit : l'un ou l'autre. Tant que tu n'as pas distingué, tu ne peux appeler que ce qui marche pour les deux. `typeof x === \"string\"` **raffine** : dans cette branche, x est un string. Les unions de littéraux décrivent un choix fermé : `type Etat = \"brouillon\" | \"publie\"`. Écrire `\"publié\"` avec un accent, ou `\"fini\"`, est refusé. Le compilateur connaît la liste."},{"type":"p","text":"C'est le bon outil pour un statut, un résultat qui peut échouer (`Livre | null`), une fonction qui accepte un texte ou une liste de textes. Après le `if`, chaque branche a un type plus étroit. C'est du code ordinaire : la vérification sert à l'exécution **et** au compilateur."},{"type":"code","lang":"typescript","code":"type Etat = \"brouillon\" | \"publie\";\n\nfunction longueur(valeur: string | string[]): number {\n  if (typeof valeur === \"string\") return valeur.length;\n  return valeur.length;\n}\n\nfunction etiquette(etat: Etat): string {\n  if (etat === \"brouillon\") return \"Brouillon\";\n  return \"Publié\";\n}","caption":"typeof raffine l'union. Le littéral raffine l'état."},{"type":"caution","text":"Sans raffinement, `valeur.toUpperCase()` est refusé si `valeur` peut être un tableau. N'utilise pas `as string` pour faire taire ça : tu mentirais au compilateur."}],"exercises":[{"type":"quiz","id":"ts-unions-q","prompt":"À quoi sert typeof dans une union string | number ?","choices":["À convertir en nombre","À distinguer la branche et raffiner le type","À importer un module","À rendre le champ optionnel"],"answer":1,"explain":"Dans la branche string, les méthodes de string deviennent légitimes. Avant, non."},{"type":"write","id":"ts-unions-w","prompt":"Déclare type Etat = \"brouillon\" | \"publie\" et une fonction estPublie(etat: Etat): boolean.","lang":"typescript","starter":"","solution":"type Etat = \"brouillon\" | \"publie\";\nfunction estPublie(etat: Etat): boolean {\n  return etat === \"publie\";\n}","mustInclude":["\"brouillon\"","\"publie\"","function estPublie"]}]},{"id":"ts-fonctions","title":"Fonctions et un générique simple","summary":"Typer les paramètres. Le générique quand la forme dépend de l'appelant.","minutes":11,"blocks":[{"type":"p","text":"Une fonction se type par ses paramètres et, si le retour n'est pas évident, par son retour. Un paramètre optionnel finit par `?` et doit venir après les obligatoires : `function saluer(nom: string, poli?: boolean)`. Une valeur par défaut (`poli = false`) rend aussi le paramètre optionnel à l'appel."},{"type":"p","text":"Un **générique** sert quand la fonction ne choisit pas le type, l'appelant le choisit. `function premier<T>(items: T[]): T | undefined` marche pour des livres comme pour des nombres, et le retour reste lié à l'entrée. Si tu écris `premier` en renvoyant `any`, tu perds cette information. Un seul générique, une lettre `T`, suffit ici. Les génériques à trois paramètres et les contraintes viendront quand tu liras une bibliothèque, pas le premier jour."},{"type":"code","lang":"typescript","code":"function premier<T>(items: T[]): T | undefined {\n  return items[0];\n}\n\nconst titre = premier([\"Beloved\", \"Sula\"]);\nconst rien = premier<number>([]);","caption":"T est fixé par l'appel. Le tableau vide renvoie undefined, d'où l'union."},{"type":"note","text":"Si le corps fait `return items[0]`, le retour `T | undefined` est honnête : le tableau peut être vide. Ne promets pas `T` si tu n'as pas vérifié la longueur."}],"exercises":[{"type":"quiz","id":"ts-fonctions-q","prompt":"Pourquoi premier renvoie T | undefined ?","choices":["Parce que T est toujours undefined","Parce que le tableau peut être vide","Parce que les génériques sont des strings","Parce que TypeScript l'impose pour toute fonction"],"answer":1,"explain":"items[0] n'existe pas si la liste est vide. undefined fait partie du contrat."},{"type":"write","id":"ts-fonctions-w","prompt":"Écris function moyenne(notes: number[]): number qui somme puis divise par notes.length. Suppose la liste non vide.","lang":"typescript","starter":"","solution":"function moyenne(notes: number[]): number {\n  let somme = 0;\n  for (const note of notes) somme += note;\n  return somme / notes.length;\n}","mustInclude":["function moyenne","notes: number[]","number"]}]},{"id":"ts-erreurs","title":"Lire une erreur du compilateur","summary":"Le message dit le fichier, la ligne, et ce qu'il attendait. Commence par là.","minutes":10,"blocks":[{"type":"p","text":"Une erreur TypeScript a l'air longue parce qu'elle cite des types. La ligne utile est souvent la dernière qui nomme **ton** fichier, avec un numéro. `Type 'string' is not assignable to type 'number'` : tu as passé un texte là où un nombre est attendu. `Object is possibly 'undefined'` : tu utilises une valeur qui peut manquer, sans test. Tu ne colles pas le message dans un chat en espérant un sort. Tu ouvres la ligne."},{"type":"p","text":"`as Nombre` force le compilateur à te croire. C'est parfois nécessaire à la frontière d'une bibliothèque mal typée. C'est souvent un mensonge : la valeur n'est pas de ce type, et l'erreur reviendra à l'exécution, là où TypeScript ne peut plus rien. Avant `as`, essaie un `if`."},{"type":"code","lang":"typescript","code":"const notes = [12, 15, 9];\nconst premiere = notes.find((n) => n > 18);\n// premiere est number | undefined\nif (premiere !== undefined) {\n  console.log(premiere.toFixed(0));\n}","caption":"find peut ne rien trouver. On teste, on n'utilise pas as number."},{"type":"ul","items":["Lis le fichier et la ligne cités.","Reformule : « il attendait X, j'ai donné Y ».","Corrige la source ou ajoute le test qui manque.","`as` en dernier recours, avec une raison que tu peux dire à voix haute."]},{"type":"note","text":"Une erreur en cascade (trente lignes) est souvent une seule cause en haut. Corrige la première qui pointe vers ton code, puis relance."}],"exercises":[{"type":"quiz","id":"ts-erreurs-q","prompt":"Que faire en premier devant « Object is possibly undefined » ?","choices":["Ajouter as any","Tester que la valeur est bien là","Désinstaller TypeScript","Renommer le fichier en .js"],"answer":1,"explain":"Le compilateur a vu un cas manquant. Un if le traite pour de vrai. as any le cache."},{"type":"write","id":"ts-erreurs-w","prompt":"Écris un if qui n'utilise valeur.toUpperCase() que si valeur est un string. valeur est unknown.","lang":"typescript","starter":"","solution":"function cri(valeur: unknown): string {\n  if (typeof valeur === \"string\") return valeur.toUpperCase();\n  return \"\";\n}","mustInclude":["typeof valeur === \"string\"","toUpperCase"]}]},{"id":"ts-pratique","title":"strict, et le quotidien","summary":"Garde strict. Type les bords. Ne négocie pas avec any pour aller plus vite.","minutes":10,"blocks":[{"type":"p","text":"Un `tsconfig.json` à `\"strict\": true` active le lot de vérifications qui rendent TypeScript utile, dont `noImplicitAny` : un paramètre sans type et sans inférence est une erreur, pas un `any` silencieux. Désactiver `strict` pour « finir le projet » accumule des zones floues. Tu le paies au prochain changement. Laisse-le. Corrige les erreurs une par une."},{"type":"p","text":"Tu n'as pas à annoter chaque ligne. Type les **bords** : les fonctions exportées, les réponses d'API au moment où tu les vérifies, les props des composants. L'intérieur, l'inférence le fait. Un fichier `.js` peut cohabiter ; un fichier `.tsx` est un `.ts` qui contient du JSX. Le navigateur, lui, ne voit que le JavaScript émis."},{"type":"table","headers":["Réflexe","Pourquoi"],"rows":[["strict: true","Les null oubliés et les any implicites sont signalés"],["Typer les bords","L'inférence travaille à l'intérieur"],["unknown pour l'extérieur","Une API peut mentir, on vérifie"],["Pas de strict: false « temporaire »","Le temporaire reste"]]},{"type":"code","lang":"json","code":"{\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"target\": \"ES2022\",\n    \"module\": \"ESNext\"\n  }\n}","caption":"Le minimum à ne pas détricoter. Le reste dépend de l'outil (Vite, etc.)."},{"type":"note","text":"TypeScript ne prouve pas que ton programme fait le bon métier. Il prouve que les formes que tu as nommées se correspondent. Les exemples à la main restent nécessaires."}],"exercises":[{"type":"quiz","id":"ts-pratique-q","prompt":"Quel est l'intérêt de noImplicitAny ?","choices":["Un paramètre oublié ne devient pas any en silence","Le code s'exécute plus vite","Les fichiers CSS sont vérifiés","any devient un nombre"],"answer":0,"explain":"Sans type et sans inférence, le compilateur exige que tu nommes la forme au lieu d'inventer any."},{"type":"write","id":"ts-pratique-w","prompt":"Écris un extrait JSON de tsconfig avec compilerOptions et strict à true.","lang":"json","starter":"","solution":"{\n  \"compilerOptions\": {\n    \"strict\": true\n  }\n}","mustInclude":["\"strict\": true","compilerOptions"]}]}]}]},"react":{"id":"react","title":"React","kicker":"Le web","summary":"Composer une interface en composants, avec des données qui descendent et un état local.","chapters":[{"id":"react-1","title":"Composants","lessons":[{"id":"react-quoi","title":"Pourquoi des composants","summary":"Une fonction qui décrit un morceau d'interface à partir de données.","minutes":9,"blocks":[{"type":"p","text":"Une page construite en collant des bouts de HTML avec `innerHTML` devient illisible dès qu'elle bouge. **React** propose de nommer les morceaux. Un **composant** est une fonction qui reçoit des données et retourne l'interface. `LivreCard` décrit une fiche. La page est un assemblage de fiches, pas une longue chaîne de `div`."},{"type":"p","text":"React ne remplace ni HTML ni CSS. Il organise le JavaScript qui produit le HTML, et il met à jour le document quand les données changent. Tu décris le résultat voulu. La bibliothèque ajuste le DOM. Les composants de ce parcours sont des **fonctions**. Pas de classes. JSX, le langage dans le langage, est compilé : tu ne colles pas un composant dans une balise `<script>` nue. Vite, ou un outil du même genre, fait cette compilation."},{"type":"code","lang":"tsx","code":"function LivreCard() {\n  return <article><h2>Beloved</h2><p>16 €</p></article>;\n}","caption":"Le nom dit le rôle. Le retour dit ce qui s'affiche."},{"type":"note","text":"Si tu ne sais pas nommer le composant autrement que `Div3`, ce n'est pas encore un composant. Cherche le nom métier : fiche, filtre, liste."}],"exercises":[{"type":"quiz","id":"react-quoi-q","prompt":"Qu'est-ce qu'un composant, ici ?","choices":["Un fichier CSS","Une fonction qui décrit un morceau d'interface","Un serveur HTTP","Une balise HTML nouvelle du navigateur"],"answer":1,"explain":"Fonction, données en entrée, interface en sortie. Le navigateur reçoit toujours du HTML."},{"type":"write","id":"react-quoi-w","prompt":"Écris une fonction Salut qui retourne un h1 Bonjour en JSX.","lang":"tsx","starter":"","solution":"function Salut() {\n  return <h1>Bonjour</h1>;\n}","mustInclude":["function Salut","<h1>"]}]},{"id":"react-jsx","title":"JSX","summary":"Ça ressemble à du HTML. C'est une expression JavaScript.","minutes":10,"blocks":[{"type":"p","text":"**JSX** écrit des balises au milieu du JavaScript. `return <h1>Bonjour</h1>` n'est pas une chaîne. C'est une expression, compilée en appel de fonction. Tu peux la ranger dans une variable, la retourner, la mettre dans un tableau. Les accolades `{titre}` insèrent une valeur JavaScript. Le texte sans accolades est du texte."},{"type":"ul","items":["`class` devient `className`. `for` sur un label devient `htmlFor`.","Les événements sont des camelCase : `onClick`, `onChange`.","Un composant retourne un seul nœud parent, ou un fragment `<>...</>`.","Un commentaire dans le JSX s'écrit `{/* ainsi */}`.","Tu fermes les balises vides : `<input />`."]},{"type":"code","lang":"tsx","code":"function Titre({ titre }: { titre: string }) {\n  return <h1 className=\"livre\">{titre}</h1>;\n}","caption":"className, pas class. La valeur vient des accolades."},{"type":"caution","text":"Écrire `class=` dans du JSX est une erreur de compilation, pas un style qui « ne se voit pas ». Le message parlera de className."}],"exercises":[{"type":"quiz","id":"react-jsx-q","prompt":"Comment poser une classe CSS en JSX ?","choices":["class=","className=","css=","style-class="],"answer":1,"explain":"class est un mot réservé en JavaScript. JSX utilise className."},{"type":"write","id":"react-jsx-w","prompt":"Écris une fonction Prix qui reçoit prix: number et retourne un p avec className total.","lang":"tsx","starter":"","solution":"function Prix({ prix }: { prix: number }) {\n  return <p className=\"total\">{prix} €</p>;\n}","mustInclude":["function Prix","className"]}]},{"id":"react-props","title":"Les props descendent","summary":"Le parent possède les données. L'enfant les affiche. Il ne les réécrit pas.","minutes":10,"blocks":[{"type":"p","text":"Les **props** sont les arguments du composant. Elles descendent : le parent décide, l'enfant reçoit. `function Livre({ titre, prix }: { titre: string; prix: number })` lit deux champs. L'appel s'écrit `<Livre titre=\"Beloved\" prix={16} />`. `titre` est une chaîne dans la balise, `prix` est une expression, d'où les accolades."},{"type":"p","text":"On ne modifie pas une prop. Si le prix change, le parent passe un nouveau prix, et React rappelle le composant. Muter `props.prix = 0` casse ce contrat : le parent ne le saurait pas, et React peut réutiliser l'objet. Tu traites les props comme immuables."},{"type":"code","lang":"tsx","code":"function Livre({ titre, prix }: { titre: string; prix: number }) {\n  return (\n    <article>\n      <h2>{titre}</h2>\n      <p>{prix} €</p>\n    </article>\n  );\n}\n\nexport function Rayon() {\n  return <Livre titre=\"Beloved\" prix={16} />;\n}","caption":"Rayon possède les données. Livre les montre."},{"type":"note","text":"Si deux composants ont besoin de la même donnée, elle vit dans leur parent commun, pas dans une copie de chaque côté."}],"exercises":[{"type":"quiz","id":"react-props-q","prompt":"Qui doit changer le prix affiché par Livre ?","choices":["Livre, en modifiant la prop","Le parent, en passant une nouvelle prop","Le CSS","Le navigateur, tout seul"],"answer":1,"explain":"Les données descendent. Le parent recalcule et repasse le prix. L'enfant reste une fonction d'affichage."},{"type":"write","id":"react-props-w","prompt":"Écris function Prix({ montant }: { montant: number }) qui retourne un p avec le montant et le symbole €.","lang":"tsx","starter":"","solution":"function Prix({ montant }: { montant: number }) {\n  return <p>{montant} €</p>;\n}","mustInclude":["function Prix","montant"]}]},{"id":"react-state","title":"État et événements","summary":"useState garde une valeur entre deux affichages. On remplace, on ne mute pas.","minutes":12,"blocks":[{"type":"p","text":"Une prop vient du parent. Un **état** appartient au composant. `const [n, setN] = useState(0)` crée une valeur et une fonction pour la remplacer. Appeler `setN` redessine le composant avec la nouvelle valeur. L'affichage est ` <p>{n}</p> `, le clic est `onClick={() => setN(n + 1)}`. Quand la nouvelle valeur dépend de l'ancienne et que plusieurs mises à jour s'enchaînent, la forme sûre est `setN(v => v + 1)`."},{"type":"p","text":"L'état vit dans le composant le plus bas qui en a besoin, ou plus haut s'il faut le partager. Un champ de recherche utilisé par la liste vit à côté de la liste, pas dans chaque fiche."},{"type":"code","lang":"tsx","code":"import { useState } from \"react\";\n\nfunction Compteur() {\n  const [n, setN] = useState(0);\n  return <button onClick={() => setN((v) => v + 1)}>{n}</button>;\n}","caption":"Chaque clic remplace n. Le bouton affiche la valeur courante."},{"type":"caution","text":"Ne fais pas `items.push(x); setItems(items)`. Tu as muté le tableau puis rendu le même tableau : React peut ne rien voir. Remplace : `setItems([...items, x])`."},{"type":"note","text":"L'état n'est pas une variable globale. Deux compteurs ont deux états, sauf si tu as volontairement partagé le même."}],"exercises":[{"type":"quiz","id":"react-state-q","prompt":"Pourquoi [...items, x] plutôt que items.push(x) ?","choices":["push est interdit en JavaScript","On fournit un nouveau tableau au lieu de muter l'ancien","Le spread trie la liste","useState exige trois éléments"],"answer":1,"explain":"setState compare. Un tableau muté sur place est le même objet. Une copie est un nouveau état."},{"type":"write","id":"react-state-w","prompt":"Écris un composant Compteur avec useState, un bouton, et setN(v => v + 1).","lang":"tsx","starter":"","solution":"import { useState } from \"react\";\n\nfunction Compteur() {\n  const [n, setN] = useState(0);\n  return <button onClick={() => setN((v) => v + 1)}>{n}</button>;\n}","mustInclude":["useState","setN","onClick"]}]},{"id":"react-listes","title":"Listes et clés","summary":"map rend un tableau d'éléments. La clé dit lequel est lequel.","minutes":10,"blocks":[{"type":"p","text":"Pour afficher des livres, tu **transformes** le tableau : `livres.map(livre => ...)`. Le résultat est un tableau d'éléments, que JSX sait afficher. Chaque élément a une prop `key`. React s'en sert pour reconnaître un élément d'un affichage à l'autre : celui-ci a bougé, celui-là est nouveau, celui-là a disparu."},{"type":"p","text":"La clé est **stable** et **unique** parmi les frères. L'`id` du livre convient. L'index du tableau convient seulement si la liste ne change jamais d'ordre, ne perd rien, ne s'insère pas. Sinon React associe l'état interne au mauvais élément : un champ de saisie « suit » la mauvaise ligne. La clé ne s'affiche pas. Ce n'est pas un attribut HTML."},{"type":"code","lang":"tsx","code":"function Liste({ livres }: { livres: { id: number; titre: string }[] }) {\n  return (\n    <ul>\n      {livres.map((livre) => (\n        <li key={livre.id}>{livre.titre}</li>\n      ))}\n    </ul>\n  );\n}","caption":"key={livre.id}, pas key={l'index}."},{"type":"caution","text":"key={index} sur une liste qu'on réordonne ou qu'on filtre est le bug classique : l'affichage a l'air presque juste, l'état est faux."}],"exercises":[{"type":"quiz","id":"react-listes-q","prompt":"Quelle clé choisir pour une liste de livres que l'on peut supprimer ?","choices":["L'index du map","livre.id","Math.random() à chaque rendu","Le mot livre"],"answer":1,"explain":"L'id ne change pas quand la liste bouge. L'index change. random() change à chaque affichage et force tout à se recréer."},{"type":"write","id":"react-listes-w","prompt":"Écris un map qui retourne un li avec key={livre.id} et le titre.","lang":"tsx","starter":"","solution":"function Liste({ livres }: { livres: { id: number; titre: string }[] }) {\n  return (\n    <ul>\n      {livres.map((livre) => (\n        <li key={livre.id}>{livre.titre}</li>\n      ))}\n    </ul>\n  );\n}","mustInclude":[".map","key={livre.id}"]}]},{"id":"react-formes","title":"Formulaires contrôlés","summary":"La valeur affichée et l'état sont la même variable.","minutes":11,"blocks":[{"type":"p","text":"Un champ **contrôlé** affiche l'état React : `value={titre}` et `onChange={(e) => setTitre(e.target.value)}`. Les deux vont ensemble. L'état est la source. L'input n'a pas une deuxième copie secrète. Au submit, tu lis l'état, pas « ce qu'il y a dans le DOM ». `event.preventDefault()` empêche le navigateur de recharger la page."},{"type":"code","lang":"tsx","code":"function Ajout() {\n  const [titre, setTitre] = useState(\"\");\n  function envoyer(event: React.FormEvent) {\n    event.preventDefault();\n    if (!titre.trim()) return;\n    console.log(titre.trim());\n    setTitre(\"\");\n  }\n  return (\n    <form onSubmit={envoyer}>\n      <label htmlFor=\"titre\">Titre</label>\n      <input id=\"titre\" value={titre} onChange={(e) => setTitre(e.target.value)} />\n      <button>Ajouter</button>\n    </form>\n  );\n}","caption":"value et onChange forment la paire. Le label vise l'id."},{"type":"caution","text":"Un input avec onChange mais sans value, ou l'inverse, n'est pas contrôlé de façon cohérente. Écris les deux, ou aucun des deux (champ libre, non contrôlé)."},{"type":"note","text":"Vider le champ après un envoi réussi, c'est `setTitre(\"\")`. L'input suit, parce qu'il affiche l'état."}],"exercises":[{"type":"quiz","id":"react-formes-q","prompt":"Pourquoi preventDefault sur le submit ?","choices":["Pour vider la base SQL","Pour empêcher le rechargement de la page","Pour désactiver onChange","Parce que JSX l'exige toujours, même sans formulaire"],"answer":1,"explain":"Le comportement par défaut d'un formulaire est une navigation. On la coupe pour rester dans l'application."},{"type":"write","id":"react-formes-w","prompt":"Écris un input contrôlé : value={titre} et onChange qui appelle setTitre avec e.target.value.","lang":"tsx","starter":"","solution":"function Champ() {\n  const [titre, setTitre] = useState(\"\");\n  return <input value={titre} onChange={(e) => setTitre(e.target.value)} />;\n}","mustInclude":["value={titre}","setTitre","onChange"]}]},{"id":"react-effets","title":"Les effets, rarement","summary":"useEffect synchronise avec l'extérieur. Il ne sert pas à calculer un affichage.","minutes":12,"blocks":[{"type":"p","text":"Pendant le rendu, tu **calcules**. Le nombre de livres affichés est `livres.length`. Ce n'est pas un effet. Un **effet** sert à parler au monde extérieur, puis à nettoyer : changer `document.title`, s'abonner, lancer une requête. `useEffect(() => { ... return () => { /* nettoyage */ } }, [dependances])`. Le tableau liste ce que l'effet lit. S'il est vide, l'effet court après le premier affichage seulement."},{"type":"p","text":"Le piège des débutants : mettre dans un effet un `setState` qui change une dépendance de ce même effet. L'affichage relance l'effet, qui relance l'affichage. Boucle. Autre piège : recopier des props dans un état « pour les avoir sous la main ». Si tu peux le calculer pendant le rendu, calcule-le pendant le rendu."},{"type":"code","lang":"tsx","code":"useEffect(() => {\n  document.title = titre + \" — Atrium\";\n}, [titre]);","caption":"Le titre de l'onglet suit une donnée. Pas de setState là-dedans."},{"type":"caution","text":"Un fetch dans un effet doit ignorer la réponse si le composant a été démonté ou si la requête est périmée. Au minimum, un indicateur `ignore` dans le nettoyage, sinon tu affiches le résultat d'un ancien appel."},{"type":"note","text":"Si tu hésites entre un calcul et un effet, commence par le calcul. Ajoute l'effet seulement quand il faut sortir du rendu."}],"exercises":[{"type":"quiz","id":"react-effets-q","prompt":"Où calculer le nombre de livres filtrés ?","choices":["Dans un useEffect qui fait setNombre","Pendant le rendu, dans une const","Dans le CSS","Dans un setInterval"],"answer":1,"explain":"C'est une valeur dérivée. const n = livres.length pendant le rendu. L'effet est inutile et peut boucler."},{"type":"write","id":"react-effets-w","prompt":"Écris un useEffect qui pose document.title à partir de titre, avec [titre] en dépendances.","lang":"tsx","starter":"const titre = \"Livres\";\n","solution":"useEffect(() => {\n  document.title = titre + \" — Atrium\";\n}, [titre]);","mustInclude":["useEffect","document.title","[titre]"]}]},{"id":"react-decouper","title":"Découper une interface","summary":"Des rectangles, des données, qui possède l'état.","minutes":10,"blocks":[{"type":"p","text":"Devant une maquette, dessine les rectangles et nomme-les avant d'écrire des balises. Une page bibliothèque : un `Filtre` (le champ), une `Liste`, et pour chaque livre une `LivreCard`. Les données : un tableau de livres, le texte du filtre. Qui possède l'état ? Le parent `Bibliotheque`, parce que le filtre et la liste doivent voir le même texte. `LivreCard` ne reçoit qu'un livre. Elle ne connaît pas le filtre."},{"type":"p","text":"Un composant qui approche les deux cents lignes mélange en général deux responsabilités. Tu le coupes au nom que tu viens de trouver. Tu ne coupes pas pour le plaisir : un bouton de trois lignes n'a pas besoin d'un fichier."},{"type":"code","lang":"tsx","code":"function Bibliotheque() {\n  const [filtre, setFiltre] = useState(\"\");\n  const visibles = livres.filter((l) => l.titre.toLowerCase().includes(filtre.toLowerCase()));\n  return (\n    <>\n      <Filtre valeur={filtre} onChange={setFiltre} />\n      <Liste livres={visibles} />\n    </>\n  );\n}","caption":"L'état du filtre est en haut. La liste reçoit déjà le résultat."},{"type":"note","text":"Descendre les données, remonter les événements (`onChange`). Si tu commences à importer un état « global » pour un champ, attends d'en avoir vraiment besoin."}],"exercises":[{"type":"quiz","id":"react-decouper-q","prompt":"Où vit le texte du filtre si la liste doit s'en servir ?","choices":["Dans LivreCard","Dans le parent commun au filtre et à la liste","Dans le fichier CSS","Dans chaque li"],"answer":1,"explain":"L'état se place au plus bas ancêtre commun de ceux qui le lisent."},{"type":"write","id":"react-decouper-w","prompt":"Nomme dans un commentaire trois composants pour une page de livres : le parent, la fiche, le filtre. Le mot Livre doit apparaître.","lang":"text","starter":"","solution":"Bibliotheque : la page\nLivreCard : une fiche\nFiltre : le champ de recherche","mustInclude":["Livre"]}]}]}]},"node":{"id":"node","title":"Node.js","kicker":"Le web","summary":"JavaScript hors du navigateur : modules, fichiers, et un petit serveur.","chapters":[{"id":"node-1","title":"Côté serveur","lessons":[{"id":"node-quoi","title":"Node n'est pas le navigateur","summary":"Le même langage, d'autres objets. Pas de document, un processus.","minutes":9,"blocks":[{"type":"p","text":"**Node.js** exécute du JavaScript hors du navigateur. Il n'y a pas de `document`, pas de `window`, pas de page. Il y a un processus, des fichiers, le réseau, et `process`. Tu lances `node serveur.js`. Le programme tourne jusqu'à la fin du script, ou jusqu'à ce qu'il écoute — un serveur ne se termine pas tout seul."},{"type":"p","text":"Le langage est le même : `const`, les fonctions, les promesses. Les bibliothèques ne le sont pas. `document.querySelector` dans Node plante, parce que cet objet n'existe pas. Inversement, `fs` pour lire un fichier n'existe pas dans la page. Partager un fichier entre client et serveur se décide : un module sans `document` et sans `fs` peut vivre des deux côtés. Un module qui lit le disque, non."},{"type":"code","lang":"bash","code":"node --version\nnode bonjour.js","caption":"Une version LTS, puis un fichier. Rien à voir avec un onglet."},{"type":"note","text":"Choisis une version LTS pour un projet qui doit durer. L'affichage de `node --version` se note dans le README, pour que la personne suivante ait la même."}],"exercises":[{"type":"quiz","id":"node-quoi-q","prompt":"Pourquoi document.querySelector plante dans Node ?","choices":["Node interdit les fonctions","Il n'y a pas de document","querySelector est réservé à Python","Il faut un point-virgule de plus"],"answer":1,"explain":"Node n'affiche pas une page. L'API du DOM n'est pas là. C'est un autre environnement."},{"type":"write","id":"node-quoi-w","prompt":"Écris un fichier JS qui affiche Bonjour Node avec console.log. Une ligne suffit dans la solution.","lang":"javascript","starter":"","solution":"console.log(\"Bonjour Node\");","expected":"Bonjour Node","mustInclude":["console.log"]}]},{"id":"node-modules","title":"Modules et npm","summary":"package.json décrit le projet. node_modules ne se commit pas.","minutes":10,"blocks":[{"type":"p","text":"`package.json` nomme le projet, dit que tu utilises les modules ES (`\"type\": \"module\"`), et range les scripts : `\"start\": \"node serveur.js\"`. Tu lances alors `npm start`. Les dépendances s'installent avec `npm install nom-du-paquet`. npm télécharge le paquet et ce dont il a besoin dans `node_modules`, et écrit les versions exactes dans `package-lock.json`."},{"type":"p","text":"Tu commits `package.json` et `package-lock.json`. Tu ne commits pas `node_modules` : c'est lourd, et `npm install` le reconstruit. Une dépendance est du code écrit par quelqu'un d'autre, exécuté chez toi. Pour un paquet obscur qui demande tes fichiers, tu t'arrêtes et tu lis. Le nom connu n'est pas une revue, mais le nom inconnu collé depuis un forum en est encore moins une."},{"type":"code","lang":"javascript","code":"import { creerServeur } from \"./serveur.js\";\n\ncreerServeur();","caption":"ESM : import, export, et l'extension .js dans le chemin relatif est exigée par Node."},{"type":"caution","text":"Oublier `node_modules` dans `.gitignore` pousse des milliers de fichiers. Ajoute-le avant le premier commit, pas après."},{"type":"note","text":"Le lockfile fixe les versions. Sans lui, deux installations à deux dates ne donnent pas le même arbre."}],"exercises":[{"type":"quiz","id":"node-modules-q","prompt":"Lequel de ces fichiers ne se commit pas ?","choices":["package.json","package-lock.json","node_modules","serveur.js"],"answer":2,"explain":"node_modules se régénère. Le lockfile, lui, se garde pour figer les versions."},{"type":"write","id":"node-modules-w","prompt":"Écris un import ESM depuis ./livres.js de la fonction lister, puis un appel.","lang":"javascript","starter":"","solution":"import { lister } from \"./livres.js\";\nlister();","mustInclude":["import { lister }","./livres.js"]}]},{"id":"node-fichiers","title":"Lire et écrire un fichier","summary":"fs/promises, utf8, et des chemins qui ne remontent pas en douce.","minutes":11,"blocks":[{"type":"p","text":"Pour lire sans bloquer le style du code, `node:fs/promises` offre des fonctions qui renvoient des promesses. `await readFile(\"livres.json\", \"utf8\")` rend un texte. Sans `\"utf8\"`, tu obtiens un buffer d'octets. `writeFile` écrit. `process.cwd()` est le dossier depuis lequel tu as lancé `node`, pas forcément le dossier du fichier source. Un chemin relatif part de là. C'est une source classique de « fichier introuvable »."},{"type":"code","lang":"javascript","code":"import { readFile } from \"node:fs/promises\";\n\nconst texte = await readFile(\"livres.json\", \"utf8\");\nconst livres = JSON.parse(texte);\nconsole.log(livres.length);","caption":"Le fichier est du texte, puis du JSON. Les deux erreurs sont différentes."},{"type":"ul","items":["Fichier absent : l'erreur a le code ENOENT.","JSON invalide : c'est JSON.parse qui lève, pas readFile.","Les deux se capturent, les messages pour l'humain diffèrent."]},{"type":"caution","text":"Ne colle pas une saisie utilisateur dans un chemin. `../../etc/passwd` est la traversée classique. Résous le chemin et vérifie qu'il reste dans le dossier autorisé, ou n'accepte qu'un identifiant, pas un chemin."}],"exercises":[{"type":"quiz","id":"node-fichiers-q","prompt":"Que se passe-t-il si tu oublies \"utf8\" dans readFile ?","choices":["Le fichier est supprimé","Tu reçois des octets, pas un texte","JSON.parse est appelé tout seul","Node refuse de démarrer"],"answer":1,"explain":"Sans encodage, la valeur est un Buffer. Le parse JSON sur ce buffer peut marcher parfois, et te surprendre le reste du temps. Demande le texte."},{"type":"write","id":"node-fichiers-w","prompt":"Importe readFile depuis node:fs/promises et lis livres.json en utf8.","lang":"javascript","starter":"","solution":"import { readFile } from \"node:fs/promises\";\nconst texte = await readFile(\"li
