tContent pour le titre, pas une concaténation dans innerHTML avec la saisie."},{"type":"quiz","id":"projet-livres-q","prompt":"Pourquoi passer les deux côtés du filtre en toLowerCase ?","choices":["Pour traduire le titre","Pour que la casse de la saisie ne change pas le résultat","Parce que includes exige des majuscules","Pour trier par prix"],"answer":1,"explain":"« bel » et « Beloved » doivent se rencontrer. Sans normaliser, la comparaison est stricte."}]},{"id":"projet-debug","title":"Projet : réparer une page","summary":"Lire la console, changer une chose, recommencer. Le bug de l'exercice n'est pas celui de l'exemple.","minutes":15,"blocks":[{"type":"p","text":"Quand « rien ne se passe », la première lecture est la **console**, pas le CSS au hasard. Une erreur de syntaxe empêche souvent tout le script. Une erreur « null n'a pas de addEventListener » veut dire que `querySelector` n'a rien trouvé : l'id dans le JS et l'id dans le HTML ne sont pas les mêmes. Un bouton qui ne fait rien sans erreur est souvent un écouteur posé sur le mauvais élément, ou un `preventDefault` oublié qui recharge la page et efface l'effet."},{"type":"h","text":"Méthode"},{"type":"ul","items":["Reproduire. Noter ce que tu attendais et ce que tu observes.","Lire le premier message de la console, fichier et ligne.","Changer **une** chose. Recharger. Si ce n'est pas ça, revenir.","Ajouter un `console.log` juste avant la ligne suspecte, pas dix."]},{"type":"code","lang":"javascript","code":"const form = document.querySelector(\"#formulaire\");\nconsole.log(form);\nform.addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n});","caption":"Si console.log affiche null, l'écouteur ne peut pas s'attacher. On corrige le sélecteur, pas le preventDefault."},{"type":"note","text":"L'exercice à droite a un autre bug que l'exemple : le script cherche `#bouton` alors que le bouton s'appelle `#ajouter`. La console le dira si tu lances."}],"exercises":[{"type":"web","id":"projet-debug-web","prompt":"Le bouton devrait ajouter le titre dans la liste. Rien ne se passe, ou la console se plaint. Corrige le JavaScript. Ne change qu'un identifiant.","files":["html","css","js"],"starter":{"html":"<label for=\"titre\">Titre</label>\n<input id=\"titre\">\n<button id=\"ajouter\" type=\"button\">Ajouter</button>\n<ul id=\"liste\"></ul>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }","js":"const bouton = document.querySelector(\"#bouton\");\nconst titre = document.querySelector(\"#titre\");\nconst liste = document.querySelector(\"#liste\");\n\nbouton.addEventListener(\"click\", () => {\n  const li = document.createElement(\"li\");\n  li.textContent = titre.value;\n  liste.append(li);\n  titre.value = \"\";\n});"},"solution":{"html":"<label for=\"titre\">Titre</label>\n<input id=\"titre\">\n<button id=\"ajouter\" type=\"button\">Ajouter</button>\n<ul id=\"liste\"></ul>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }","js":"const bouton = document.querySelector(\"#ajouter\");\nconst titre = document.querySelector(\"#titre\");\nconst liste = document.querySelector(\"#liste\");\n\nbouton.addEventListener(\"click\", () => {\n  const li = document.createElement(\"li\");\n  li.textContent = titre.value;\n  liste.append(li);\n  titre.value = \"\";\n});"},"hint":"Compare les id du HTML et le sélecteur du querySelector."},{"type":"quiz","id":"projet-debug-q","prompt":"Rien ne se passe au clic et tu n'as encore rien lu. Par où commencer ?","choices":["Changer les couleurs","La console du navigateur","Réécrire le HTML au hasard","Désactiver JavaScript"],"answer":1,"explain":"Le message dit souvent null, une ligne, un nom. Les couleurs ne plantent pas un écouteur."}]}]},{"id":"proj-suite","title":"Relier","lessons":[{"id":"projet-json","title":"Projet : une liste depuis du JSON","summary":"Le réseau est simulé par une chaîne. Le parse peut échouer, et la page le dit.","minutes":15,"blocks":[{"type":"p","text":"En attendant une vraie API, la réponse est une **chaîne** dans le script. `JSON.parse` la transforme en valeur. Tu rends ensuite les livres, comme dans la galerie. La différence : le parse peut jeter. Un `try/catch` écrit alors un message dans la page, pas seulement dans la console. L'utilisateur voit « Cette réponse n'est pas du JSON. » Tu peux provoquer l'erreur en cassant la chaîne, pour vérifier que le message apparaît."},{"type":"code","lang":"javascript","code":"const brut = '[{\"titre\":\"Beloved\",\"prix\":16},{\"titre\":\"Sula\",\"prix\":14}]';\n\ntry {\n  const livres = JSON.parse(brut);\n  for (const livre of livres) {\n    const li = document.createElement(\"li\");\n    li.textContent = livre.titre + \" — \" + livre.prix + \" €\";\n    liste.append(li);\n  }\n} catch (erreur) {\n  message.textContent = \"Cette réponse n'est pas du JSON.\";\n}","caption":"Succès : des li. Échec : une phrase. Pas les deux."},{"type":"note","text":"textContent, pas innerHTML, pour le titre venu des données. Même si aujourd'hui tu as écrit le JSON toi-même, demain il viendra d'ailleurs."}],"exercises":[{"type":"web","id":"projet-json-web","prompt":"Parse la chaîne brut et ajoute un li par livre (titre et prix). Si le parse échoue, écris le message d'erreur dans #message.","files":["html","css","js"],"starter":{"html":"<p id=\"message\"></p>\n<ul id=\"liste\"></ul>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }","js":"const brut = '[{\"titre\":\"Beloved\",\"prix\":16},{\"titre\":\"Sula\",\"prix\":14}]';\nconst liste = document.querySelector(\"#liste\");\nconst message = document.querySelector(\"#message\");\n\n// parse, rendu, catch"},"solution":{"html":"<p id=\"message\"></p>\n<ul id=\"liste\"></ul>","css":"body { font-family: Georgia, serif; margin: 24px; color: #1c1915; background: #fbf8f2; }\nbutton, input { font: inherit; padding: 8px; }","js":"const brut = '[{\"titre\":\"Beloved\",\"prix\":16},{\"titre\":\"Sula\",\"prix\":14}]';\nconst liste = document.querySelector(\"#liste\");\nconst message = document.querySelector(\"#message\");\n\ntry {\n  const livres = JSON.parse(brut);\n  for (const livre of livres) {\n    const li = document.createElement(\"li\");\n    li.textContent = livre.titre + \" — \" + livre.prix + \" €\";\n    liste.append(li);\n  }\n} catch (erreur) {\n  message.textContent = \"Cette réponse n'est pas du JSON.\";\n}"}},{"type":"quiz","id":"projet-json-q","prompt":"Le JSON est invalide. Où la personne devant la page doit-elle le comprendre ?","choices":["Seulement dans la console","Dans la page, via le catch","Dans le CSS","Elle ne peut pas le savoir"],"answer":1,"explain":"La console est pour toi. Le message dans #message est pour la personne qui utilise la page."}]},{"id":"projet-plan","title":"Projet : spécifier avant de coder","summary":"Une demi-page : pour qui, quoi, données, et ce qu'on ne fait pas.","minutes":12,"blocks":[{"type":"p","text":"Avant une bibliothèque en ligne, écris une spécification qui tient sur un écran. **Qui** : une personne qui veut retrouver ses livres, pas « les utilisateurs ». **Quoi** : voir la liste, ajouter un livre avec un titre et un prix, retirer un livre. **Données** : titre (texte non vide), prix (nombre ≥ 0), id choisi par l'application. **Hors sujet** : pas de paiement, pas de comptes, pas d'application mobile. Le hors sujet protège le projet. Sans lui, chaque idée nouvelle a l'air obligatoire."},{"type":"h","text":"Trois écrans, pas trente"},{"type":"ul","items":["La liste, avec le filtre déjà vu.","Le formulaire d'ajout, sous la liste ou à côté.","L'état vide : aucun livre, et une phrase qui dit d'en ajouter un."]},{"type":"p","text":"Pour chaque écran, une phrase sur ce qui peut échouer. Titre vide : on n'ajoute pas, on le dit à côté du champ. Prix qui n'est pas un nombre : même traitement. Pas de page d'erreur générique pour ça. Tu sauras que la spécification est assez bonne quand tu peux écrire les tests (ou les exemples à la main) sans inventer une règle nouvelle."},{"type":"code","lang":"text","code":"But : retrouver ses livres.\nFaire : lister, ajouter, retirer.\nDonnées : id, titre, prix.\nPas faire : paiement, comptes, mobile.\nVide : « Aucun livre. Ajoute le premier. »","caption":"Si ça ne tient pas sur cet écran, le projet n'est pas encore découpé."},{"type":"note","text":"Le portfolio du parcours Pratique est un autre chantier, guidé côté page. Celui-ci est la façon de commencer le suivant sans te perdre."}],"exercises":[{"type":"write","id":"projet-plan-w","prompt":"Écris un plan de cinq lignes : qui, quoi, données, un hors-sujet, l'état vide. Le mot livres doit apparaître, ainsi que ce que tu ne fais pas.","lang":"text","starter":"","solution":"Qui : une personne et ses livres.\nQuoi : lister, ajouter, retirer.\nDonnées : titre, prix.\nHors sujet : pas de paiement.\nVide : aucun livre pour l'instant.","mustInclude":["livres","paiement"]},{"type":"quiz","id":"projet-plan-q","prompt":"À quoi sert d'écrire le hors-sujet ?","choices":["À allonger le document","À pouvoir refuser une idée sans rouvrir tout le projet","À remplacer les tests","À choisir la couleur du titre"],"answer":1,"explain":"Sans limite, chaque fonction « utile » entre. Le hors-sujet est une décision, pas un oubli."}]}]}]}};
const PY=[{"id":"py-objets","title":"Objets","lessons":[{"id":"py-poo","title":"Classes et objets","summary":"Un modèle, des instances. self est l'objet en cours.","minutes":12,"blocks":[{"type":"p","text":"Une **classe** décrit des données et des opérations. Un **objet** est un exemplaire. `class Livre:` puis `def __init__(self, titre, prix):` construit l'exemplaire. `self` est cet exemplaire : `self.titre = titre` range la valeur dessus. Sans `self` en premier paramètre, la méthode n'a pas d'objet à modifier. L'appel `Livre(\"Beloved\", 16)` ne passe pas `self` toi-même : Python le fait."},{"type":"code","lang":"python","code":"class Livre:\n    def __init__(self, titre, prix):\n        self.titre = titre\n        self.prix = prix\n\n    def remise(self, pourcent):\n        self.prix = self.prix * (1 - pourcent / 100)\n\nl = Livre(\"Beloved\", 16)\nl.remise(10)\nprint(l.prix)","caption":"La remise change cet exemplaire, pas la classe."},{"type":"ul","items":["`__init__` prépare l'objet. Ce n'est pas un « print de bienvenue ».","Deux appels à Livre créent deux objets. Changer l'un ne change pas l'autre.","Une fonction dehors qui reçoit le livre en argument marche aussi. La méthode est un rangement, pas une obligation morale."]},{"type":"caution","text":"Oublier self dans la définition, ou écrire self.titre = titre dans __init__ sans le paramètre, est l'erreur du premier jour. Lis le message : il parle souvent du nombre d'arguments."}],"exercises":[{"type":"quiz","id":"py-poo-q","prompt":"Qui passe self lors de l'appel l.remise(10) ?","choices":["Toi, en écrivant l.remise(l, 10)","Python, qui passe l comme self","Le compilateur Java","Personne, self est optionnel"],"answer":1,"explain":"La forme l.remise(10) passe l en premier argument, sous le nom self."},{"type":"write","id":"py-poo-w","prompt":"Écris une classe Lecteur avec un __init__ qui range self.nom, et rien d'autre.","lang":"python","starter":"","solution":"class Lecteur:\n    def __init__(self, nom):\n        self.nom = nom\n","mustInclude":["class Lecteur","def __init__","self.nom"]}]},{"id":"py-dataclass","title":"Dataclasses","summary":"Quand l'objet est surtout des champs, écris les champs.","minutes":9,"blocks":[{"type":"p","text":"Beaucoup de classes ne font que ranger des valeurs et les comparer. Réécrire `__init__`, `__eq__` et `__repr__` à la main est du bruit. `@dataclass` les génère. Tu déclares les champs avec des annotations. L'objet se crée comme une classe normale."},{"type":"code","lang":"python","code":"from dataclasses import dataclass\n\n@dataclass\nclass Point:\n    x: int\n    y: int\n\na = Point(2, 5)\nb = Point(2, 5)\nprint(a == b)\nprint(a)","caption":"Égalité et affichage viennent avec le décorateur."},{"type":"ul","items":["Pour un comportement (une remise qui change le prix avec une règle), une classe écrite à la main reste claire.","Pour une fiche de données, la dataclass suffit.","`frozen=True` rend l'objet non modifiable après création. Utile comme clé, inutile si le prix doit changer."]},{"type":"note","text":"Ce n'est pas une autre programmation objet. C'est moins de texte pour le cas simple."}],"exercises":[{"type":"quiz","id":"py-dataclass-q","prompt":"Que génère @dataclass pour une classe de champs ?","choices":["Un serveur HTTP","__init__ et une égalité de champs","Une base SQL","Un fichier CSS"],"answer":1,"explain":"Le décorateur écrit l'initialiseur et la comparaison. Tu gardes les méthodes que tu ajoutes toi-même."},{"type":"write","id":"py-dataclass-w","prompt":"Écris une dataclass Livre avec titre: str et prix: int.","lang":"python","starter":"","solution":"from dataclasses import dataclass\n\n@dataclass\nclass Livre:\n    titre: str\n    prix: int\n","mustInclude":["@dataclass","class Livre","titre: str"]}]}]},{"id":"py-outils","title":"Modules et environnement","lessons":[{"id":"py-modules","title":"Modules et import","summary":"Un fichier est un module. __main__ distingue le script lancé du fichier importé.","minutes":10,"blocks":[{"type":"p","text":"Un fichier `notes.py` est un **module**. Depuis un autre fichier du même dossier, `import notes` puis `notes.moyenne(...)`, ou `from notes import moyenne`. Le nom du fichier est le nom du module. Un dossier avec `__init__.py` est un paquet. Au début, des fichiers voisins suffisent."},{"type":"p","text":"Quand tu lances `python notes.py`, Python pose `__name__` à `\"__main__\"`. Quand le fichier est importé, `__name__` vaut `\"notes\"`. Le test `if __name__ == \"__main__\":` garde les essais et les `print` de démonstration hors du chemin de l'import. Sans ça, importer le module lancerait la démo."},{"type":"code","lang":"python","code":"def moyenne(vals):\n    return sum(vals) / len(vals)\n\nif __name__ == \"__main__\":\n    print(moyenne([12, 15, 9]))","caption":"Importable sans afficher. Lançable pour essayer."},{"type":"caution","text":"Deux fichiers qui s'importent l'un l'autre forment un cycle. L'un des deux n'a pas fini de se définir. Sors la fonction partagée dans un troisième fichier."}],"exercises":[{"type":"quiz","id":"py-modules-q","prompt":"Pourquoi le if __name__ == \"__main__\" ?","choices":["Pour chiffrer le fichier","Pour ne lancer la démo que quand le fichier est le programme","Pour créer une classe","Pour installer pip"],"answer":1,"explain":"Importé, le module ne doit pas forcément afficher ou lire le clavier. Le garde-fou sépare les deux usages."},{"type":"write","id":"py-modules-w","prompt":"Écris une fonction moyenne et le garde if __name__ == \"__main__\" qui l'appelle.","lang":"python","starter":"","solution":"def moyenne(vals):\n    return sum(vals) / len(vals)\n\nif __name__ == \"__main__\":\n    print(moyenne([10, 20]))\n","mustInclude":["def moyenne","__name__ == \"__main__\""]}]},{"id":"py-venv","title":"venv et pip","summary":"Un projet, un environnement. Les dépendances sont listées, pas copiées.","minutes":10,"blocks":[{"type":"p","text":"Deux projets peuvent avoir besoin de deux versions d'une même bibliothèque. Les installer dans le Python du système les mélange. Un **environnement virtuel** est un dossier, souvent `.venv`, qui contient un Python et ses paquets, réservés au projet. `python -m venv .venv` le crée. Tu l'actives : `source .venv/bin/activate` sur Linux et macOS, `.venv\\Scripts\\activate` sur Windows. L'invite change. `pip install requests` installe alors **dans** cet environnement."},{"type":"p","text":"`pip freeze > requirements.txt` écrit la liste des versions. Ailleurs, `pip install -r requirements.txt` les réinstalle. Tu commits `requirements.txt`. Tu ne commits pas `.venv` : il est gros, et il se reconstruit."},{"type":"code","lang":"bash","code":"python -m venv .venv\nsource .venv/bin/activate\npip install requests\npip freeze > requirements.txt","caption":"Créer, activer, installer, figer. .venv reste local."},{"type":"caution","text":"Lancer pip sans avoir activé l'environnement installe dans un autre Python. Vérifie que l'invite montre le venv, ou appelle `.venv/bin/pip`."},{"type":"note","text":"Désactiver : `deactivate`. Effacer l'environnement : supprimer le dossier `.venv`, puis le recréer. Rien d'autre dans le projet ne doit en dépendre."}],"exercises":[{"type":"quiz","id":"py-venv-q","prompt":"Pourquoi ne pas committer .venv ?","choices":["Parce que Python l'interdit","Parce qu'on le reconstruit avec requirements.txt","Parce qu'il ne contient pas les paquets","Parce que git ne voit pas les dossiers"],"answer":1,"explain":"Le dossier est une installation locale. La liste des versions, elle, voyage."},{"type":"write","id":"py-venv-w","prompt":"Écris les commandes pour créer .venv et figer les paquets dans requirements.txt. Inclus pip freeze.","lang":"bash","starter":"","solution":"python -m venv .venv\npip freeze > requirements.txt","mustInclude":["python -m venv .venv","pip freeze > requirements.txt"]}]},{"id":"py-comprehensions","title":"Compréhensions","summary":"Une liste construite en une expression. Pas une obligation de tout densifier.","minutes":10,"blocks":[{"type":"p","text":"Une **compréhension** construit une liste (ou un dict, ou un set) en décrivant l'élément et la boucle. `[t.upper() for t in titres if t]` se lit : la version en majuscules de chaque titre non vide. C'est la même chose qu'une boucle qui `append`, plus courte quand l'intérieur tient sur une ligne."},{"type":"code","lang":"python","code":"titres = [\"Beloved\", \"\", \"Sula\"]\npropres = [t.upper() for t in titres if t]\nnotes = [12, 9, 15, 10]\nadmises = [n for n in notes if n >= 10]\nindex = {t: len(t) for t in propres}","caption":"Liste filtrée, puis dictionnaire titre → longueur."},{"type":"ul","items":["Si le corps a un effet (écrire un fichier, plusieurs if imbriqués), reviens à une boucle for. On doit pouvoir la déboguer ligne à ligne.","Un set en compréhension dédoublonne : `{n for n in notes}`.","Ne chaîne pas trois compréhensions sur une ligne pour montrer que tu sais. Lisibilité d'abord."]},{"type":"note","text":"La boucle classique n'est pas un échec. La compréhension est un raccourci quand la phrase reste une phrase."}],"exercises":[{"type":"quiz","id":"py-comprehensions-q","prompt":"Quand préférer une boucle for à une compréhension ?","choices":["Jamais, la compréhension est obligatoire","Quand il y a plusieurs effets ou que la ligne devient illisible","Seulement pour les nombres","Quand le fichier s'appelle main"],"answer":1,"explain":"Le raccourci est bon tant qu'il se lit d'une traite. Sinon la boucle dit mieux l'ordre des étapes."},{"type":"write","id":"py-comprehensions-w","prompt":"Écris une compréhension qui garde les notes >= 10 dans une variable admises.","lang":"python","starter":"","solution":"notes = [12, 9, 15, 10]\nadmises = [n for n in notes if n >= 10]\n","expected":"[12, 15, 10]","mustInclude":["for","if",">="]}]}]}];
const JV=[{"id":"java-suite","title":"Aller plus loin","lessons":[{"id":"java-heritage","title":"Héritage et interfaces","summary":"Un seul parent. Autant d'interfaces que de contrats. La composition d'abord.","minutes":12,"blocks":[{"type":"p","text":"Une classe Java **étend** au plus une classe : `class Roman extends Livre`. Elle hérite des champs et des méthodes visibles, et elle peut remplacer une méthode avec `@Override`. Si le remplacement ne correspond à rien (mauvaise signature), l'annotation fait échouer la compilation au lieu de créer une deuxième méthode par erreur. Une classe **implémente** autant d'**interfaces** qu'elle veut. Une interface nomme un contrat : `interface Empruntable { void emprunter(); }`. Elle ne dit pas comment."},{"type":"p","text":"L'héritage dit « est un ». Un roman est un livre. Si la phrase sonne faux (« un panier est un livre » pour réutiliser une méthode), ne hérite pas. Garde un champ : le panier **a** une liste de livres. C'est la **composition**. Elle se défait plus facilement que `extends`."},{"type":"code","lang":"java","code":"interface Empruntable {\n    void emprunter();\n}\n\npublic class Livre implements Empruntable {\n    private boolean sorti;\n\n    @Override\n    public void emprunter() {\n        sorti = true;\n    }\n}","caption":"Le contrat est l'interface. Le champ sorti reste un détail de Livre."},{"type":"ul","items":["`super.methode()` appelle la version du parent quand tu remplaces une méthode.","Une classe abstraite peut porter du code commun. N'en crée pas « au cas où ».","Les records vus plus tôt restent le bon outil pour une simple fiche de données."]},{"type":"caution","text":"`extends` pour réutiliser trois lignes est un mauvais accord. Tu hérites aussi de ce que tu ne voulais pas."}],"exercises":[{"type":"quiz","id":"java-heritage-q","prompt":"Combien de classes parentes une classe Java peut-elle avoir ?","choices":["Autant qu'on veut","Une seule","Deux exactement","Zéro, extends est interdit"],"answer":1,"explain":"Un seul extends. Plusieurs implements. Si tu as besoin de deux parents, revois le modèle."},{"type":"write","id":"java-heritage-w","prompt":"Écris une interface Empruntable avec void emprunter(), et une classe Revue qui implements Empruntable.","lang":"java","starter":"","solution":"interface Empruntable {\n    void emprunter();\n}\n\npublic class Revue implements Empruntable {\n    @Override\n    public void emprunter() {\n    }\n}","mustInclude":["interface","implements","emprunter"]}]},{"id":"java-projet","title":"Packages et build","summary":"Le dossier, le nom, et un outil qui télécharge les dépendances.","minutes":10,"blocks":[{"type":"p","text":"Un **package** range les classes et évite que deux `Livre` se marchent dessus. `package biblio;` est la première ligne du fichier. Le dossier suit : `biblio/Livre.java`. La classe publique s'appelle comme le fichier : `public class Livre` vit dans `Livre.java`. `import biblio.Livre;` l'utilise depuis un autre package. Sans import, tu écris le nom complet."},{"type":"p","text":"Dès qu'une bibliothèque entre dans le projet, un fichier de build la déclare. **Maven** (`pom.xml`) ou **Gradle** jouent le rôle de `package.json` : nom du projet, version de Java, dépendances. L'outil télécharge, compile, lance les tests. Télécharger des `.jar` à la main et les poser dans un dossier « lib » se perd. En 2026, le fichier de build est le contrat."},{"type":"code","lang":"java","code":"package biblio;\n\npublic class Livre {\n    private final String titre;\n    public Livre(String titre) { this.titre = titre; }\n    public String getTitre() { return titre; }\n}","caption":"package en haut. Le fichier s'appelle Livre.java et vit dans biblio/."},{"type":"caution","text":"Si le nom de la classe publique et le nom du fichier divergent, javac refuse. Ce n'est pas une convention esthétique."},{"type":"note","text":"Tu peux encore compiler deux fichiers avec javac pour apprendre. Dès le troisième dossier, passe à Maven ou Gradle."}],"exercises":[{"type":"quiz","id":"java-projet-q","prompt":"À quoi sert pom.xml ou le fichier Gradle ?","choices":["À dessiner la page","À déclarer le projet et ses dépendances","À remplacer la JVM","À héberger le DNS"],"answer":1,"explain":"C'est le descriptif du build : quelle Java, quelles bibliothèques, quelles commandes."},{"type":"write","id":"java-projet-w","prompt":"Écris la ligne package biblio; puis une classe publique Livre vide au minimum avec les accolades.","lang":"java","starter":"","solution":"package biblio;\n\npublic class Livre {\n}","mustInclude":["package biblio;","public class Livre"]}]}]}];

// Examens de fin de leçon. Ajout : EXAMS['id-de-la-leçon'] = { pass, questions }.
// Types de question : one (un seul choix), multi (plusieurs bonnes réponses), fill (réponse courte).
(function(){
const O=(prompt,choices,answer,explain)=>({k:'one',prompt,choices,answer,explain});

<script>const SQL=(()=>{                                       

                        
               
                    
                     
  

                          
           
                            
                    
                     
                  
                          
                     
  

                                                      

                                                

const AMBIG = Symbol("ambig");

                                    

              
                                   
                           
  

function cloneTables(tables            )             {
  return tables.map((table) => ({
    name: table.name,
    columns: [...table.columns],
    rows: table.rows.map((row) => [...row]),
  }));
}

function stripComments(sql        ) {
  return sql.replace(/--[^\n]*/g, " ");
}

function shield(sql        ) {
  const strings           = [];
  const text = sql.replace(/'(?:''|[^'])*'|"(?:\\"|[^"])*"/g, (match) => {
    const quote = match[0];
    const inner = match.slice(1, -1).replace(quote === "'" ? /''/g : /""/g, quote);
    strings.push(inner);
    return `§${strings.length - 1}§`;
  });
  return { text, strings };
}

function normalize(source        )                                                   {
  let raw = stripComments(source).trim();
  if (!raw) return { ok: false, error: "Écris une requête." };
  raw = raw.replace(/;+\s*$/, "").trim();
  if (raw.includes(";")) {
    return { ok: false, error: "Une seule requête à la fois." };
  }
  const { text, strings } = shield(raw);
  const flat = text.replace(/\s+/g, " ").trim().toLowerCase();
  return { text: flat, strings };
}

function findTable(tables            , name        ) {
  return tables.find((table) => table.name.toLowerCase() === name);
}

function parseValue(token        , strings          )                  {
  const placeholder = token.match(/^§(\d+)§$/);
  if (placeholder) return strings[Number(placeholder[1])] ?? null;
  if (/^-?\d+(\.\d+)?$/.test(token)) return Number(token);
  return null;
}

function asNumber(value          )                {
  if (typeof value === "number") return value;
  if (/^-?\d+(\.\d+)?$/.test(value)) return Number(value);
  return null;
}

function compare(left          , op        , right          ) {
  const a = asNumber(left);
  const b = asNumber(right);
  const numeric = a !== null && b !== null;
  if (op === "=") return numeric ? a === b : String(left) === String(right);
  if (op === "!=" || op === "<>") return numeric ? a !== b : String(left) !== String(right);
  if (!numeric) {
    const ls = String(left);
    const rs = String(right);
    if (op === "<") return ls < rs;
    if (op === ">") return ls > rs;
    if (op === "<=") return ls <= rs;
    if (op === ">=") return ls >= rs;
    return false;
  }
  if (op === "<") return a < b;
  if (op === ">") return a > b;
  if (op === "<=") return a <= b;
  if (op === ">=") return a >= b;
  return false;
}

function splitComma(list        ) {
  return list
    .split(",")
    .map((part) => part.trim())
    .filter(Boolean);
}

                                                         

function parseWhere(where        , strings          )                      {
  const parts = where.split(/\s+and\s+/);
  const preds         = [];
  for (const part of parts) {
    const match = part.trim().match(/^([a-z_][a-z0-9_.]*)\s*(<=|>=|<>|!=|=|<|>)\s*(\S+)$/);
    if (!match) {
      return {
        ok: false,
        error: `Condition trop complexe : « ${part.trim()} ». Utilise =, <, >, <=, >=, != et AND.`,
      };
    }
    const value = parseValue(match[3], strings);
    if (value === null) {
      return { ok: false, error: `Valeur illisible : « ${match[3]} ». Entoure le texte de quotes.` };
    }
    preds.push({ col: match[1], op: match[2], value });
  }
  return preds;
}

function scopeFrom(table          , row            )        {
  const qualified = new Map                  ();
  const plain = new Map              ();
  table.columns.forEach((column, index) => {
    const key = column.toLowerCase();
    qualified.set(`${table.name.toLowerCase()}.${key}`, row[index]);
    plain.set(key, row[index]);
  });
  return { qualified, plain };
}

function mergeScopes(left       , right       )        {
  const qualified = new Map(left.qualified);
  const plain = new Map(left.plain);
  right.qualified.forEach((value, key) => qualified.set(key, value));
  right.plain.forEach((value, key) => {
    if (plain.has(key)) plain.set(key, AMBIG);
    else plain.set(key, value);
  });
  return { qualified, plain };
}

function isFailure(value         )                      {
  return typeof value === "object" && value !== null && "ok" in value;
}

function readCol(scope       , col        )                        {
  if (col.includes(".")) {
    if (!scope.qualified.has(col)) return { ok: false, error: `Colonne inconnue : ${col}` };
    return scope.qualified.get(col)            ;
  }
  if (!scope.plain.has(col)) return { ok: false, error: `Colonne inconnue : ${col}` };
  const value = scope.plain.get(col);
  if (value === AMBIG) {
    return {
      ok: false,
      error: `La colonne « ${col} » existe dans plusieurs tables. Précise-la, par exemple livres.${col}.`,
    };
  }
  return value            ;
}

function matchPreds(scope       , preds        )                       {
  for (const pred of preds) {
    const left = readCol(scope, pred.col);
    if (isFailure(left)) return left;
    if (!compare(left, pred.op, pred.value)) return false;
  }
  return true;
}

function sortScopes(scopes         , order                                      )                       {
  const decorated                                           = [];
  for (const scope of scopes) {
    const value = readCol(scope, order.col);
    if (isFailure(value)) return value;
    decorated.push({ scope, value });
  }
  const dir = order.dir === "desc" ? -1 : 1;
  decorated.sort((a, b) => {
    if (a.value === b.value) return 0;
    const left = asNumber(a.value);
    const right = asNumber(b.value);
    if (left !== null && right !== null) return left < right ? -dir : dir;
    return String(a.value) < String(b.value) ? -dir : dir;
  });
  return decorated.map((item) => item.scope);
}

function project(
  scope       ,
  select        ,
  rightName               ,
  tables            ,
)                                                         {
  if (select.trim() === "*") {
    const columns           = [];
    const values             = [];
    scope.qualified.forEach((value, key) => {
      columns.push(rightName ? key : key.split(".")[1]);
      values.push(value);
    });
    return { columns, values };
  }

  const columns           = [];
  const values             = [];
  for (const item of splitComma(select)) {
    if (item.endsWith(".*")) {
      const name = item.slice(0, -2);
      const table = findTable(tables, name);
      if (!table) return { ok: false, error: `Table inconnue : ${name}` };
      for (const column of table.columns) {
        const key = column.toLowerCase();
        columns.push(rightName ? `${name}.${key}` : key);
        values.push(scope.qualified.get(`${name}.${key}`)            );
      }
      continue;
    }
    const value = readCol(scope, item);
    if (isFailure(value)) return value;
    columns.push(item);
    values.push(value);
  }
  return { columns, values };
}

function available(tables            ) {
  return tables.map((table) => table.name).join(", ");
}

function runSelect(
  body        ,
  strings          ,
  tables            ,
  order                                             ,
)            {
  const fromMatch = body.match(/^select\s+(.+)\s+from\s+(.+)$/);
  if (!fromMatch) {
    return { ok: false, error: "Requête SELECT incomplète. Exemple : SELECT titre FROM livres" };
  }
  const select = fromMatch[1];
  let from = fromMatch[2];
  let preds         = [];

  const whereMatch = from.match(/^(.*)\s+where\s+(.+)$/);
  if (whereMatch) {
    from = whereMatch[1];
    const parsed = parseWhere(whereMatch[2], strings);
    if (isFailure(parsed)) return parsed;
    preds = parsed;
  }

  const joinMatch = from.match(
    /^([a-z_][a-z0-9_]*)\s+(?:inner\s+)?join\s+([a-z_][a-z0-9_]*)\s+on\s+([a-z_][a-z0-9_.]*)\s*=\s*([a-z_][a-z0-9_.]*)$/,
  );

  let scopes          = [];
  let rightName                = null;

  if (joinMatch) {
    const leftName = joinMatch[1];
    rightName = joinMatch[2];
    const left = findTable(tables, leftName);
    const right = findTable(tables, rightName);
    if (!left || !right) {
      return { ok: false, error: `Table inconnue. Tables disponibles : ${available(tables)}.` };
    }
    for (const leftRow of left.rows) {
      for (const rightRow of right.rows) {
        const scope = mergeScopes(scopeFrom(left, leftRow), scopeFrom(right, rightRow));
        const onLeft = readCol(scope, joinMatch[3]);
        const onRight = readCol(scope, joinMatch[4]);
        if (isFailure(onLeft)) return onLeft;
        if (isFailure(onRight)) return onRight;
        if (compare(onLeft, "=", onRight)) scopes.push(scope);
      }
    }
  } else {
    if (!/^[a-z_][a-z0-9_]*$/.test(from)) {
      return {
        ok: false,
        error: "Jointure trop complexe. Utilise INNER JOIN ... ON table.col = autre.col.",
      };
    }
    const table = findTable(tables, from);
    if (!table) return { ok: false, error: `Table inconnue : ${from}. Tables : ${available(tables)}.` };
    scopes = table.rows.map((row) => scopeFrom(table, row));
  }

  const kept          = [];
  for (const scope of scopes) {
    const ok = matchPreds(scope, preds);
    if (isFailure(ok)) return ok;
    if (ok) kept.push(scope);
  }

  if (order) {
    const sorted = sortScopes(kept, order);
    if (isFailure(sorted)) return sorted;
    kept.splice(0, kept.length, ...sorted);
  }

  const projected               = [];
  let columns           = [];
  for (const scope of kept) {
    const row = project(scope, select, rightName, tables);
    if (isFailure(row)) return row;
    columns = row.columns;
    projected.push(row.values);
  }
  if (kept.length === 0 && scopes.length > 0) {
    const sample = project(scopes[0], select, rightName, tables);
    if (isFailure(sample)) return sample;
    columns = sample.columns;
  } else if (kept.length === 0 && select.trim() !== "*") {
    columns = splitComma(select);
  }

  return {
    ok: true,
    kind: "select",
    columns,
    rows: projected,
    message: projected.length === 1 ? "1 ligne." : `${projected.length} lignes.`,
    affected: null,
    tables,
  };
}

function runMutate(kind                                , sql        , strings          , tables            )            {
  if (kind === "insert") {
    const match = sql.match(/^insert into\s+([a-z_][a-z0-9_]*)\s*\(([^)]+)\)\s*values\s*\(([^)]+)\)$/);
    if (!match) {
      return { ok: false, error: "INSERT attendu : INSERT INTO livres (titre, prix) VALUES ('Poésies', 14)" };
    }
    const table = findTable(tables, match[1]);
    if (!table) return { ok: false, error: `Table inconnue : ${match[1]}.` };
    const cols = splitComma(match[2]);
    const rawValues = splitComma(match[3]);
    if (cols.length !== rawValues.length) {
      return { ok: false, error: "Le nombre de colonnes et de valeurs ne correspond pas." };
    }
    const unknown = cols.find((col) => !table.columns.some((column) => column.toLowerCase() === col));
    if (unknown) return { ok: false, error: `Colonne inconnue : ${unknown}` };
    const row = table.columns.map(() => ""            );
    for (let index = 0; index < cols.length; index += 1) {
      const at = table.columns.findIndex((column) => column.toLowerCase() === cols[index]);
      const value = parseValue(rawValues[index], strings);
      if (value === null) return { ok: false, error: `Valeur illisible : « ${rawValues[index]} ».` };
      row[at] = value;
    }
    table.rows.push(row);
    return {
      ok: true,
      kind: "mutate",
      columns: table.columns,
      rows: table.rows,
      message: "1 ligne ajoutée.",
      affected: table.name,
      tables,
    };
  }

  if (kind === "update") {
    const match = sql.match(/^update\s+([a-z_][a-z0-9_]*)\s+set\s+(.+)$/);
    if (!match) return { ok: false, error: "UPDATE incomplet. Exemple : UPDATE livres SET prix = 12 WHERE id = 1" };
    const table = findTable(tables, match[1]);
    if (!table) return { ok: false, error: `Table inconnue : ${match[1]}.` };
    let assign = match[2];
    let preds         = [];
    const where = assign.match(/^(.*)\s+where\s+(.+)$/);
    if (where) {
      assign = where[1];
      const parsed = parseWhere(where[2], strings);
      if (isFailure(parsed)) return parsed;
      preds = parsed;
    }
    const pairs = splitComma(assign).map((part) => {
      const eq = part.match(/^([a-z_][a-z0-9_]*)\s*=\s*(\S+)$/);
      return eq ? { col: eq[1], token: eq[2] } : null;
    });
    if (pairs.some((pair) => !pair)) {
      return { ok: false, error: "Affectation illisible. Exemple : SET prix = 12, auteur = 'Bâ'" };
    }
    let count = 0;
    for (const row of table.rows) {
      const scope = scopeFrom(table, row);
      const ok = matchPreds(scope, preds);
      if (isFailure(ok)) return ok;
      if (!ok) continue;
      for (const pair of pairs) {
        if (!pair) continue;
        const at = table.columns.findIndex((column) => column.toLowerCase() === pair.col);
        if (at < 0) return { ok: false, error: `Colonne inconnue : ${pair.col}` };
        const value = parseValue(pair.token, strings);
        if (value === null) return { ok: false, error: `Valeur illisible : « ${pair.token} ».` };
        row[at] = value;
      }
      count += 1;
    }
    return {
      ok: true,
      kind: "mutate",
      columns: table.columns,
      rows: table.rows,
      message: count === 1 ? "1 ligne modifiée." : `${count} lignes modifiées.`,
      affected: table.name,
      tables,
    };
  }

  const match = sql.match(/^delete from\s+([a-z_][a-z0-9_]*)(?:\s+where\s+(.+))?$/);
  if (!match) return { ok: false, error: "DELETE incomplet. Exemple : DELETE FROM livres WHERE id = 2" };
  const table = findTable(tables, match[1]);
  if (!table) return { ok: false, error: `Table inconnue : ${match[1]}.` };
  let preds         = [];
  if (match[2]) {
    const parsed = parseWhere(match[2], strings);
    if (isFailure(parsed)) return parsed;
    preds = parsed;
  }
  const next               = [];
  let count = 0;
  for (const row of table.rows) {
    const ok = matchPreds(scopeFrom(table, row), preds);
    if (isFailure(ok)) return ok;
    if (ok) count += 1;
    else next.push(row);
  }
  table.rows = next;
  return {
    ok: true,
    kind: "mutate",
    columns: table.columns,
    rows: table.rows,
    message: count === 1 ? "1 ligne supprimée." : `${count} lignes supprimées.`,
    affected: table.name,
    tables,
  };
}

function runSql(source        , seeds            )            {
  const prepared = normalize(source);
  if (isFailure(prepared)) return prepared;
  const { text, strings } = prepared;
  const tables = cloneTables(seeds);

  let order                                              = null;
  let sql = text;
  const orderMatch = sql.match(/^(.*)\s+order by\s+([a-z_][a-z0-9_.]*)(?:\s+(asc|desc))?$/);
  if (orderMatch) {
    sql = orderMatch[1].trim();
    order = { col: orderMatch[2], dir: orderMatch[3] === "desc" ? "desc" : "asc" };
    if (!sql.startsWith("select ")) return { ok: false, error: "ORDER BY s'utilise avec SELECT." };
  }

  if (sql.startsWith("select ")) return runSelect(sql, strings, tables, order);
  if (sql.startsWith("insert ")) return runMutate("insert", sql, strings, tables);
  if (sql.startsWith("update ")) return runMutate("update", sql, strings, tables);
  if (sql.startsWith("delete ")) return runMutate("delete", sql, strings, tables);
  return { ok: false, error: "Je ne comprends pas cette requête. Utilise SELECT, INSERT, UPDATE ou DELETE." };
}

function signature(columns          , rows              , ordered         ) {
  const head = columns.map((column) => column.toLowerCase()).join("|");
  const body = rows.map((row) => row.map((value) => `${typeof value}:${String(value)}`).join("\u0001"));
  const lines = ordered ? body : [...body].sort();
  return `${head}#${lines.join("\u0002")}`;
}

function sameOutcome(user            , solution            , ordered         ) {
  if (user.kind !== solution.kind) return false;
  if (user.kind === "select") {
    return signature(user.columns, user.rows, ordered) === signature(solution.columns, solution.rows, ordered);
  }
  const userTable = user.tables.find((table) => table.name === user.affected);
  const solutionTable = solution.tables.find((table) => table.name === solution.affected);
  if (!userTable || !solutionTable) return false;
  return (
    signature(userTable.columns, userTable.rows, false) ===
    signature(solutionTable.columns, solutionTable.rows, false)
  );
}

return{runSql,sameOutcome};})();</script>
<script>
const $=s=>document.querySelector(s),A=$('#app');
let PR={lessons:{},exercises:{},last:null},cur=null,fid=0;
try{Object.assign(PR,JSON.parse(localStorage.getItem('atrium-progress')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('atrium-progress',JSON.stringify(PR))}catch(e){}};
const mark=(id,v)=>{PR.exercises[id]=v;save()};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const rich=t=>t.split(/(`[^`]+`|\*\*[^*]+\*\*)/g).map(p=>p.length>2&&p[0]==='`'&&p.endsWith('`')?'<code>'+esc(p.slice(1,-1))+'</code>':p.length>4&&p.startsWith('**')&&p.endsWith('**')?'<strong>'+T(p.slice(2,-2))+'</strong>':T(p)).join('');
const TR=DATA.tracks,F=[],EX={};
TR.forEach(t=>t.chapters.forEach(c=>c.lessons.forEach(l=>{F.push({t,c,l});l.exercises.forEach(e=>EX[e.id]=e)})));
const NM={java:'Java',python:'Python',php:'PHP',javascript:'JavaScript',html:'HTML',css:'CSS',sql:'SQL'},LB={html:'HTML',css:'CSS',js:'JavaScript'};
const sf=(s,t)=>s.replace(new RegExp('</'+t,'gi'),'<\\/'+t);
const boot=id=>'(function(){var id='+JSON.stringify(id)+';function tx(a){try{return typeof a==="string"?a:JSON.stringify(a)}catch(e){return String(a)}}function p(k,a){try{parent.postMessage({channel:"atrium",id:id,kind:k,text:[].map.call(a,tx).join(" ")},"*")}catch(e){}}console.log=function(){p("log",arguments)};console.error=function(){p("error",arguments)};console.warn=function(){p("warn",arguments)};addEventListener("error",function(e){p("error",[e.message||"Erreur"])})})();';
function doc(h,c,j,id){const st=sf(c,'style'),rt='<script>'+boot(id)+'<\/script><script>'+sf(j,'script')+'<\/script>',d=h.trim();
if(/<!doctype html/i.test(d)||/<html[\s>]/i.test(d)){let o=/<\/head>/i.test(d)?d.replace(/<\/head>/i,()=>'<style>'+st+'</style></head>'):'<style>'+st+'</style>'+d;return /<\/body>/i.test(o)?o.replace(/<\/body>/i,()=>rt+'</body>'):o+rt}
return'<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}body{padding:16px;font-family:system-ui,sans-serif;color:#1c1915;background:#fbf8f2;line-height:1.5}'+st+'</style></head><body>'+d+rt+'</body></html>'}
function blk(b,i){switch(b.type){
case'p':return'<p>'+rich(b.text)+'</p>';
case'h':return'<h2>'+T(b.text)+'</h2>';
case'ul':case'ol':return'<'+b.type+'>'+b.items.map(x=>'<li>'+rich(x)+'</li>').join('')+'</'+b.type+'>';
case'table':return'<div>'+(b.caption?'<p class=mu>'+T(b.caption)+'</p>':'')+'<div class=tb><table><thead><tr>'+b.headers.map(h=>'<th>'+T(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+T(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
case'code':return'<figure class=cd><figcaption><span>'+esc(b.caption||b.lang)+'</span><button data-a=copy>Copier</button></figcaption><pre><code>'+esc(b.code)+'</code></pre></figure>';
case'note':case'caution':return'<p class=nt><strong>'+(b.type==='caution'?'Attention. ':'À retenir. ')+'</strong>'+rich(b.text)+'</p>';
default:return'<figure class=dm><figcaption>'+T(b.caption||'Aperçu')+'</figcaption><iframe title="Aperçu de l’exemple" sandbox="allow-scripts" srcdoc="'+esc(doc(b.html,b.css||'',b.js||'','d'+i))+'"></iframe></figure>'}}
function pg(files,st){const id=++fid,f=files[0]||'html';
return'<div class=pg data-id="'+id+'" data-f="'+f+'"><div class=tabs>'+files.map(x=>'<button data-f="'+x+'" class="'+(x===f?'on':'')+'">'+LB[x]+'</button>').join('')+'<button data-f=p class=tp>Aperçu</button></div><div class=bd><div>'+['html','css','js'].map(x=>'<textarea class="ta e-'+x+'" aria-label="'+LB[x]+'" spellcheck=false autocapitalize=off autocorrect=off>\n'+esc(st[x]||'')+'</textarea>').join('')+'</div><div class=pvw><iframe class=pv title="Aperçu de la page" sandbox="allow-scripts"></iframe>'+(files.includes('js')?'<div class=cs id="c'+id+'"></div>':'')+'</div></div></div>'}
function run(g){const v=k=>g.querySelector('.e-'+k).value,c=g.querySelector('.cs');if(c)c.innerHTML='';g.querySelector('iframe').srcdoc=doc(v('html'),v('css'),v('js'),g.dataset.id)}
const grid=(c,r)=>c.length?'<div class=tb><table><thead><tr>'+c.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+(r.length?r.map(w=>'<tr>'+w.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+c.length+'" class=mu>Aucune ligne.</td></tr>')+'</tbody></table></div>':'<p class=mu>Aucune colonne.</p>';
const sol=e=>'<details><summary>Voir la solution</summary><pre>'+esc(e.solution)+'</pre></details>';
const area=s=>'<textarea class=ta aria-label="Code" spellcheck=false autocapitalize=off autocorrect=off>\n'+esc(s)+'</textarea>';
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9#+.]/g,'');
const xq=(q,n,id)=>{const o=(q.choices||[]).map((_,i)=>i).sort(()=>Math.random()-.5);
return'<fieldset class=xq data-n="'+n+'"><legend><span class=k>Question '+(n+1)+(q.k==='multi'?' · plusieurs réponses':q.k==='fill'?' · réponse courte':'')+'</span>'+rich(q.prompt)+'</legend>'+(q.k==='fill'?'<input class=fi type=text aria-label="Réponse" autocapitalize=off autocorrect=off spellcheck=false>':o.map(i=>'<label class=ch><input type='+(q.k==='multi'?'checkbox':'radio')+' name="'+id+n+'" value='+i+'><span>'+T(q.choices[i])+'</span></label>').join(''))+'<p class="mu xo"></p></fieldset>'};
function gradeExam(art,E){let ok=0;E.questions.forEach((q,n)=>{const fs=art.querySelector('[data-n="'+n+'"]'),want=[].concat(q.answer===undefined?[]:q.answer).sort();let good;
if(q.k==='fill')good=q.accept.map(norm).includes(norm(fs.querySelector('.fi').value));
else{const got=[...fs.querySelectorAll('input:checked')].map(x=>+x.value).sort();good=got.length===want.length&&got.every((v,i)=>v===want[i])}
fs.querySelectorAll('.ch').forEach(l=>{const v=+l.firstChild.value,w=want.includes(v);l.classList.toggle('ok',w);l.classList.toggle('no',l.firstChild.checked&&!w)});
fs.classList.toggle('good',good);fs.classList.toggle('bad',!good);ok+=good?1:0;
fs.querySelector('.xo').innerHTML=(good?'<strong>Juste.</strong> ':'<strong>Faux.</strong> '+(q.k==='fill'?'Réponse attendue : '+esc(q.accept[0])+'. ':''))+rich(q.explain)});
const n=E.questions.length,pc=Math.round(100*ok/n),pass=pc>=100*(E.pass||.7);PR.exam=PR.exam||{};PR.exam[E.id]=Math.max(PR.exam[E.id]||0,pc);if(pass)mark(E.id,true);else save();
art.querySelector('.xr').innerHTML='<p class=xs><strong>'+ok+' / '+n+' · '+pc+' %</strong> '+(pass?'Examen réussi.':'Sous le seuil de '+Math.round(100*(E.pass||.7))+' %. Relis la leçon, puis recommence.')+'</p>'}
const ty={
exam:e=>'<p>'+T(e.intro||'Réponds à toutes les questions sans regarder la leçon, puis corrige. Les choix changent d’ordre à chaque essai. Seuil de réussite : '+Math.round(100*(e.pass||.7))+' %.')+'</p>'+(PR.exam&&PR.exam[e.id]!=null?'<p class=mu>Meilleur score : '+PR.exam[e.id]+' %</p>':'')+e.questions.map((q,n)=>xq(q,n,e.id)).join('')+'<div class=bar><button class="btn pri" data-a=exam>Corriger l’examen</button><button class=btn data-a=examr>Recommencer</button></div><div class=xr aria-live=polite></div>',
quiz:e=>'<fieldset><legend>'+rich(e.prompt)+'</legend>'+e.choices.map((c,i)=>'<button class=q data-q="'+i+'">'+T(c)+'</button>').join('')+'<p class="mu ex-out"></p></fieldset>',
web:e=>'<p>'+rich(e.prompt)+'</p>'+(e.hint?'<p class=mu>Indice : '+rich(e.hint)+'</p>':'')+pg(e.files,e.starter)+'<div class=bar><button class=btn data-a=sol>Voir la solution</button><button class="btn pri" data-a=done>'+(PR.exercises[e.id]?'Exercice fait':'Marquer comme fait')+'</button></div>',
write:e=>'<p>'+rich(e.prompt)+'</p><p class=mu>'+NM[e.lang]+' ne s’exécute pas dans la page. Écris le code, compare-le à la sortie attendue, puis à la solution.</p>'+area(e.starter)+(e.expected?'<p class=mu>Sortie attendue</p><pre class=pl>'+esc(e.expected)+'</pre>':'')+'<div class=bar><button class="btn pri" data-a=chkw>Vérifier la forme</button></div><p class=ex-out></p>'+sol(e),
sql:e=>'<p>'+rich(e.prompt)+'</p><p class=mu>'+T(e.goal)+'</p>'+e.seeds.map(s=>'<p class=k>'+esc(s.name)+'</p>'+grid(s.columns,s.rows)).join('')+area(e.starter)+'<div class=bar><button class="btn pri" data-a=sql>Exécuter</button></div><div class=ex-out></div>'+sol(e)};
const ex=(e,i)=>'<article class=ex data-ex="'+e.id+'"><p class=k>'+(e.type==='exam'?'Examen de la leçon':'Exercice '+(i+1))+'</p>'+ty[e.type](e)+'</article>';
const row=l=>'<a class=rw href="#/lecon/'+l.id+'"><span class=ck>'+(PR.lessons[l.id]?'✓':'')+'</span><span>'+T(l.title)+' <small class=mu>· '+l.minutes+' min</small></span></a>';
const nav=()=>'<header class=nv><a class=lg href="#/">Atrium</a><nav><a href="#/atelier">Atelier</a></nav></header>';
const nf=()=>nav()+'<main class=w><h1>Cette page n’existe pas.</h1><a class=btn href="#/">Retour au parcours</a></main>';
function home(){const rd=F.filter(r=>PR.lessons[r.l.id]).length,last=F.find(r=>r.l.id===PR.last);
return nav()+'<main class=w><p class=k>Débutant absolu → autonomie</p><h1>Apprendre à développer, page après page.</h1><p class="lead mu">Du terminal à React, de HTML à TypeScript, avec Python, Java, PHP, SQL, Git, l’algorithmique et l’IA comme outil. Des leçons, des exercices, et un atelier pour voir ce que le code donne à l’écran. Pas de points, pas de série, pas de récompense.</p><div class=bar><a class="btn pri" href="#/lecon/'+(last||F[0]).l.id+'">'+(last?'Reprendre : '+T(last.l.title):'Commencer par le début')+'</a><a class=btn href="#/atelier">Ouvrir l’atelier</a></div><p class="mu sm">'+TR.length+' parties · '+F.length+' leçons'+(rd?' · '+rd+' lues':'')+'</p><input id=sq type=search placeholder="Chercher une leçon" aria-label="Chercher une leçon"><div id=lst></div></main>'}
function lst(){const o=$('#lst');if(!o)return;const q=$('#sq').value.trim().toLowerCase();
if(q){const m=F.filter(r=>(r.l.title+' '+r.l.summary).toLowerCase().includes(q));o.innerHTML=m.length?m.map(r=>row(r.l)).join(''):'<p class=mu>Aucune leçon ne porte ces mots.</p>';return}
o.innerHTML=TR.map(t=>{const ls=F.filter(r=>r.t.id===t.id),rd=ls.filter(r=>PR.lessons[r.l.id]).length;return'<a class=tc href="#/parcours/'+t.id+'"><span class=k>'+T(t.kicker)+'</span><b>'+T(t.title)+'</b><span class=mu>'+T(t.summary)+'</span><span class="mu sm">'+ls.length+' leçons'+(rd?' · '+rd+' lues':'')+'</span></a>'}).join('')}
function track(id){const t=TR.find(x=>x.id===id);if(!t)return nf();return nav()+'<main class=w><p class=k>'+T(t.kicker)+'</p><h1>'+T(t.title)+'</h1><p class="lead mu">'+T(t.summary)+'</p>'+t.chapters.map(c=>'<h2>'+T(c.title)+'</h2>'+c.lessons.map(row).join('')).join('')+'</main>'}
function lesson(id){const i=F.findIndex(r=>r.l.id===id);if(i<0)return nf();const r=F[i],l=r.l;cur=id;PR.last=id;save();
return nav()+'<main class=w><p class="mu sm"><a href="#/parcours/'+r.t.id+'">'+T(r.t.title)+'</a> · '+T(r.c.title)+' · '+l.minutes+' min</p><h1>'+T(l.title)+'</h1><p class="lead mu">'+T(l.summary)+'</p><div class=bl>'+l.blocks.map(blk).join('')+'</div>'+(l.exercises.length?'<section class=exs><h2>Exercices</h2>'+l.exercises.map(ex).join('')+'</section>':'')+'<div class="bar foot"><button class=btn data-a=read>'+(PR.lessons[id]?'✓ Lue':'Marquer comme lue')+'</button>'+(i?'<a class=btn href="#/lecon/'+F[i-1].l.id+'">Précédent</a>':'')+(i<F.length-1?'<a class="btn pri" href="#/lecon/'+F[i+1].l.id+'">'+T(F[i+1].l.title)+'</a>':'<a class=btn href="#/">Fin du parcours</a>')+'</div></main>'}
function atelier(){const p=DATA.presets;return nav()+'<main class="w big"><h1>Atelier</h1><div class=bar>'+p.map((x,i)=>'<button class="btn'+(i?'':' pri')+'" data-p="'+i+'">'+T(x.title)+'</button>').join('')+'</div><div id=slot>'+pg(['html','css','js'],p[0])+'</div></main>'}
function route(){const[a,b]=location.hash.replace(/^#\/?/,'').split('/');
A.innerHTML=a==='lecon'?lesson(b):a==='parcours'?track(b):a==='atelier'?atelier():home();
document.querySelectorAll('.pg').forEach(run);lst();scrollTo(0,0)}
A.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,art=b.closest('.ex'),E=art&&EX[art.dataset.ex];
if(d.f){const g=b.closest('.pg');g.dataset.f=d.f;g.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));return}

if(d.q!==undefined){const i=+d.q,fs=b.closest('fieldset');fs.querySelectorAll('.q').forEach((x,j)=>{x.classList.toggle('ok',j===E.answer);x.classList.toggle('no',j===i&&j!==E.answer)});fs.querySelector('.ex-out').innerHTML=rich(E.explain);if(i===E.answer)mark(E.id,true);return}
const a=d.a;
if(a==='copy'){const p=navigator.clipboard&&navigator.clipboard.writeText(b.closest('figure').querySelector('pre').textContent);if(p)p.then(()=>{b.textContent='Copié';setTimeout(()=>b.textContent='Copier',1200)}).catch(()=>{})}
else if(a==='read'){PR.lessons[cur]=!PR.lessons[cur];save();b.textContent=PR.lessons[cur]?'✓ Lue':'Marquer comme lue'}
else if(a==='exam')gradeExam(art,E);
else if(a==='examr'){const t=document.createElement('div');t.innerHTML=ex(E,0);art.replaceWith(t.firstChild)}
else if(a==='done'){const v=!PR.exercises[E.id];mark(E.id,v);b.textContent=v?'Exercice fait':'Marquer comme fait'}
else if(a==='sol'){const g=art.querySelector('.pg'),on=g.dataset.sol!=='1',t=document.createElement('div');t.innerHTML=pg(E.files,on?E.solution:E.starter);const n=t.firstChild;n.dataset.sol=on?'1':'';g.replaceWith(n);run(n);b.textContent=on?'Revenir à mon énoncé':'Voir la solution'}
else if(a==='chkw'){const c=art.querySelector('.ta').value,m=(E.mustInclude||[]).filter(x=>!c.includes(x)),o=art.querySelector('.ex-out');if(m.length)o.textContent='Il manque encore : '+m.join(', ')+'.';else{mark(E.id,true);o.textContent='Les éléments demandés sont là. Ce n’est pas une exécution : relis la sortie attendue et, si besoin, la solution.'}}
else if(a==='sql'){const r=SQL.runSql(art.querySelector('.ta').value,E.seeds),s=SQL.runSql(E.solution,E.seeds),o=art.querySelector('.ex-out');
if(!r.ok){o.innerHTML='<p>'+esc(r.error)+'</p>';return}
const ok=s.ok&&SQL.sameOutcome(r,s,/\border\s+by\b/i.test(E.solution));if(ok)mark(E.id,true);
o.innerHTML='<p class=mu>'+esc(r.message)+'</p>'+grid(r.columns,r.rows)+'<p>'+(ok?'Le résultat correspond à celui attendu.':'La requête a tourné, mais le résultat n’est pas celui attendu.')+'</p>'}};
A.addEventListener('input',e=>{if(e.target.id==='sq')return lst();const g=e.target.closest('.pg');if(g){clearTimeout(g.tm);g.tm=setTimeout(()=>run(g),160)}});
A.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Tab'&&t.classList.contains('ta')){e.preventDefault();t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}});
addEventListener('message',e=>{const d=e.data,c=d&&d.channel==='atrium'&&document.getElementById('c'+d.id);if(c&&typeof d.text==='string'){c.insertAdjacentHTML('beforeend','<p>'+(d.kind==='error'?'Erreur : ':'')+esc(d.text)+'</p>');while(c.children.length>40)c.firstChild.remove()}});

</script>
