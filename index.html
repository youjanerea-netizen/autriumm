 fiable (un prix, un droit d'accès)."}],"exercises":[{"type":"web","id":"js-premier-web","prompt":"Affiche dans la console le texte Bonjour, puis le nombre 3 + 4.","files":["js"],"starter":{"html":"<p>Regarde la console sous l'aperçu.</p>","css":"","js":""},"solution":{"html":"<p>Regarde la console sous l'aperçu.</p>","css":"","js":"console.log(\"Bonjour\");\nconsole.log(3 + 4);"}}]},{"id":"js-valeurs","title":"Valeurs et variables","summary":"let, const, types, et opérateurs.","minutes":10,"blocks":[{"type":"ul","items":["`let` pour une valeur qui peut changer. `const` pour un nom qui ne sera pas réassigné. Évite `var`.","Types courants : nombre, chaîne (`\"texte\"`), booléen (`true`, `false`), `null`, `undefined`.","Un tableau `[1, 2]` et un objet `{ nom: \"Awa\" }` groupent des valeurs.","Opérateurs : `+ - * / %`, comparaison `===` et `!==` (préfère-les à `==`), logique `&&`, `||`, `!`.","Les backticks entourent un modèle de chaîne : `` `Bonjour ${nom}` ``."]},{"type":"code","lang":"javascript","code":"const nom = \"Awa\";\nlet age = 20;\nage = age + 1;\nconsole.log(`${nom} a ${age} ans`);"},{"type":"note","text":"`\"2\" + 1` donne la chaîne `\"21\"` parce que `+` concatène si un côté est du texte. `Number(\"2\") + 1` donne `3`."}],"exercises":[{"type":"web","id":"js-valeurs-web","prompt":"Déclare const prenom, let points à 10, ajoute 5 aux points, et console.log une phrase qui contient les deux.","files":["js"],"starter":{"html":"<p>Console</p>","css":"","js":""},"solution":{"html":"<p>Console</p>","css":"","js":"const prenom = \"Léa\";\nlet points = 10;\npoints = points + 5;\nconsole.log(`${prenom} : ${points}`);"}},{"type":"quiz","id":"js-valeurs-q","prompt":"Quelle comparaison teste vraiment l'égalité de valeur et de type ?","choices":["=","==","===","!="],"answer":2,"explain":"= affecte. == convertit parfois les types. === exige la même valeur et le même type."}]}]},{"id":"js-2","title":"Décider et répéter","lessons":[{"id":"js-conditions","title":"Conditions","summary":"if, else, else if.","minutes":8,"blocks":[{"type":"code","lang":"javascript","code":"const note = 15;\nif (note >= 16) {\n  console.log(\"très bien\");\n} else if (note >= 10) {\n  console.log(\"admis\");\n} else {\n  console.log(\"à reprendre\");\n}"},{"type":"p","text":"La condition entre parenthèses doit être vraie ou fausse. Un bloc entre accolades évite les erreurs quand tu ajoutes une deuxième ligne. Range les cas du plus précis au plus général."}],"exercises":[{"type":"web","id":"js-conditions-web","prompt":"Si age est supérieur ou égal à 18, affiche majeur, sinon mineur. age vaut 18.","files":["js"],"starter":{"html":"<p>Console</p>","css":"","js":"const age = 18;\n"},"solution":{"html":"<p>Console</p>","css":"","js":"const age = 18;\nif (age >= 18) {\n  console.log(\"majeur\");\n} else {\n  console.log(\"mineur\");\n}"}}]},{"id":"js-boucles","title":"Boucles et tableaux","summary":"for, while, for...of, push et length.","minutes":10,"blocks":[{"type":"code","lang":"javascript","code":"const langues = [\"HTML\", \"CSS\", \"JavaScript\"];\nfor (const langue of langues) {\n  console.log(langue);\n}\nlangues.push(\"SQL\");\nconsole.log(langues.length);"},{"type":"ul","items":["`for (let i = 0; i < n; i++)` quand tu as besoin de l'indice.","`while` tant qu'une condition reste vraie. Attention à la condition qui ne change jamais.","`for...of` parcourt les valeurs. Les indices commencent à 0.","Méthodes utiles : `push`, `includes`, `map` pour obtenir un nouveau tableau transformé."]}],"exercises":[{"type":"web","id":"js-boucles-web","prompt":"Parcours le tableau notes avec for...of et affiche chaque note. Ajoute ensuite 18 avec push et affiche la longueur.","files":["js"],"starter":{"html":"<p>Console</p>","css":"","js":"const notes = [12, 15, 9];\n"},"solution":{"html":"<p>Console</p>","css":"","js":"const notes = [12, 15, 9];\nfor (const note of notes) {\n  console.log(note);\n}\nnotes.push(18);\nconsole.log(notes.length);"}}]},{"id":"js-fonctions","title":"Fonctions","summary":"Nommer un calcul pour le réutiliser.","minutes":8,"blocks":[{"type":"code","lang":"javascript","code":"function saluer(prenom) {\n  return `Bonjour ${prenom}`;\n}\nconsole.log(saluer(\"Awa\"));"},{"type":"p","text":"Les paramètres sont les noms à l'intérieur. L'argument est la valeur au moment de l'appel. `return` renvoie un résultat et sort de la fonction. Une fonction qui ne retourne rien renvoie `undefined`."}],"exercises":[{"type":"web","id":"js-fonctions-web","prompt":"Écris une fonction aire(largeur, hauteur) qui retourne le produit, puis affiche aire(4, 3).","files":["js"],"starter":{"html":"<p>Console</p>","css":"","js":""},"solution":{"html":"<p>Console</p>","css":"","js":"function aire(largeur, hauteur) {\n  return largeur * hauteur;\n}\nconsole.log(aire(4, 3));"}}]}]},{"id":"js-3","title":"La page","lessons":[{"id":"js-dom","title":"Lire et modifier le document","summary":"querySelector, textContent, classList.","minutes":10,"blocks":[{"type":"p","text":"Le DOM est l'arbre des éléments, tel que le navigateur le voit. `document.querySelector(\".titre\")` trouve le premier élément qui correspond au sélecteur CSS. `textContent` lit ou remplace le texte. `classList.add` et `classList.remove` touchent aux classes sans réécrire tout l'attribut."},{"type":"code","lang":"javascript","code":"const titre = document.querySelector(\"h1\");\ntitre.textContent = \"Page prête\";"},{"type":"caution","text":"`innerHTML` interprète du HTML. Si le texte vient d'une personne, il peut injecter une balise. Pour du texte, reste sur `textContent`."}],"exercises":[{"type":"web","id":"js-dom-web","prompt":"Le h1 dit « Ancien ». Remplace son texte par « Nouveau » avec querySelector et textContent.","files":["js"],"starter":{"html":"<h1>Ancien</h1>","css":"","js":""},"solution":{"html":"<h1>Ancien</h1>","css":"","js":"const titre = document.querySelector(\"h1\");\ntitre.textContent = \"Nouveau\";"}}]},{"id":"js-evenements","title":"Réagir à un clic","summary":"addEventListener, preventDefault, et un menu simple.","minutes":12,"blocks":[{"type":"p","text":"`addEventListener` branche une fonction sur un événement : `click`, `input`, `submit`. Pour un formulaire, `event.preventDefault()` empêche le rechargement de la page le temps de lire les champs."},{"type":"code","lang":"javascript","code":"const bouton = document.querySelector(\"button\");\nconst sortie = document.querySelector(\"#sortie\");\nbouton.addEventListener(\"click\", () => {\n  sortie.textContent = \"Clic reçu\";\n});"},{"type":"demo","html":"<button id=\"b\">Incrémenter</button><p id=\"n\">0</p>","js":"const bouton = document.querySelector(\"#b\");\nconst ligne = document.querySelector(\"#n\");\nlet n = 0;\nbouton.addEventListener(\"click\", () => {\n  n = n + 1;\n  ligne.textContent = String(n);\n});"}],"exercises":[{"type":"web","id":"js-evenements-web","prompt":"Au clic sur le bouton, ajoute la classe ouvert sur le menu, ou retire-la s'il l'a déjà (classList.toggle). Le CSS montre alors les liens.","hint":"menu.classList.toggle(\"ouvert\")","files":["js"],"starter":{"html":"<button id=\"ouvrir\">Menu</button><nav id=\"menu\"><a href=\"#\">Cours</a><a href=\"#\">Atelier</a></nav>","css":"#menu{display:none;margin-top:0.5rem}#menu.ouvert{display:flex;gap:0.75rem}","js":""},"solution":{"html":"<button id=\"ouvrir\">Menu</button><nav id=\"menu\"><a href=\"#\">Cours</a><a href=\"#\">Atelier</a></nav>","css":"#menu{display:none;margin-top:0.5rem}#menu.ouvert{display:flex;gap:0.75rem}","js":"const bouton = document.querySelector(\"#ouvrir\");\nconst menu = document.querySelector(\"#menu\");\nbouton.addEventListener(\"click\", () => {\n  menu.classList.toggle(\"ouvert\");\n});"}}]},{"id":"js-page","title":"Une page qui répond","summary":"Relier un champ, un bouton et un texte.","minutes":12,"blocks":[{"type":"p","text":"Un petit programme de page tient en trois gestes : trouver les éléments, écouter, écrire un résultat dans le document. Tu connais assez pour ça. Le reste (modules, requêtes réseau, frameworks) s'apprend quand cette boucle est devenue naturelle."},{"type":"code","lang":"javascript","code":"const champ = document.querySelector(\"#prenom\");\nconst bouton = document.querySelector(\"#dire\");\nconst sortie = document.querySelector(\"#sortie\");\n\nbouton.addEventListener(\"click\", () => {\n  const prenom = champ.value.trim();\n  sortie.textContent = prenom ? `Bonjour ${prenom}` : \"Écris un prénom\";\n});"}],"exercises":[{"type":"web","id":"js-page-web","prompt":"Au clic, lis #prenom et affiche « Bonjour … » dans #sortie. Si le champ est vide, affiche « Écris un prénom ». Utilise textContent.","files":["js"],"starter":{"html":"<label for=\"prenom\">Prénom</label><input id=\"prenom\"><button id=\"dire\">Dire bonjour</button><p id=\"sortie\"></p>","css":"body{display:grid;gap:0.5rem;max-width:18rem}input,button{font:inherit;padding:0.4rem}","js":""},"solution":{"html":"<label for=\"prenom\">Prénom</label><input id=\"prenom\"><button id=\"dire\">Dire bonjour</button><p id=\"sortie\"></p>","css":"body{display:grid;gap:0.5rem;max-width:18rem}input,button{font:inherit;padding:0.4rem}","js":"const champ = document.querySelector(\"#prenom\");\nconst bouton = document.querySelector(\"#dire\");\nconst sortie = document.querySelector(\"#sortie\");\nbouton.addEventListener(\"click\", () => {\n  const prenom = champ.value.trim();\n  sortie.textContent = prenom ? `Bonjour ${prenom}` : \"Écris un prénom\";\n});"}}]}]},{"id":"js-4","title":"Données et fonctions","lessons":[{"id":"js-arrays-objects","title":"Tableaux et objets en pratique","summary":"Représenter des données réelles et les transformer.","minutes":14,"blocks":[{"type":"p","text":"Un tableau représente une suite de valeurs. Un objet représente des propriétés nommées. Une application combine souvent les deux : une liste de tâches est un tableau d’objets."},{"type":"code","lang":"javascript","code":"const taches = [\n  { id: 1, titre: \"Lire HTML\", faite: true },\n  { id: 2, titre: \"Pratiquer CSS\", faite: false }\n];\nconst restantes = taches.filter(tache => !tache.faite);\nconst titres = restantes.map(tache => tache.titre);\nconsole.log(titres);","caption":"Exemple commenté"},{"type":"ul","items":["`map()` transforme chaque élément et retourne un nouveau tableau.","`filter()` conserve les éléments qui satisfont une condition.","`find()` retourne le premier élément correspondant, ou `undefined`.","`some()` teste si au moins un élément correspond ; `every()` si tous correspondent.","Les objets et tableaux sont des valeurs référencées : deux variables peuvent désigner le même objet."]},{"type":"caution","text":"`const` empêche de réaffecter la variable, mais ne rend pas automatiquement le contenu d’un tableau ou d’un objet immuable."}],"exercises":[{"type":"quiz","id":"js-arrays-objects-q","prompt":"Quelle méthode garde uniquement les tâches non terminées ?","choices":["map()","filter()","join()","push()"],"answer":1,"explain":"`filter()` conserve les éléments pour lesquels la fonction de test renvoie true."}]},{"id":"js-functions-scope","title":"Fonctions, portée et callbacks","summary":"Découper le code en morceaux qui ont une responsabilité claire.","minutes":13,"blocks":[{"type":"p","text":"Une fonction reçoit éventuellement des valeurs, effectue un travail et peut retourner un résultat. Une fonction bien nommée décrit une action ou un calcul. Une variable locale doit rester dans la fonction quand elle n’a pas besoin d’exister ailleurs."},{"type":"code","lang":"javascript","code":"function calculerTotal(prix, quantite) {\n  return prix * quantite;\n}\nconst total = calculerTotal(2500, 3);\n[1, 2, 3].forEach(nombre => console.log(nombre));","caption":"Exemple commenté"},{"type":"ul","items":["`return` renvoie une valeur et termine l’exécution de la fonction.","Une variable déclarée dans une fonction n’est généralement pas accessible en dehors.","Un callback est une fonction passée à une autre fonction pour être appelée plus tard ou pendant un traitement.","Une fonction pure donne le même résultat pour les mêmes entrées et n’a pas d’effet de bord observable."]},{"type":"note","text":"Préfère plusieurs fonctions courtes avec des noms précis à une fonction géante qui lit des données, modifie l’interface et sauvegarde tout en même temps."}],"exercises":[{"type":"quiz","id":"js-functions-scope-q","prompt":"À quoi sert principalement `return` ?","choices":["À afficher automatiquement dans la page","À renvoyer une valeur à l’appelant","À créer une variable globale","À répéter une boucle"],"answer":1,"explain":"`return` transmet le résultat au code qui a appelé la fonction."}]},{"id":"js-local-storage","title":"Sauvegarder des données avec localStorage","summary":"Conserver une petite quantité de données entre les visites.","minutes":13,"blocks":[{"type":"p","text":"Les variables disparaissent lorsque la page est rechargée. `localStorage` conserve des chaînes dans le navigateur pour une origine donnée. Pour enregistrer un tableau ou un objet, on le convertit en JSON."},{"type":"code","lang":"javascript","code":"const taches = [{ titre: \"Réviser\", faite: false }];\nlocalStorage.setItem(\"taches\", JSON.stringify(taches));\n\nconst texte = localStorage.getItem(\"taches\");\nlet copie = [];\ntry {\n  copie = texte ? JSON.parse(texte) : [];\n} catch (erreur) {\n  console.error(\"Sauvegarde illisible\", erreur);\n}","caption":"Exemple commenté"},{"type":"ul","items":["`setItem()` enregistre une chaîne, `getItem()` la lit et `removeItem()` la supprime.","`JSON.stringify()` convertit une valeur compatible en texte ; `JSON.parse()` fait l’inverse.","Le stockage peut être désactivé, limité ou corrompu : gère les erreurs.","Ne stocke pas de mots de passe, de secrets ou de données sensibles dans localStorage.","Pour une application qui évolue, prévois une version du format de sauvegarde."]}],"exercises":[{"type":"quiz","id":"js-local-storage-q","prompt":"Pourquoi utiliser JSON.stringify() avant d’enregistrer un tableau ?","choices":["localStorage stocke principalement des chaînes","pour chiffrer le tableau","pour envoyer le tableau au serveur","pour créer du HTML"],"answer":0,"explain":"JSON.stringify transforme la structure en chaîne que localStorage peut conserver."}]},{"id":"js-events-forms","title":"Événements et formulaires interactifs","summary":"Réagir à une action sans mélanger données et affichage.","minutes":14,"blocks":[{"type":"p","text":"Un événement signale qu’une action s’est produite. Un écouteur est une fonction appelée en réponse à cet événement. Pour un formulaire, écoute `submit` plutôt que le clic d’un bouton : cela fonctionne aussi lorsque l’utilisateur valide avec le clavier."},{"type":"code","lang":"javascript","code":"const formulaire = document.querySelector(\"#form-tache\");\nconst champ = document.querySelector(\"#titre\");\nconst liste = document.querySelector(\"#liste\");\nformulaire.addEventListener(\"submit\", evenement => {\n  evenement.preventDefault();\n  const titre = champ.value.trim();\n  if (!titre) return;\n  const element = document.createElement(\"li\");\n  element.textContent = titre;\n  liste.append(element);\n  champ.value = \"\";\n});","caption":"Exemple commenté"},{"type":"ul","items":["`preventDefault()` empêche le comportement standard du formulaire lorsque le code gère l’action lui-même.","`event.target` désigne l’élément à l’origine de l’événement ; `currentTarget` désigne l’élément qui porte l’écouteur.","`textContent` insère du texte. Évite de placer du texte fourni par un utilisateur dans `innerHTML` sans assainissement adapté.","Prévois un état vide, des erreurs et une confirmation claire."]}],"exercises":[{"type":"quiz","id":"js-events-forms-q","prompt":"Pourquoi utiliser `textContent` pour afficher un texte saisi ?","choices":["Cela exécute le texte comme JavaScript","Cela l’affiche comme texte au lieu de l’interpréter comme HTML","Cela chiffre le texte","Cela sauvegarde automatiquement"],"answer":1,"explain":"textContent n’interprète pas la saisie comme des balises HTML."}]},{"id":"js-errors-debug","title":"Console, erreurs et débogage","summary":"Localiser un bug à partir de preuves.","minutes":12,"blocks":[{"type":"p","text":"Une erreur de syntaxe empêche souvent le script de démarrer. Une erreur d’exécution survient pendant son fonctionnement. Un bug logique laisse le programme tourner, mais produit un résultat incorrect. Ces problèmes demandent des démarches différentes."},{"type":"ul","items":["Lis le type d’erreur, le message et le fichier/numéro de ligne.","Reproduis le problème avec une petite entrée connue.","Inspecte les valeurs au moment où le résultat devient faux.","Utilise les points d’arrêt et l’exécution pas à pas du navigateur.","Corrige une cause à la fois, puis reteste le cas initial et les cas limites."]},{"type":"code","lang":"javascript","code":"const prix = 1200;\nconst quantite = 3;\nconst total = prix * quantite;\nconsole.log({ prix, quantite, total });","caption":"Exemple commenté"},{"type":"note","text":"Ne corrige pas une erreur en supprimant au hasard une ligne que tu ne comprends pas. Reformule d’abord ce que tu attendais et ce que tu observes."}],"exercises":[{"type":"quiz","id":"js-errors-debug-q","prompt":"Quelle démarche est la plus utile quand le total calculé est faux ?","choices":["Changer plusieurs lignes au hasard","Examiner les valeurs intermédiaires et reproduire le cas","Désactiver la console","Réécrire tout le projet"],"answer":1,"explain":"Les valeurs intermédiaires permettent d’identifier où le calcul diverge de l’attendu."}]},{"id":"js-async-fetch","title":"Asynchrone et requêtes fetch","summary":"Comprendre les opérations qui attendent une réponse.","minutes":15,"blocks":[{"type":"p","text":"Une requête réseau peut prendre du temps ou échouer. JavaScript ne doit pas bloquer toute la page en attendant. `fetch()` renvoie une promesse. Avec `async` et `await`, on peut écrire un flux plus lisible tout en traitant les erreurs."},{"type":"code","lang":"javascript","code":"async function chargerLivres() {\n  try {\n    const reponse = await fetch(\"/api/livres\");\n    if (!reponse.ok) {\n      throw new Error(\"Réponse HTTP \" + reponse.status);\n    }\n    const livres = await reponse.json();\n    console.log(livres);\n  } catch (erreur) {\n    console.error(\"Impossible de charger les livres\", erreur);\n  }\n}\nchargerLivres();","caption":"Exemple commenté"},{"type":"ul","items":["Une promesse peut être en attente, réussie ou rejetée.","`await` attend le résultat d’une promesse dans une fonction `async`.","`fetch()` ne rejette pas automatiquement la promesse pour tous les statuts HTTP d’erreur : vérifie `response.ok`.","Le serveur peut être indisponible, la connexion absente ou la réponse mal formée.","CORS est une règle du navigateur sur les requêtes entre origines ; ce n’est pas une erreur de syntaxe JavaScript."]},{"type":"caution","text":"Un exemple d’API ne fonctionne que si l’URL et le serveur existent et autorisent la requête. Une application hors ligne doit prévoir un comportement sans réseau."}],"exercises":[{"type":"quiz","id":"js-async-fetch-q","prompt":"Après `fetch()`, pourquoi vérifier `response.ok` ?","choices":["Pour vérifier si la réponse HTTP indique un succès","Pour appliquer le CSS","Pour charger localStorage","Pour fermer la promesse manuellement"],"answer":0,"explain":"fetch peut recevoir une réponse HTTP 404 ou 500 sans rejeter automatiquement la promesse."}]},{"id":"js-modules","title":"Modules et organisation du code","summary":"Séparer les responsabilités quand le projet grandit.","minutes":10,"blocks":[{"type":"p","text":"Un petit exemple peut tenir dans un fichier. Une application plus grande devient plus lisible si ses responsabilités sont séparées : données, calculs, affichage et événements. Les modules JavaScript permettent d’exporter et d’importer des fonctions ou valeurs."},{"type":"code","lang":"javascript","code":"// calculs.js\nexport function total(prix, quantite) {\n  return prix * quantite;\n}\n\n// app.js\nimport { total } from \"./calculs.js\";\nconsole.log(total(1200, 2));","caption":"Exemple commenté"},{"type":"ul","items":["`export` rend une valeur disponible hors du module.","`import` récupère une valeur exportée par un autre module.","Les chemins doivent correspondre à l’organisation des fichiers.","Selon l’environnement, ouvrir les fichiers directement en `file://` peut bloquer les modules ; un petit serveur local peut être nécessaire."]},{"type":"note","text":"Organise d’abord les fichiers par rôle. N’ajoute pas une architecture compliquée à un projet qui ne le justifie pas encore."}],"exercises":[{"type":"quiz","id":"js-modules-q","prompt":"Quel est l’intérêt principal des modules ?","choices":["Rendre tout le code global","Séparer et réutiliser des responsabilités","Remplacer le HTML","Supprimer les erreurs automatiquement"],"answer":1,"explain":"Les modules rendent les dépendances explicites et facilitent l’organisation du projet."}]}]}]},{"id":"python","title":"Python","kicker":"Programmes","summary":"Écrire un programme lisible, hors du navigateur.","chapters":[{"id":"py-1","title":"Python","lessons":[{"id":"py-pourquoi","title":"Pourquoi Python","summary":"Un langage pour des programmes, des données et des serveurs, pas seulement pour le navigateur.","minutes":6,"blocks":[{"type":"p","text":"Python s'écrit dans des fichiers `.py` et s'exécute par un interpréteur sur un ordinateur : `python3 fichier.py`. Il sert à automatiser une tâche, transformer des données, écrire un petit programme, ou construire un serveur web. Il ne remplace pas HTML : une page reste une page."},{"type":"p","text":"L'indentation n'est pas décorative. Les blocs (if, for, fonction) se marquent par des espaces au début de la ligne, en général quatre. Mélanger tabulations et espaces casse le programme."},{"type":"note","text":"Cet exercice n'exécute pas Python : il n'y a pas d'interpréteur dans la page. Tu écris le programme, tu le compares à la solution et à la sortie attendue. Sur ta machine, la commande python3 le lancera vraiment."}],"exercises":[{"type":"quiz","id":"py-pourquoi-q","prompt":"Comment Python marque-t-il un bloc d'instructions ?","choices":["Avec des accolades obligatoires","Avec l'indentation","Avec des balises","Avec des points-virgules"],"answer":1,"explain":"Le décalage des lignes forme le bloc. Oublier l'indentation est une erreur de syntaxe."}]},{"id":"py-bases","title":"Valeurs et print","summary":"Variables, types simples, et affichage.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"prenom = \"Awa\"\nage = 20\nprint(\"Bonjour\", prenom)\nprint(age + 1)"},{"type":"ul","items":["Pas de mot-clé pour déclarer : le premier `=` crée le nom.","Texte entre quotes, nombres sans quotes, booléens `True` et `False` avec une majuscule.","`print` affiche. Plusieurs arguments sont séparés par un espace.","f-string : `print(f\"{prenom} a {age} ans\")`.","`type(prenom)` et `int(\"3\")` convertit un texte en nombre. `input()` lit une ligne, toujours en texte."]}],"exercises":[{"type":"write","id":"py-bases-w","prompt":"Crée ville = \"Dakar\" et habitants = 1000, puis affiche une f-string qui contient les deux.","lang":"python","starter":"# ville et habitants\n","solution":"ville = \"Dakar\"\nhabitants = 1000\nprint(f\"{ville} : {habitants}\")","expected":"Dakar : 1000","mustInclude":["ville","habitants","print"]}]},{"id":"py-conditions","title":"Conditions","summary":"if, elif, else.","minutes":7,"blocks":[{"type":"code","lang":"python","code":"note = 12\nif note >= 16:\n    print(\"très bien\")\nelif note >= 10:\n    print(\"admis\")\nelse:\n    print(\"à reprendre\")"},{"type":"p","text":"Le `:` ouvre le bloc, les lignes suivantes sont indentées. `elif` enchaîne un cas. Les comparaisons ressemblent à celles des maths, et `==` teste l'égalité. `and`, `or`, `not` combinent."}],"exercises":[{"type":"write","id":"py-conditions-w","prompt":"Si temperature > 25, affiche chaud, sinon affiche doux. temperature vaut 27.","lang":"python","starter":"temperature = 27\n","solution":"temperature = 27\nif temperature > 25:\n    print(\"chaud\")\nelse:\n    print(\"doux\")","expected":"chaud","mustInclude":["if","else","print"]}]},{"id":"py-boucles","title":"Boucles","summary":"for, range, while.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"for i in range(3):\n    print(i)\n\nlangues = [\"HTML\", \"CSS\"]\nfor langue in langues:\n    print(langue)"},{"type":"p","text":"`range(3)` produit 0, 1, 2. `range(1, 4)` produit 1, 2, 3. `while` répète tant que la condition est vraie : pense à modifier la variable, sinon la boucle ne s'arrête pas."}],"exercises":[{"type":"write","id":"py-boucles-w","prompt":"Affiche les nombres de 1 à 3 inclus, un par ligne, avec for et range.","lang":"python","starter":"","solution":"for nombre in range(1, 4):\n    print(nombre)","expected":"1\n2\n3","mustInclude":["for","range","print"]}]},{"id":"py-fonctions","title":"Fonctions","summary":"def, paramètres, return.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"def aire(largeur, hauteur):\n    return largeur * hauteur\n\nprint(aire(4, 3))"},{"type":"p","text":"`def` nomme la fonction. `return` renvoie une valeur. Sans return, la fonction renvoie `None`. Appeler la fonction ne la définit pas : les deux lignes ont des rôles différents."}],"exercises":[{"type":"write","id":"py-fonctions-w","prompt":"Définis saluer(prenom) qui retourne la chaîne Bonjour suivie d'un espace et du prénom. Affiche saluer(\"Awa\").","lang":"python","starter":"","solution":"def saluer(prenom):\n    return \"Bonjour \" + prenom\n\nprint(saluer(\"Awa\"))","expected":"Bonjour Awa","mustInclude":["def","return","print"]}]},{"id":"py-listes","title":"Listes et dictionnaires","summary":"Crochets, append, et paires clé-valeur.","minutes":8,"blocks":[{"type":"code","lang":"python","code":"notes = [12, 15]\nnotes.append(18)\nprint(notes[0])\nprint(len(notes))\n\nlivre = {\"titre\": \"Beloved\", \"prix\": 16}\nprint(livre[\"titre\"])"},{"type":"p","text":"L'indice 0 est le premier élément. Un dictionnaire associe une clé à une valeur, comme une fiche. `len` donne le nombre d'éléments. Ces structures servent dès qu'un programme garde plus d'un nombre."}],"exercises":[{"type":"write","id":"py-listes-w","prompt":"Crée une liste de deux titres, ajoute-en un troisième avec append, et affiche la longueur.","lang":"python","starter":"","solution":"titres = [\"Beloved\", \"Sula\"]\ntitres.append(\"Jazz\")\nprint(len(titres))","expected":"3","mustInclude":["append","print","len"]}]},{"id":"py-fichiers","title":"Fichiers et programmes","summary":"Lire un texte, écrire un script qui a un début et une fin.","minutes":8,"blocks":[{"type":"p","text":"Un programme un peu utile lit ou écrit des fichiers. `with open(\"notes.txt\", encoding=\"utf-8\") as fichier:` ferme le fichier même en cas d'erreur. `fichier.read()` renvoie le texte. Pour écrire : `open(\"sortie.txt\", \"w\", encoding=\"utf-8\")`."},{"type":"code","lang":"python","code":"with open(\"notes.txt\", encoding=\"utf-8\") as fichier:\n    texte = fichier.read()\nprint(texte)"},{"type":"p","text":"Avant d'écrire le fichier, écris en français ce que le programme doit faire, en trois lignes. Ensuite seulement le code. C'est valable pour tous les langages de ce cours : une tâche claire tient dans un petit programme. Une tâche floue en produit un long."}],"exercises":[{"type":"write","id":"py-fichiers-w","prompt":"Écris le with open qui lit notes.txt en UTF-8 dans la variable texte, puis print(texte). Tu n'as pas le fichier ici : la forme du code suffit.","lang":"python","starter":"","solution":"with open(\"notes.txt\", encoding=\"utf-8\") as fichier:\n    texte = fichier.read()\nprint(texte)","mustInclude":["open","utf-8","read"]}]}]},{"id":"py-2","title":"Python : données et fonctions","lessons":[{"id":"py-collections","title":"Listes, tuples, ensembles et dictionnaires","summary":"Choisir la structure adaptée à tes données.","minutes":13,"blocks":[{"type":"p","text":"Les collections regroupent plusieurs valeurs, mais elles n’ont pas le même rôle. Choisir la bonne structure rend le code plus clair et évite des recherches inutiles."},{"type":"code","lang":"python","code":"livres = [\"Dune\", \"Beloved\", \"Matilda\"]\npoint = (12, 8)\ntags = {\"html\", \"css\", \"html\"}\nlecteur = {\"nom\": \"Awa\", \"emprunts\": 2}\nprint(livres[0])\nprint(lecteur[\"nom\"])","caption":"Exemple commenté"},{"type":"ul","items":["Une liste est ordonnée et modifiable.","Un tuple est ordonné et sert souvent à regrouper des valeurs qu’on ne prévoit pas de modifier.","Un ensemble (`set`) conserve des valeurs uniques et permet des opérations d’ensemble.","Un dictionnaire associe des clés à des valeurs.","L’accès à une clé absente peut produire `KeyError` ; utilise `get()` ou vérifie la présence si nécessaire."]}],"exercises":[{"type":"quiz","id":"py-collections-q","prompt":"Quelle structure associe directement une clé « nom » à une valeur ?","choices":["set","dict","tuple uniquement","str"],"answer":1,"explain":"Un dictionnaire stocke des associations clé-valeur."}]},{"id":"py-errors-files","title":"Fichiers et gestion des erreurs","summary":"Lire et écrire sans perdre le contrôle des erreurs.","minutes":14,"blocks":[{"type":"p","text":"Un programme peut lire un fichier, le transformer et enregistrer un résultat. Le fichier peut cependant manquer, ne pas être accessible ou contenir un texte mal formé. Le programme doit anticiper ces situations."},{"type":"code","lang":"python","code":"from pathlib import Path\nimport json\n\nchemin = Path(\"taches.json\")\ntaches = []\nif chemin.exists():\n    try:\n        taches = json.loads(chemin.read_text(encoding=\"utf-8\"))\n    except json.JSONDecodeError:\n        print(\"Le fichier contient un JSON invalide.\")\n\ntaches.append({\"titre\": \"Réviser\", \"faite\": False})\nchemin.write_text(json.dumps(taches, ensure_ascii=False, indent=2), encoding=\"utf-8\")","caption":"Exemple commenté"},{"type":"ul","items":["`Path` aide à manipuler les chemins de façon lisible.","`with open(...)` est une manière classique d’ouvrir un fichier et de le fermer proprement.","Précise l’encodage UTF-8 pour les textes.","`try/except` doit viser les erreurs que tu sais traiter, pas masquer tous les problèmes.","JSON conserve des structures de données courantes, mais pas tous les objets Python arbitraires."]}],"exercises":[{"type":"quiz","id":"py-errors-files-q","prompt":"Pourquoi utiliser un bloc `try/except` lors de la lecture d’un JSON ?","choices":["Pour garantir qu’il est toujours correct","Pour gérer une erreur de lecture ou de format","Pour accélérer le processeur","Pour transformer Python en HTML"],"answer":1,"explain":"Le fichier peut être absent, illisible ou contenir un JSON invalide ; il faut traiter ces cas."}]},{"id":"py-functions-tests","title":"Fonctions et tests simples","summary":"Vérifier un résultat plutôt que supposer qu’il est juste.","minutes":12,"blocks":[{"type":"p","text":"Une fonction isole un calcul ou une action. Elle doit recevoir les informations dont elle a besoin et retourner un résultat facile à vérifier. Les tests donnent des exemples précis de comportement attendu."},{"type":"code","lang":"python","code":"def total(prix, quantite):\n    if prix < 0 or quantite < 0:\n        raise ValueError(\"Les valeurs doivent être positives ou nulles\")\n    return prix * quantite\n\nassert total(1200, 3) == 3600\nassert total(0, 4) == 0","caption":"Exemple commenté"},{"type":"ul","items":["Les paramètres rendent la fonction réutilisable.","`return` transmet le résultat.","Une exception signale une situation que la fonction ne peut pas accepter normalement.","Un test doit couvrir un cas ordinaire, une limite et un cas invalide quand cela a du sens.","`assert` est utile pour apprendre et vérifier des hypothèses ; les projets sérieux utilisent souvent un cadre de test dédié."]}],"exercises":[{"type":"quiz","id":"py-functions-tests-q","prompt":"Quel est le rôle d’une assertion dans un test ?","choices":["Vérifier qu’une condition attendue est vraie","Créer une interface graphique","Enregistrer un mot de passe","Installer Python"],"answer":0,"explain":"Une assertion échoue si la condition testée est fausse."}]}]}]},{"id":"php","title":"PHP","kicker":"Le serveur","summary":"Produire une page, lire un formulaire, parler à une base sans l'exposer.","chapters":[{"id":"php-1","title":"PHP","lessons":[{"id":"php-serveur","title":"Côté serveur","summary":"Ce que le visiteur ne voit pas calculer.","minutes":7,"blocks":[{"type":"p","text":"Le navigateur reçoit du HTML. PHP travaille avant, sur le serveur : il peut décider du HTML à envoyer, lire un formulaire, ouvrir une session, parler à une base. Le visiteur ne reçoit en général pas le fichier `.php`, il reçoit le résultat."},{"type":"ul","items":["Un fichier PHP commence par `<?php` et se termine souvent par `?>` (omis en fin de fichier pur).","Il faut un serveur qui comprend PHP. Ouvrir le fichier en double clic montre le code, pas la page.","Tout ce qui est secret (mot de passe de base, clé) reste sur le serveur, jamais dans JavaScript ni dans le HTML."]},{"type":"note","text":"Comme pour Python, tu t'entraînes ici à écrire. PHP ne s'exécute pas dans l'aperçu."}],"exercises":[{"type":"quiz","id":"php-serveur-q","prompt":"Où s'exécute PHP ?","choices":["Dans le CSS","Sur le serveur, avant d'envoyer la page","Uniquement dans la console du visiteur","Dans l'attribut alt"],"answer":1,"explain":"PHP produit souvent le HTML que le navigateur affichera. Le calcul a déjà eu lieu."}]},{"id":"php-bases","title":"echo, variables, chaînes","summary":"Les premiers signes du langage.","minutes":8,"blocks":[{"type":"code","lang":"php","code":"<?php\n$prenom = \"Awa\";\n$age = 20;\necho \"Bonjour \" . $prenom;\necho \"<p>Âge : \" . $age . \"</p>\";"},{"type":"ul","items":["Toute variable commence par `$`.","`echo` envoie du texte vers la page. Le point `.` concatène.","Une instruction se termine par `;`.","Les chaînes doubles interprètent `$prenom`. Les chaînes simples non. En cas de doute, concatène.","`// commentaire` ou `/* bloc */`."]},{"type":"caution","text":"Echo d'un texte venu du visiteur directement dans le HTML peut créer une faille XSS. On échappe d'abord avec `htmlspecialchars`."}],"exercises":[{"type":"write","id":"php-bases-w","prompt":"Déclare $titre = \"Atrium\" et echo un h1 qui contient cette variable, en concaténant.","lang":"php","starter":"<?php\n","solution":"<?php\n$titre = \"Atrium\";\necho \"<h1>\" . $titre . \"</h1>\";","expected":"<h1>Atrium</h1>","mustInclude":["$titre","echo"]}]},{"id":"php-conditions","title":"Conditions et listes","summary":"if, tableaux, foreach.","minutes":8,"blocks":[{"type":"code","lang":"php","code":"<?php\n$langues = [\"HTML\", \"CSS\", \"PHP\"];\nforeach ($langues as $langue) {\n    echo \"<li>\" . htmlspecialchars($langue) . \"</li>\";\n}"},{"type":"p","text":"`if ($age >= 18) { ... } else { ... }` ressemble à JavaScript, avec le dollar et des accolades. `foreach` parcourt un tableau. `[]` crée un tableau. `count($langues)` donne la longueur."}],"exercises":[{"type":"write","id":"php-conditions-w","prompt":"Si $note >= 10, echo admis, sinon echo refusé. $note vaut 12.","lang":"php","starter":"<?php\n$note = 12;\n","solution":"<?php\n$note = 12;\nif ($note >= 10) {\n    echo \"admis\";\n} else {\n    echo \"refusé\";\n}","expected":"admis","mustInclude":["if","else","echo"]}]},{"id":"php-formulaires","title":"Lire un formulaire","summary":"$_POST, et pourquoi le HTML ne suffit pas.","minutes":10,"blocks":[{"type":"p","text":"Quand un formulaire `method=\"post\"` est envoyé vers un script PHP, les champs `name` arrivent dans le tableau `$_POST`. `$_GET` correspond à method get et à l'adresse."},{"type":"code","lang":"php","code":"<?php\n$email = $_POST[\"email\"] ?? \"\";\n$email = trim($email);\nif ($email === \"\") {\n    echo \"E-mail manquant\";\n} else {\n    echo \"Reçu\";\n}"},{"type":"ul","items":["Le `name` HTML et la clé PHP doivent être les mêmes.","`??` fournit une valeur si la clé n'existe pas.","Revérifie sur le serveur : required dans le HTML peut être contourné.","N'affiche pas l'e-mail brut dans la page sans `htmlspecialchars`.","Un mot de passe ne se stocke pas tel quel : on enregistre une empreinte (`password_hash`) et on vérifie avec `password_verify`."]}],"exercises":[{"type":"write","id":"php-formulaires-w","prompt":"Lis $_POST[\"pseudo\"], utilise ?? \"\", passe-le dans trim, et si la chaîne est vide echo « Pseudo manquant », sinon echo « Bonjour ».","lang":"php","starter":"<?php\n","solution":"<?php\n$pseudo = trim($_POST[\"pseudo\"] ?? \"\");\nif ($pseudo === \"\") {\n    echo \"Pseudo manquant\";\n} else {\n    echo \"Bonjour\";\n}","mustInclude":["$_POST","trim","echo"]}]},{"id":"php-donnees","title":"Sessions et base","summary":"Se souvenir d'une personne, sans coller SQL et variables.","minutes":9,"blocks":[{"type":"p","text":"HTTP oublie le visiteur entre deux requêtes. `session_start()` puis `$_SESSION[\"user_id\"]` gardent un identifiant côté serveur, relié à un cookie de session. Ce n'est pas un mot de passe stocké dans le cookie."},{"type":"p","text":"Pour enregistrer vraiment, PHP parle à une base avec SQL. On n'assemble jamais une requête en collant une variable :"},{"type":"code","lang":"php","code":"<?php\n// À ne pas faire : \"SELECT * FROM users WHERE email = '$email'\"\n// À faire : une requête préparée, la valeur envoyée à part.\n$stmt = $pdo->prepare(\"SELECT id FROM users WHERE email = ?\");\n$stmt->execute([$email]);"},{"type":"caution","text":"Coller `$email` dans le SQL permet une injection : la personne peut fermer la chaîne et ajouter une commande. La requête préparée sépare le texte SQL des valeurs."}],"exercises":[{"type":"quiz","id":"php-donnees-q","prompt":"Pourquoi éviter SELECT ... WHERE email = '$email' ?","choices":["Parce que les dollars sont interdits en SQL","Parce qu'une valeur peut modifier la requête","Parce que POST n'existe pas","Parce que htmlspecialchars remplace SQL"],"answer":1,"explain":"C'est l'injection SQL. Les requêtes préparées envoient la valeur à côté de la phrase SQL, pas dedans."}]}]},{"id":"php-2","title":"PHP : requêtes et sécurité","lessons":[{"id":"php-pdo","title":"Connexion SQL avec PDO","summary":"Lire et modifier les données avec des requêtes préparées.","minutes":14,"blocks":[{"type":"p","text":"PHP peut recevoir une requête du navigateur, interroger une base puis produire une réponse. PDO fournit une interface pour accéder à plusieurs bases. Les valeurs fournies par un utilisateur ne doivent pas être concaténées directement dans une requête SQL."},{"type":"code","lang":"php","code":"$pdo = new PDO($dsn, $utilisateur, $motDePasse, [\n    PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n]);\n$stmt = $pdo->prepare(\"SELECT id, titre FROM livres WHERE auteur = :auteur\");\n$stmt->execute([\"auteur\" => $auteur]);\n$livres = $stmt->fetchAll(PDO::FETCH_ASSOC);","caption":"Exemple commenté"},{"type":"ul","items":["Une requête préparée sépare la structure SQL des valeurs.","Les identifiants et mots de passe de base doivent rester dans la configuration du serveur, pas dans le JavaScript public.","Traite les erreurs côté serveur sans afficher de secrets ou de traces internes aux visiteurs.","La syntaxe et le pilote disponibles dépendent de la base choisie."]}],"exercises":[{"type":"quiz","id":"php-pdo-q","prompt":"Pourquoi utiliser une requête préparée ?","choices":["Pour réduire les risques d’injection SQL","Pour colorer les liens","Pour remplacer HTML","Pour cacher le code au navigateur"],"answer":0,"explain":"Les paramètres empêchent les valeurs saisies de réécrire la structure de la requête SQL."}]},{"id":"php-password-sessions","title":"Mots de passe et sessions","summary":"Les bases d’une connexion responsable.","minutes":14,"blocks":[{"type":"p","text":"Un système de connexion doit traiter les mots de passe et les sessions avec soin. On ne stocke jamais le mot de passe en clair. PHP fournit des fonctions dédiées au hachage et à la vérification."},{"type":"code","lang":"php","code":"$empreinte = password_hash($motDePasse, PASSWORD_DEFAULT);\n\n// Lors de la connexion :\nif (password_verify($motDePasseSaisi, $empreinteEnBase)) {\n    session_start();\n    session_regenerate_id(true);\n    $_SESSION[\"utilisateur_id\"] = $idUtilisateur;\n}","caption":"Exemple commenté"},{"type":"ul","items":["Le hachage de mot de passe est conçu pour la vérification, pas pour retrouver le mot de passe original.","La session permet de conserver un état côté serveur entre plusieurs requêtes.","Régénère l’identifiant de session après une authentification réussie.","Configure les cookies de session avec des options adaptées, utilise HTTPS et protège les routes privées.","Prévois la déconnexion et l’expiration des sessions."]}],"exercises":[{"type":"quiz","id":"php-password-sessions-q","prompt":"Quelle fonction vérifie un mot de passe contre son empreinte stockée ?","choices":["password_verify()","base64_encode()","htmlspecialchars()","session_destroy()"],"answer":0,"explain":"password_verify compare le mot de passe saisi à l’empreinte créée par password_hash."}]},{"id":"php-output-validation","title":"Validation et affichage sûr","summary":"Ne pas confondre validation, échappement et confiance.","minutes":12,"blocks":[{"type":"p","text":"Les données venant d’un formulaire sont non fiables, même si le navigateur a déjà vérifié le champ. Le serveur doit valider ce qu’il accepte, puis échapper les données au moment de les afficher dans un contexte HTML."},{"type":"code","lang":"php","code":"$nom = trim($_POST[\"nom\"] ?? \"\");\nif ($nom === \"\") {\n    $erreur = \"Le nom est obligatoire.\";\n}\n\necho htmlspecialchars($nom, ENT_QUOTES | ENT_SUBSTITUTE, \"UTF-8\");","caption":"Exemple commenté"},{"type":"ul","items":["La validation décide si une valeur respecte les règles métier.","La normalisation met une valeur dans un format cohérent, quand c’est approprié.","L’échappement transforme les caractères pour éviter qu’ils soient interprétés comme du balisage dans le contexte HTML.","Les requêtes préparées protègent les valeurs SQL ; `htmlspecialchars` ne remplace pas cette protection.","Les jetons CSRF, les permissions et les contrôles serveur restent nécessaires pour des actions sensibles."]}],"exercises":[{"type":"quiz","id":"php-output-validation-q","prompt":"Que fait `htmlspecialchars()` dans un affichage HTML ?","choices":["Remplace certains caractères pour qu’ils soient affichés comme texte","Vérifie l’identité de la personne","Chiffre la base SQL","Empêche toute attaque dans tous les contextes"],"answer":0,"explain":"Cette fonction aide à éviter que les caractères HTML soient interprétés comme des balises dans le contexte visé ; elle ne protège pas tout à elle seule."}]}]}]},{"id":"sql","title":"SQL","kicker":"Les données","summary":"Lire, filtrer et modifier des tables, puis les relier.","chapters":[{"id":"sql-1","title":"SQL","lessons":[{"id":"sql-tables","title":"Tables, lignes, colonnes","summary":"Ce qu'une base range, avant d'écrire une requête.","minutes":7,"blocks":[{"type":"p","text":"Une base de données relationnelle range des tables. Une table a des colonnes (titre, auteur, prix) et des lignes (un livre par ligne). SQL est le langage pour interroger et modifier ces tables. Il ne dessine pas la page : un autre programme (PHP, Python, JavaScript serveur) envoie le SQL et reçoit les lignes."},{"type":"ul","items":["Une colonne a un rôle stable. On ne met pas le prix dans la colonne du titre.","Chaque ligne devrait se distinguer, souvent par un `id` numérique.","On n'écrit pas deux fois la même information si on peut l'éviter : le lecteur d'un emprunt référence `livre_id`, il ne recopie pas tout le livre."]},{"type":"note","text":"Le bac à sable exécute une requête à la fois sur les tables de l'exercice : SELECT, INSERT, UPDATE, DELETE, et un INNER JOIN simple. Pas de CREATE TABLE ici."}],"exercises":[{"type":"quiz","id":"sql-tables-q","prompt":"Dans une table de livres, une ligne représente plutôt…","choices":["Toute la bibliothèque","Un livre","Une colonne","Le fichier CSS"],"answer":1,"explain":"Chaque ligne est un enregistrement. Les colonnes sont les champs de cet enregistrement."}]},{"id":"sql-select","title":"Lire avec SELECT","summary":"Choisir des colonnes et lire des lignes.","minutes":9,"blocks":[{"type":"code","lang":"sql","code":"SELECT titre, auteur\nFROM livres;"},{"type":"p","text":"`SELECT *` prend toutes les colonnes. Nommer les colonnes est plus clair. `FROM` dit la table. L'ordre des colonnes dans SELECT est l'ordre du résultat, pas l'ordre de la table. `ORDER BY prix DESC` trie, du plus grand au plus petit. `ASC` est le sens par défaut."},{"type":"table","caption":"livres, au départ de chaque exercice","headers":["id","titre","auteur","prix"],"rows":[["1","L'étranger","Camus","9"],["2","Poésies","Césaire","14"],["3","Une si longue lettre","Bâ","11"],["4","Beloved","Morrison","16"]]}],"exercises":[{"type":"sql","id":"sql-select-ex","prompt":"Affiche le titre et le prix de tous les livres, du plus cher au moins cher.","starter":"SELECT titre\nFROM livres;","solution":"SELECT titre, prix\nFROM livres\nORDER BY prix DESC;","seeds":[{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"Deux colonnes, titre puis prix, Beloved en premier."}]},{"id":"sql-filtrer","title":"Filtrer avec WHERE","summary":"Ne garder que les lignes qui t'intéressent.","minutes":8,"blocks":[{"type":"code","lang":"sql","code":"SELECT titre, prix\nFROM livres\nWHERE prix < 12 AND auteur = 'Camus';"},{"type":"p","text":"Le texte se met entre quotes simples. Le nombre non. `=`, `<`, `>`, `<=`, `>=`, `<>` comparent. `AND` exige les deux conditions. `OR` en demanderait une seule. WHERE se place après FROM et avant ORDER BY."}],"exercises":[{"type":"sql","id":"sql-filtrer-ex","prompt":"Titres des livres dont le prix est strictement inférieur à 12.","starter":"SELECT titre\nFROM livres;","solution":"SELECT titre\nFROM livres\nWHERE prix < 12;","seeds":[{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"L'étranger et Une si longue lettre."}]},{"id":"sql-modifier","title":"Ajouter, modifier, supprimer","summary":"INSERT, UPDATE, DELETE — et le WHERE qui protège.","minutes":10,"blocks":[{"type":"code","lang":"sql","code":"INSERT INTO livres (id, titre, auteur, prix)\nVALUES (5, 'Sula', 'Morrison', 13);\n\nUPDATE livres\nSET prix = 15\nWHERE id = 2;\n\nDELETE FROM livres\nWHERE id = 5;"},{"type":"caution","text":"UPDATE ou DELETE sans WHERE modifie ou vide toute la table. Relis la condition avant de lancer ça sur une vraie base. Ici, chaque exécution repart des données de départ."}],"exercises":[{"type":"sql","id":"sql-modifier-ex","prompt":"Passe le prix de Beloved (id 4) à 18. Ne change pas les autres lignes.","starter":"UPDATE livres\nSET prix = 18;","solution":"UPDATE livres\nSET prix = 18\nWHERE id = 4;","seeds":[{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"Une seule ligne change : Beloved vaut 18."},{"type":"quiz","id":"sql-modifier-q","prompt":"Que fait DELETE FROM livres; sans WHERE ?","choices":["Supprime la colonne prix","Supprime toutes les lignes","Supprime la base entière quoi qu'il arrive","N'a aucun effet"],"answer":1,"explain":"Sans filtre, toutes les lignes de la table partent. La structure de la table, elle, reste."}]},{"id":"sql-joindre","title":"Relier deux tables","summary":"INNER JOIN quand une ligne en désigne une autre.","minutes":10,"blocks":[{"type":"p","text":"emprunts ne recopie pas le titre du livre : il garde `livre_id`. Pour voir le titre et le lecteur ensemble, on joint."},{"type":"code","lang":"sql","code":"SELECT livres.titre, emprunts.lecteur\nFROM livres\nINNER JOIN emprunts ON livres.id = emprunts.livre_id;"},{"type":"p","text":"INNER JOIN ne garde que les lignes qui trouvent une correspondance. Un livre jamais emprunté n'apparaît pas. Quand un nom de colonne existe des deux côtés (`id`), on le préfixe : `livres.id`. Les jointures sont la raison de séparer les tables plutôt que tout empiler dans une seule."}],"exercises":[{"type":"sql","id":"sql-joindre-ex","prompt":"Affiche le lecteur et le titre du livre emprunté, pour chaque emprunt.","starter":"SELECT lecteur\nFROM emprunts;","solution":"SELECT emprunts.lecteur, livres.titre\nFROM emprunts\nINNER JOIN livres ON emprunts.livre_id = livres.id;","seeds":[{"name":"emprunts","columns":["id","livre_id","lecteur"],"rows":[[1,1,"Awa"],[2,4,"Jonas"],[3,1,"Léa"]]},{"name":"livres","columns":["id","titre","auteur","prix"],"rows":[[1,"L'étranger","Camus",9],[2,"Poésies","Césaire",14],[3,"Une si longue lettre","Bâ",11],[4,"Beloved","Morrison",16]]}],"goal":"Awa et Léa avec L'étranger, Jonas avec Beloved."}]}]},{"id":"sql-2","title":"SQL : relations et agrégations","lessons":[{"id":"sql-aggregates","title":"Compter, regrouper et filtrer des groupes","summary":"Utiliser COUNT, SUM, GROUP BY et HAVING.","minutes":13,"blocks":[{"type":"p","text":"Les agrégations résument plusieurs lignes. `COUNT` compte, `SUM` additionne, `AVG` calcule une moyenne, `MIN` et `MAX` trouvent les extrêmes. `GROUP BY` forme des groupes ; `HAVING` filtre ces groupes après agrégation."},{"type":"code","lang":"sql","code":"SELECT categorie, COUNT(*) AS nombre, SUM(prix) AS total\nFROM livres\nGROUP BY categorie\nHAVING COUNT(*) >= 2\nORDER BY total DESC;","caption":"Exemple commenté"},{"type":"ul","items":["`WHERE` filtre les lignes avant le regroupement.","`HAVING` filtre les groupes produits par `GROUP BY`.","Un alias avec `AS` rend le résultat plus compréhensible.","Les règles sur les colonnes non agrégées varient selon le moteur et son mode de validation."]},{"type":"note","text":"Le moteur SQL intégré à Atrium est simplifié : certaines fonctions et clauses présentées dans un cours général peuvent ne pas être prises en charge par son interpréteur pédagogique."}],"exercises":[{"type":"quiz","id":"sql-aggregates-q","prompt":"Quelle clause filtre les groupes après un GROUP BY ?","choices":["WHERE","HAVING","ORDER BY","VALUES"],"answer":1,"explain":"HAVING s’applique aux groupes ; WHERE filtre les lignes avant leur regroupement."}]},{"id":"sql-relations-keys","title":"Clés primaires et étrangères","summary":"Modéliser les relations sans dupliquer toutes les données.","minutes":13,"blocks":[{"type":"p","text":"Une base relationnelle sépare les entités en tables reliées par des identifiants. Une clé primaire identifie une ligne. Une clé étrangère référence une ligne d’une autre table et permet de représenter une relation."},{"type":"code","lang":"sql","code":"CREATE TABLE livres (\n  id INTEGER PRIMARY KEY,\n  titre TEXT NOT NULL\n);\nCREATE TABLE emprunts (\n  id INTEGER PRIMARY KEY,\n  livre_id INTEGER NOT NULL,\n  lecteur TEXT NOT NULL,\n  FOREIGN KEY (livre_id) REFERENCES livres(id)\n);","caption":"Exemple commenté"},{"type":"ul","items":["Une relation un-à-plusieurs : un livre peut apparaître dans plusieurs emprunts.","Une relation plusieurs-à-plusieurs se représente généralement par une table de liaison.","Les contraintes `NOT NULL`, `UNIQUE` et les clés étrangères protègent la cohérence des données.","La syntaxe exacte et l’activation des clés étrangères peuvent dépendre du moteur SQL."]}],"exercises":[{"type":"quiz","id":"sql-relations-keys-q","prompt":"À quoi sert une clé étrangère ?","choices":["À relier une ligne à une ligne d’une autre table","À changer la couleur de la table","À trier automatiquement toutes les données","À chiffrer le mot de passe"],"answer":0,"explain":"Elle exprime une référence entre tables et contribue à l’intégrité référentielle."}]},{"id":"sql-transactions-indexes","title":"Transactions et index : premières notions","summary":"Comprendre cohérence et recherche efficace.","minutes":12,"blocks":[{"type":"p","text":"Une transaction regroupe plusieurs opérations qui doivent être traitées comme un ensemble cohérent. Si une étape échoue, on peut annuler les modifications non validées. Un index peut accélérer certaines recherches, mais il a un coût en espace et ralentit parfois les écritures."},{"type":"code","lang":"sql","code":"BEGIN;\nUPDATE comptes SET solde = solde - 100 WHERE id = 1;\nUPDATE comptes SET solde = solde + 100 WHERE id = 2;\nCOMMIT;","caption":"Exemple commenté"},{"type":"ul","items":["`COMMIT` valide la transaction.","`ROLLBACK` annule les changements non validés lorsque le moteur le permet.","Une transaction ne remplace pas les règles de validation ni les contrôles métier.","Un index est utile sur certaines colonnes souvent recherchées ou jointes ; il faut le choisir à partir des requêtes réelles."]},{"type":"caution","text":"Les commandes et garanties transactionnelles varient selon le moteur et les tables utilisées. L’exemple est conceptuel et ne constitue pas une application bancaire prête à l’emploi."}],"exercises":[{"type":"quiz","id":"sql-transactions-indexes-q","prompt":"Quel est le rôle général de ROLLBACK ?","choices":["Annuler les changements non validés d’une transaction","Créer une table","Afficher une image","Trier par ordre alphabétique"],"answer":0,"explain":"ROLLBACK annule la transaction en cours, dans les limites du moteur utilisé."}]}]}]},{"id":"pratique","title":"Pratique","kicker":"Outils et mise en ligne","summary":"Méthode, sécurité minimale, et ce que veut dire publier une page.","chapters":[{"id":"prat-1","title":"Travailler","lessons":[{"id":"prat-outils","title":"Fichiers, éditeur, navigateur","summary":"Le minimum pour travailler sans te perdre.","minutes":8,"blocks":[{"type":"ul","items":["Un dossier de projet : `index.html`, `style.css`, `site.js`, un dossier `images`. Des noms courts, sans espaces.","Un éditeur (VS Code, Zed, ou un autre) colore le code et montre les erreurs de frappe.","Le navigateur affiche la page. Les outils de développement (inspecter) montrent le HTML réel, le CSS appliqué, et la console.","Recharge la page après une modification. Si un fichier ne change pas, c'est souvent un cache ou un mauvais chemin dans `href` ou `src`.","Git, plus tard, photographie l'historique : un commit est une sauvegarde commentée. Tu n'en as pas besoin pour la première page. Tu en auras besoin dès que tu as peur de casser quelque chose."]},{"type":"p","text":"Les commentaires (`<!-- -->`, `/* */`, `//`) expliquent une décision étrange. Ils ne répètent pas ce que la ligne dit déjà."}],"exercises":[{"type":"quiz","id":"prat-outils-q","prompt":"Le CSS ne semble pas s'appliquer. Quoi vérifier en premier ?","choices":["La couleur du bureau","Le chemin dans link href, et que le fichier est bien enregistré","Le DOCTYPE, qui bloque le CSS","Le alt des images"],"answer":1,"explain":"Un href faux ou un fichier non enregistré explique la plupart des « mon CSS ne marche pas » du début."}]},{"id":"prat-qualite","title":"Avancer par petits pas","summary":"Une méthode plus utile qu'un framework.","minutes":6,"blocks":[{"type":"ol","items":["Écris en une phrase ce que la page doit faire.","Pose le HTML sans style. Le plan se lit-il ?","Ajoute le CSS d'une zone, recharge, puis la suivante.","Ajoute un seul comportement JavaScript, teste le clic, puis le suivant.","Nomme d'après le rôle : `.carte`, `.prix`, pas `.bleu` ni `.truc`.","Quand ça casse, retire la dernière modification au lieu d'en empiler une autre."]},{"type":"note","text":"Relire son code à voix haute, ligne à ligne, trouve autant d'erreurs qu'un outil. Surtout une balise non fermée, une accolade, une quote."}],"exercises":[{"type":"quiz","id":"prat-qualite-q","prompt":"Tu ajoutes dix règles CSS d'un coup et la page « casse ». Que faire ?","choices":["Tout réécrire dans un autre langage","Revenir à la dernière version qui marchait et réintroduire peu à peu","Mettre !important partout","Supprimer le DOCTYPE"],"answer":1,"explain":"Un petit pas se défait. Un gros tas de changements cache la ligne fautive."}]},{"id":"prat-securite","title":"Sécurité, le minimum","summary":"Ne pas faire confiance au navigateur.","minutes":9,"blocks":[{"type":"ul","items":["La validation HTML aide la personne. Le serveur revérifie, toujours.","Les mots de passe se stockent sous forme d'empreinte, jamais en clair, jamais dans un fichier JS.","XSS : un texte de visiteur inséré comme HTML peut devenir une balise. Affiche-le comme texte.","Injection SQL : une valeur collée dans une requête peut la réécrire. Requêtes préparées.","Fichiers téléversés : limite la taille, le type, et ne les exécute pas comme du code.","HTTPS chiffre l'échange entre le navigateur et le serveur. Un formulaire de connexion sans HTTPS montre le mot de passe sur le réseau.","`target=\"_blank\"` s'accompagne de `rel=\"noopener noreferrer\"`."]},{"type":"p","text":"Tu n'as pas à devenir spécialiste pour appliquer ces réflexes. Ils empêchent les erreurs qui font mal dès la première inscription."}],"exercises":[{"type":"quiz","id":"prat-securite-q","prompt":"Un champ required suffit-il à garantir un e-mail valide côté serveur ?","choices":["Oui, le navigateur l'impose à tous","Non, la requête peut être envoyée autrement","Oui, si la page est en HTML5","Non, seulement parce que POST efface le champ"],"answer":1,"explain":"N'importe qui peut envoyer une requête sans passer par ton formulaire. Le serveur revérifie."}]},{"id":"prat-ligne","title":"Mettre en ligne","summary":"Du fichier sur ton ordinateur à une adresse.","minutes":8,"blocks":[{"type":"p","text":"Tant que tes fichiers sont sur ta machine, toi seul les ouvres. Les mettre en ligne, c'est les copier sur un ordinateur qui répond à une adresse. Pour un site de pages HTML, CSS et JavaScript, un hébergement statique suffit : il sert les fichiers tels quels."},{"type":"ul","items":["PHP a besoin d'un hébergement qui exécute PHP, pas d'un simple dépôt de fichiers.","Une base SQL est un service à part, avec un identifiant que tu ne publies pas dans le code front.","Un nom de domaine pointe vers l'hébergement grâce au DNS. Le domaine n'est pas le site : c'est l'adresse.","Vérifie les chemins relatifs une fois en ligne. `images/a.webp` doit exister au même endroit relatif que sur ta machine.","Regarde la page sur un téléphone après la mise en ligne, pas seulement dans la fenêtre large de l'éditeur."]},{"type":"note","text":"Tu peux déjà finir le parcours dans l'atelier : une page complète, lisible, avec formulaire qui ne prétend pas encore enregistrer. Brancher un vrai serveur sera une étape suivante, pas un mystère nouveau."}],"exercises":[{"type":"web","id":"prat-ligne-web","prompt":"Compose dans l'atelier de l'exercice une carte de visite : un header avec ton nom en h1, un paragraphe, une liste de trois liens ou compétences, et un fond de page lisible en CSS. C'est ta page à mettre en ligne le jour où tu voudras.","files":["html","css"],"starter":{"html":"<header>\n  <h1></h1>\n</header>\n<main>\n</main>","css":"body { margin: 0; font-family: Georgia, serif; }","js":""},"solution":{"html":"<header>\n  <h1>Awa Ndiaye</h1>\n</header>\n<main>\n  <p>J'apprends à construire des pages claires.</p>\n  <ul>\n    <li>HTML</li>\n    <li>CSS</li>\n    <li>JavaScript</li>\n  </ul>\n</main>","css":"body{margin:0;font-family:Georgia,serif;background:#f4efe6;color:#1c1915}\nheader,main{padding:1.25rem 1.5rem;max-width:36rem}\nh1{margin:0 0 .5rem;font-weight:560}\na{color:#0e6b52}","js":""}}]}]},{"id":"prat-2","title":"Outils et qualité du code","lessons":[{"id":"git-basics","title":"Git : garder un historique","summary":"Pouvoir revenir en arrière sans perdre ton travail.","minutes":12,"blocks":[{"type":"p","text":"Git suit les changements d’un projet. Un commit est un instantané commenté de l’état choisi. Il ne s’agit pas seulement de sauvegarder : l’historique permet de comprendre quand un changement est arrivé et de revenir à un état antérieur."},{"type":"code","lang":"bash","code":"git init\ngit status\ngit add index.html style.css\ngit commit -m \"Créer la première page\"\ngit log --oneline","caption":"Exemple commenté"},{"type":"ul","items":["`git status` montre les fichiers modifiés et préparés.","`git add` prépare les changements qui entreront dans le prochain commit.","`git commit` enregistre un instantané local.","Git et GitHub ne sont pas la même chose : Git est l’outil de versionnage, GitHub est une plateforme d’hébergement de dépôts.","Ne place jamais de secrets, clés d’API ou mots de passe dans un dépôt public."]}],"exercises":[{"type":"quiz","id":"git-basics-q","prompt":"À quoi sert principalement un commit Git ?","choices":["Enregistrer un instantané commenté du projet","Publier automatiquement un site sur Internet","Exécuter du PHP","Remplacer une base SQL"],"answer":0,"explain":"Un commit enregistre une version des changements préparés dans l’historique Git."}]},{"id":"testing-checklist","title":"Tester un projet avant de le déclarer terminé","summary":"Vérifier plus que le cas qui marche une fois.","minutes":11,"blocks":[{"type":"p","text":"Tester, c’est comparer le comportement réel au comportement attendu. Un projet ne devrait pas être considéré comme terminé parce qu’il fonctionne une fois sur l’écran de la personne qui l’a écrit."},{"type":"ul","items":["Teste le cas normal, les champs vides, les valeurs limites et les entrées inattendues.","Teste au clavier et sur un écran étroit.","Vérifie ce qui se passe quand le réseau est absent ou qu’une donnée manque.","Après une correction, rejoue le scénario qui échouait : c’est un test de non-régression.","Note les étapes pour reproduire un bug, le résultat attendu et le résultat observé."]},{"type":"code","lang":"text","code":"Exemple de fiche de bug\n1. Ouvrir le formulaire.\n2. Envoyer sans titre.\nAttendu : un message explique le champ manquant.\nObservé : une tâche vide apparaît.\nRésultat : échec du test.","caption":"Exemple commenté"},{"type":"note","text":"Une bonne fiche de bug décrit ce qui se passe sans accuser la personne qui utilise l’application."}],"exercises":[{"type":"quiz","id":"testing-checklist-q","prompt":"Pourquoi retester après une correction ?","choices":["Pour vérifier que le problème est résolu et qu’il n’a pas cassé autre chose","Pour faire grossir le projet","Pour supprimer les commentaires","Pour éviter d’écrire du code"],"answer":0,"explain":"Le test de non-régression vérifie qu’une correction n’a pas introduit un autre défaut."}]},{"id":"project-planning","title":"Planifier un projet sans se perdre","summary":"Transformer une idée en étapes testables.","minutes":10,"blocks":[{"type":"p","text":"Avant d’écrire du code, décris le besoin en termes observables. « Faire une belle application » est trop vague. « L’utilisateur peut ajouter une tâche, la marquer comme terminée et retrouver la liste après rechargement » peut être vérifié."},{"type":"ul","items":["Écris le but et les utilisateurs concernés.","Liste les fonctionnalités indispensables et celles qui peuvent attendre.","Décompose chaque fonctionnalité en petites étapes.","Définis un critère de réussite observable pour chaque étape.","Construis une version minimale, teste-la, puis améliore-la."]},{"type":"code","lang":"text","code":"Projet : gestionnaire de tâches\n- Ajouter une tâche non vide.\n- Afficher la tâche dans la liste.\n- Marquer la tâche comme faite.\n- Supprimer une tâche.\n- Conserver les tâches après rechargement.\n- Afficher un état vide si la liste est vide.","caption":"Exemple commenté"},{"type":"note","text":"Finir une petite version cohérente vaut mieux qu’accumuler vingt fonctionnalités inachevées."}],"exercises":[{"type":"quiz","id":"project-planning-q","prompt":"Quel objectif est le plus facile à vérifier ?","choices":["Faire une application magnifique","Ajouter une tâche non vide et la retrouver après rechargement","Créer le meilleur site du monde","Améliorer le code"],"answer":1,"explain":"Un critère précis permet de vérifier objectivement si la fonctionnalité est terminée."}]}]},{"id":"prat-3","title":"Projets de synthèse","lessons":[{"id":"project-capstone-web","title":"Projet guidé : mini-portfolio responsive","summary":"Réunir HTML, CSS, accessibilité et méthode de test.","minutes":20,"blocks":[{"type":"p","text":"Le projet final du parcours front-end consiste à créer une page personnelle responsive. Il n’y a pas de récompense ni de note automatique : le but est de vérifier que tu peux réutiliser les notions dans un contexte nouveau."},{"type":"h","text":"Cahier des charges"},{"type":"ul","items":["Une structure HTML avec `header`, `nav`, `main`, plusieurs sections et `footer`.","Un titre principal, une présentation courte, une liste de compétences et des liens pertinents.","Un CSS avec couleurs cohérentes, espacements, typographie et largeur maximale du contenu.","Une mise en page qui fonctionne sur petit écran et écran large.","Des liens reconnaissables, un focus clavier visible et un contraste lisible.","Aucun défilement horizontal accidentel ; les textes longs restent lisibles."]},{"type":"h","text":"Méthode"},{"type":"ul","items":["Commence par le HTML sans décoration.","Ajoute ensuite les styles de base et la mise en page.","Teste les largeurs étroites et le clavier.","Corrige une chose à la fois.","Relis les critères et note ce qui reste à améliorer."]},{"type":"note","text":"Le contenu d’exemple peut être fictif. N’ajoute pas de coordonnées privées ni d’informations personnelles que tu ne souhaites pas publier."}],"exercises":[{"type":"web","id":"project-capstone-web-ex","prompt":"Construis la structure de départ du portfolio, puis complète le contenu et le CSS en suivant le cahier des charges.","files":["html","css"],"starter":{"html":"<header>\n  <h1>Mon portfolio</h1>\n</header>\n<main>\n  <section aria-labelledby=\"apropos\">\n    <h2 id=\"apropos\">À propos</h2>\n    <p>Une courte présentation.</p>\n  </section>\n</main>","css":"body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.6; }\nheader, main { width: min(100% - 2rem, 48rem); margin-inline: auto; }","js":""},"solution":{"html":"<header>\n  <h1>Mon portfolio</h1>\n  <p>J’apprends à créer des expériences web accessibles.</p>\n</header>\n<main>\n  <section aria-labelledby=\"apropos\">\n    <h2 id=\"apropos\">À propos</h2>\n    <p>Je construis mes premiers projets et documente ce que j’apprends.</p>\n  </section>\n  <section aria-labelledby=\"competences\">\n    <h2 id=\"competences\">Compétences en cours</h2>\n    <ul><li>HTML sémantique</li><li>CSS responsive</li><li>JavaScript débutant</li></ul>\n  </section>\n</main>\n<footer><p>Portfolio d’apprentissage</p></footer>","css":"body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.6; color: #20252b; background: #f5f7fa; }\nheader, main, footer { width: min(100% - 2rem, 48rem); margin-inline: auto; }\nheader { padding-block: 3rem 1rem; }\nsection { background: white; padding: 1.25rem; margin-block: 1rem; border-radius: 1rem; }\n:focus-visible { outline: 3px solid #2463eb; outline-offset: 3px; }","js":""},"hint":"Indice : commence par la structure, puis ajoute les sections et le CSS. Le code de solution est un exemple possible, pas l’unique réponse."}]}]}]}],"presets":[{"id":"vide","title":"Page vide","html":"<h1>Titre</h1>\n<p>Écris ici.</p>\n","css":"body {\n  font-family: Georgia, serif;\n  line-height: 1.5;\n}\n","js":""},{"id":"carte","title":"Carte","html":"<article class=\"carte\">\n  <p class=\"kicker\">Atelier</p>\n  <h1>Page claire</h1>\n  <p>Un texte court, une bordure, assez d'air.</p>\n</article>\n","css":"body { font-family: Georgia, serif; background: #f4efe6; }\n.carte { max-width: 22rem; background: #fbf8f2; border: 1px solid #e3d9cc; border-radius: 0.75rem; padding: 1.25rem; }\n.kicker { margin: 0; letter-spacing: 0.04em; text-transform: uppercase; font-family: system-ui, sans-serif; font-size: 0.75rem; }\nh1 { margin: 0.25rem 0 0.5rem; font-size: 1.8rem; }\np { margin: 0; }\n","js":""},{"id":"barre","title":"Barre","html":"<header class=\"barre\">\n  <strong>Atrium</strong>\n  <nav>\n    <a href=\"#\">Cours</a>\n    <a href=\"#\">Atelier</a>\n  </nav>\n</header>\n<main><p>Le contenu commence sous la barre.</p></main>\n","css":"body { margin: 0; font-family: system-ui, sans-serif; }\n.barre { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 1rem; background: #1c1915; color: #f4efe6; }\nnav { display: flex; gap: 0.75rem; }\na { color: #f4efe6; }\nmain { padding: 1rem; }\n","js":""},{"id":"grille","title":"Grille","html":"<section class=\"cartes\">\n  <article>HTML</article>\n  <article>CSS</article>\n  <article>JavaScript</article>\n  <article>SQL</article>\n</section>\n","css":".cartes {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));\n  gap: 0.75rem;\n}\narticle {\n  padding: 1rem;\n  border: 1px solid #e3d9cc;\n  border-radius: 0.75rem;\n  background: white;\n}\n","js":""},{"id":"bonjour","title":"Bouton","html":"<label for=\"prenom\">Prénom</label>\n<input id=\"prenom\" />\n<button id=\"dire\" type=\"button\">Dire bonjour</button>\n<p id=\"sortie\"></p>\n","css":"body { display: grid; gap: 0.5rem; max-width: 18rem; font-family: system-ui, sans-serif; }\ninput, button { font: inherit; padding: 0.45rem; }\n","js":"const champ = document.querySelector(\"#prenom\");\nconst bouton = document.querySelector(\"#dire\");\nconst sortie = document.querySelector(\"#sortie\");\nbouton.addEventListener(\"click\", () => {\n  const prenom = champ.value.trim();\n  sortie.textContent = prenom ? \"Bonjour \" + prenom : \"Écris un prénom\";\n});\n"},{"id":"portfolio","title":"Portfolio","html":"<header>\n  <p class=\"kicker\">Portfolio d’apprentissage</p>\n  <h1>Bonjour, je construis le web.</h1>\n  <p>Des projets simples, faits pour apprendre et progresser.</p>\n</header>\n<main>\n  <section class=\"grille\">\n    <article><h2>HTML</h2><p>Une structure claire.</p></article>\n    <article><h2>CSS</h2><p>Une interface responsive.</p></article>\n    <article><h2>JavaScript</h2><p>Des interactions utiles.</p></article>\n  </section>\n</main>","css":"body { margin: 0; background: #f5f3ef; color: #252a31; font-family: system-ui, sans-serif; line-height: 1.6; }\nheader, main { width: min(100% - 2rem, 58rem); margin-inline: auto; }\nheader { padding-block: 3rem; }\nh1 { max-width: 15ch; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.05; }\n.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 1rem; }\narticle { background: white; border: 1px solid #dedbd4; border-radius: 1rem; padding: 1.25rem; }\n.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }","js":""}]};
DATA.tracks.splice(5,0,{id:"java",title:"Java",kicker:"Les applications",summary:"Un langage typé et orienté objet : serveurs, Android, outils d'entreprise.",chapters:[
{id:"java-1",title:"Java : les bases",lessons:[
{id:"java-intro",title:"Compiler et lancer un programme",summary:"JDK, javac, JVM, et la classe avec main.",minutes:10,blocks:[
{type:"p",text:"Java est **compilé** puis exécuté par la **JVM** (Java Virtual Machine). Tu écris un fichier `.java`, `javac` le transforme en bytecode `.class`, et la JVM le lance sur n'importe quel système. Le **JDK** contient tout cela. Les versions 21 et 25 sont à support long (LTS) : choisis-en une."},
{type:"code",lang:"java",caption:"Bonjour.java : le nom du fichier = le nom de la classe publique.",code:`public class Bonjour {
    public static void main(String[] args) {
        System.out.println("Bonjour, Java !");
    }
}`},
{type:"code",lang:"bash",code:`javac Bonjour.java   # compile
java Bonjour         # exécute
java Bonjour.java    # ou les deux d'un coup (Java 11+)`},
{type:"ul",items:["Tout code Java vit dans une **classe**. `main` est le point d'entrée.","`System.out.println` affiche une ligne. Chaque instruction finit par `;`.","Java distingue majuscules et minuscules : `String` n'est pas `string`.","Les accolades `{}` délimitent les blocs ; l'indentation est une convention, pas une règle."]},
{type:"note",text:"Comme Python et PHP, Java ne s'exécute pas dans cette page. Tu écris, tu compares, puis tu lances sur ta machine avec le JDK."}],
exercises:[
{type:"write",id:"java-intro-w",prompt:"Écris une classe Salut avec un main qui affiche : Salut le monde",lang:"java",starter:"",solution:`public class Salut {
    public static void main(String[] args) {
        System.out.println("Salut le monde");
    }
}`,expected:"Salut le monde",mustInclude:["class Salut","public static void main","System.out.println"]},
{type:"quiz",id:"java-intro-q",prompt:"Que produit la commande javac Bonjour.java ?",choices:["Le résultat affiché à l'écran","Un fichier Bonjour.class en bytecode","Une page HTML","Un fichier .exe obligatoire"],answer:1,explain:"javac compile le source en bytecode (.class). C'est ensuite la JVM, via la commande java, qui l'exécute."}]},
{id:"java-types",title:"Types, variables et chaînes",summary:"int, double, boolean, String, var, et le piège de ==.",minutes:12,blocks:[
{type:"p",text:"Java est **typé statiquement** : chaque variable a un type fixé, vérifié à la compilation. Une erreur de type est trouvée avant même de lancer le programme."},
{type:"table",headers:["Type","Contient","Exemple"],rows:[["int / long","entiers","int age = 20;"],["double","décimaux","double prix = 12.5;"],["boolean","vrai / faux","boolean ok = true;"],["char","un caractère","char c = 'A';"],["String","du texte (un objet)","String nom = \"Awa\";"]]},
{type:"code",lang:"java",code:`int age = 20;
var total = age * 2;          // var : le type est déduit (int)
System.out.println(7 / 2);    // 3   (division entière)
System.out.println(7 / 2.0);  // 3.5
String a = new String("hi");
System.out.println(a.equals("hi")); // true : compare le texte`},
{type:"caution",text:"Pour comparer deux String, utilise `equals`, jamais `==`. `==` compare les références (les objets en mémoire), pas le texte."},
{type:"ul",items:["Constante : `final int MAX = 10;`.","Conversion : `Integer.parseInt(\"42\")`, `String.valueOf(42)`.","Texte utile : `length()`, `toUpperCase()`, `substring(0, 3)`, `contains(\"x\")`.","`String.format(\"%.2f\", 3.14159)` donne `3,14` ou `3.14` selon la langue du système."]}],
exercises:[
{type:"write",id:"java-types-w",prompt:"Déclare String ville = \"Dakar\" et int habitants = 1000, puis affiche : Dakar : 1000 (avec une concaténation).",lang:"java",starter:"",solution:`String ville = "Dakar";
int habitants = 1000;
System.out.println(ville + " : " + habitants);`,expected:"Dakar : 1000",mustInclude:["String ville","int habitants","System.out.println"]},
{type:"quiz",id:"java-types-q",prompt:"Comment comparer correctement le contenu de deux String ?",choices:["a == b","a.equals(b)","a = b","a.same(b)"],answer:1,explain:"equals compare le texte. == teste si ce sont les mêmes objets en mémoire."}]}]},
{id:"java-2",title:"Contrôle et objets",lessons:[
{id:"java-controle",title:"Conditions, boucles, tableaux",summary:"if, switch moderne, for, for-each, int[].",minutes:12,blocks:[
{type:"code",lang:"java",code:`int[] notes = {12, 15, 9};
int somme = 0;
for (int note : notes) {      // for-each
    somme += note;
}
if (somme >= 30) {
    System.out.println("Bon total : " + somme);
} else {
    System.out.println("À reprendre");
}

int jour = 2;
String nom = switch (jour) {  // switch expression (Java 14+)
    case 1 -> "lundi";
    case 2 -> "mardi";
    default -> "autre";
};`},
{type:"ul",items:["Un tableau a une taille fixe : `notes.length` (sans parenthèses). Premier indice : 0.","`for (int i = 0; i < n; i++)` quand il faut l'indice, `for (T x : tableau)` sinon.","`while` répète tant que la condition est vraie. `break` sort, `continue` passe au tour suivant.","`switch` avec `->` n'a pas besoin de `break` et renvoie une valeur."]},
{type:"note",text:"Accéder à notes[3] dans un tableau de 3 cases lève une ArrayIndexOutOfBoundsException : c'est le bug classique des boucles."}],
exercises:[{type:"write",id:"java-controle-w",prompt:"Avec int[] notes = {12, 15, 9}, calcule la somme avec une boucle for-each et un +=, puis affiche-la.",lang:"java",starter:"int[] notes = {12, 15, 9};\n",solution:`int[] notes = {12, 15, 9};
int somme = 0;
for (int note : notes) {
    somme += note;
}
System.out.println(somme);`,expected:"36",mustInclude:["for","+=","System.out.println"]}]},
{id:"java-poo",title:"Classes, objets, encapsulation",summary:"Constructeur, private, getters, record.",minutes:14,blocks:[
{type:"p",text:"Une **classe** est un modèle ; un **objet** en est une instance créée avec `new`. L'**encapsulation** garde les champs `private` et n'expose que ce qui est utile, pour que l'objet reste toujours cohérent."},
{type:"code",lang:"java",code:`public class Livre {
    private final String titre;
    private double prix;

    public Livre(String titre, double prix) {
        this.titre = titre;
        this.prix = prix;
    }
    public String getTitre() { return titre; }
    public void remise(double pourcent) {
        prix = prix * (1 - pourcent / 100);
    }
}

Livre l = new Livre("Beloved", 16);
l.remise(10);`},
{type:"ul",items:["Le **constructeur** porte le nom de la classe et initialise l'objet. `this` désigne l'objet courant.","`private` cache un champ, `public` l'expose. `final` interdit de le réaffecter.","Un **record** (Java 16+) écrit une classe de données en une ligne : `public record Point(int x, int y) {}`.","L'**héritage** (`extends`) et les **interfaces** (`implements`) viennent ensuite : une classe peut avoir un seul parent mais plusieurs interfaces."]}],
exercises:[
{type:"write",id:"java-poo-w",prompt:"Écris une classe Lecteur avec un champ private String nom, un constructeur qui l'initialise avec this.nom, et un getter getNom().",lang:"java",starter:"",solution:`public class Lecteur {
    private String nom;

    public Lecteur(String nom) {
        this.nom = nom;
    }

    public String getNom() {
        return nom;
    }
}`,mustInclude:["class Lecteur","private String nom","this.nom","getNom"]},
{type:"quiz",id:"java-poo-q",prompt:"Pourquoi mettre un champ en private ?",choices:["Pour que le programme aille plus vite","Pour contrôler comment l'objet est lu et modifié","Parce que Java l'exige","Pour le cacher à la JVM"],answer:1,explain:"L'encapsulation empêche de mettre l'objet dans un état invalide : seules ses méthodes modifient ses champs."}]},
{id:"java-collections",title:"Collections et exceptions",summary:"ArrayList, HashMap, génériques, try/catch.",minutes:14,blocks:[
{type:"code",lang:"java",code:`import java.util.*;

List<String> langages = new ArrayList<>();
langages.add("Java");
langages.add("SQL");
System.out.println(langages.size());   // 2

Map<String, Integer> notes = new HashMap<>();
notes.put("Awa", 15);
System.out.println(notes.get("Awa"));  // 15

try {
    int n = Integer.parseInt("abc");
} catch (NumberFormatException e) {
    System.out.println("Pas un nombre");
} finally {
    System.out.println("Toujours exécuté");
}`},
{type:"ul",items:["`List` garde l'ordre, `Set` les valeurs uniques, `Map` des paires clé → valeur.","Les **génériques** `<String>` fixent le type des éléments : le compilateur refuse un intrus.","On déclare par l'interface (`List`), on crée avec la classe (`ArrayList`).","Une **exception** signale un problème d'exécution. `try/catch` la traite ; ne capture que ce que tu sais gérer.","Les exceptions *vérifiées* (comme `IOException`) doivent être capturées ou déclarées avec `throws`."]}],
exercises:[
